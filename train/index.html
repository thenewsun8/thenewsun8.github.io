<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="좀비 트레인"><meta name="theme-color" content="#123a2a">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%;color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>제주 좀비 트레인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--ink:#123a2a;--panel:#1f5a42;--cream:#fff6e5;--muted:#cfead8;--hot:#ff8a1f;--gold:#ffc93a;--blue:#2f80ed;
 --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--ink);color:var(--cream);font-family:var(--display);overflow:hidden;box-sizing:border-box;
 padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:6px;box-sizing:border-box;max-width:620px;margin:0 auto}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:34px}
h1{margin:0;font-weight:400;font-size:clamp(16px,4.8vw,21px);color:var(--hot);white-space:nowrap}
.hbtn{white-space:nowrap;font-family:var(--display);font-size:14px;border:0;border-radius:999px;padding:5px 11px;background:var(--panel);color:var(--cream);cursor:pointer}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
#cv{display:block;touch-action:none;border-radius:18px;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.sheet{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;box-sizing:border-box;text-align:center;border-radius:18px;background:linear-gradient(to bottom,rgba(18,58,42,.4),rgba(18,58,42,.94) 36%);overflow-y:auto}
.sheet h2{margin:0;font-weight:400;font-size:32px;color:var(--gold);text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.sheet p{margin:0;font-size:16px;color:var(--muted);line-height:1.55;max-width:31ch}
.sheet .stars{font-size:46px;color:var(--gold);letter-spacing:.08em;line-height:1}
.sheet canvas{width:260px;height:150px}
.unlock{background:var(--panel);border-radius:14px;padding:10px 16px;font-size:17px;color:var(--cream)}
.unlock b{font-weight:400;color:var(--gold)}
.go{font-family:var(--display);font-size:23px;border:0;border-radius:16px;padding:13px 30px;background:var(--hot);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.go.gold{background:var(--gold);color:var(--ink)}
.secret{background:#fff6e5;color:#3a2a10;border-radius:16px;padding:12px 16px;font-size:16px;line-height:1.5;max-width:30ch}
.secret b{font-weight:400;color:#e06a00}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>

<div class="app">
 <div class="bar"><h1>제주 좀비 트레인</h1><div><button type="button" class="hbtn" id="snd">소리</button></div></div>
 <div class="stage" id="stage">
  <canvas id="cv" aria-label="기차 칸. 앞으로 버튼으로 걷고, 귤 버튼으로 귤을 던져요."></canvas>

  <div class="sheet" id="title">
   <h2>제주 좀비 트레인</h2>
   <canvas id="tCv" width="520" height="300"></canvas>
   <div class="secret">꿈에 나온 좀비 트레인의 <b>비밀</b>을 알아냈어요!<br>좀비들은 사실… <b>제주 귤</b>이 너무 먹고 싶었던 거래요. 귤을 던져 주면 냠냠 먹고 <b>다시 사람</b>으로 돌아와요.</div>
   <p id="tText">기차 맨 앞까지 가면서 모두를 구해 줘!</p>
   <button type="button" class="go" id="goBtn">구출 출발!</button>
   <button type="button" class="go gold" id="contBtn" hidden>이어하기</button>
  </div>

  <div class="sheet" id="clear" hidden>
   <h2 id="cTitle">기차를 세웠다!</h2>
   <div class="stars" id="cStars"></div>
   <p id="cText"></p>
   <div class="unlock" id="cNext"></div>
   <button type="button" class="go" id="nextBtn">다음 기차 타기!</button>
  </div>

  <div class="sheet" id="over" hidden>
   <h2>좀비가 될 뻔했다!</h2>
   <p>아빠가 시원한 귤 주스를 줘서 괜찮아요. 하트를 다시 채우고 이 칸부터 다시 해요!</p>
   <button type="button" class="go" id="retryBtn">다시 힘내기!</button>
  </div>

  <div class="sheet" id="ending" hidden>
   <h2>좀비 트레인 끝!</h2>
   <div class="stars">★★★</div>
   <p>모든 좀비가 귤을 먹고 사람으로 돌아왔어요. 이제 이 기차는 <b style="font-weight:400;color:#ffc93a">귤 트레인</b>! 무서운 꿈은 이제 끝이에요.</p>
   <div class="unlock" id="eText"></div>
   <button type="button" class="go" id="againBtn">처음부터 다시</button>
  </div>
 </div>
</div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
const W=500,H=860,TAU=Math.PI*2;
const FONT='"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t;
const pick=(arr,r)=>arr[Math.floor((r==null?Math.random():r)*arr.length)%arr.length];
const hash=n=>{const s=Math.sin(n*12.9898+4.1)*43758.5453;return s-Math.floor(s)};
let T=0;

/* ===== 저장 ===== */
const SAVE="train.save";
let save={stage:1,saved:0,snd:true};
try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE)||"{}"))}catch(e){}
const store=()=>{try{localStorage.setItem(SAVE,JSON.stringify(save))}catch(e){}};
let NAME="서준";try{const s=JSON.parse(localStorage.getItem("sea.save")||"{}");if(s.names&&s.names[1])NAME=s.names[1]}catch(e){}
let PHOTO=null;try{const d=localStorage.getItem("sea.photo1");if(d){const im=new Image();im.onload=()=>{PHOTO=im};im.src=d}}catch(e){}

/* ===== 소리 ===== */
let AC=null,sound=save.snd!==false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type,g,slide,at){const a=AC;if(!a||!sound)return;type=type||"sine";g=g==null?.2:g;slide=slide||0;at=at||0;const o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+at);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+at+d);v.gain.setValueAtTime(g,a.currentTime+at);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+at+d);o.connect(v).connect(a.destination);o.start(a.currentTime+at);o.stop(a.currentTime+at+d+.02)}
function noise(d,g,at,fq){const a=AC;if(!a||!sound)return;g=g==null?.2:g;at=at||0;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const v=a.createGain();v.gain.value=g;const f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=fq||1400;s.connect(f).connect(v).connect(a.destination);s.start(a.currentTime+at)}
const SFX={
 clack(){noise(.05,.12,0,500);noise(.05,.1,.12,500)},
 throw(){noise(.1,.08,0,3000);tone(500,.1,"triangle",.06,300)},
 hit(){tone(320,.08,"sine",.25,-120);noise(.06,.12,0,2000)},
 cure(){tone(520,.12,"triangle",.22,500);[784,988,1175,1568].forEach((f,i)=>tone(f,.16,"triangle",.14,0,.08+i*.06))},
 groan(){tone(rnd(110,150),.6,"sawtooth",.05,-40)},
 peek(){tone(600,.15,"square",.08,400);tone(900,.15,"square",.06,-300,.12)},
 bite(){tone(400,.15,"square",.08,-200)},
 turn(){tone(300,.5,"sine",.15,-180)},
 ouch(){tone(500,.2,"triangle",.15,-250)},
 door(){tone(880,.3,"sine",.18);tone(660,.4,"sine",.18,0,.25)},
 boss(){tone(90,.8,"sawtooth",.18,-30);noise(.5,.2,0,600)},
 pick(){tone(660,.08,"square",.12);tone(990,.14,"square",.12,0,.08)},
 clear(){[523,659,784,1047,1318].forEach((f,i)=>tone(f,.3,"triangle",.22,0,i*.12))},
 win(){[523,659,784,1047,784,1047,1318,1568].forEach((f,i)=>tone(f,.35,"triangle",.22,0,i*.13))},
 brake(){noise(1.4,.12,0,3500);tone(1400,1.2,"sine",.04,-300)}
};
$("snd").textContent=sound?"소리":"무음";
$("snd").onclick=()=>{sound=!sound;save.snd=sound;store();$("snd").textContent=sound?"소리":"무음";if(sound){ac();SFX.pick()}};

/* ===== 그리기 도우미 (C 는 지금 그리는 캔버스) ===== */
let C=ctx;
const F=c=>{C.fillStyle=c};
function circ(x,y,r,c){F(c);C.beginPath();C.arc(x,y,r,0,TAU);C.fill()}
function ell(x,y,rx,ry,c,rot){F(c);C.beginPath();C.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),rot||0,0,TAU);C.fill()}
function rect(x,y,w,h,c){F(c);C.fillRect(x,y,w,h)}
function rr(x,y,w,h,r,c){F(c);C.beginPath();C.roundRect(x,y,w,h,r);C.fill()}
function poly(p,c){F(c);C.beginPath();C.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)C.lineTo(p[i],p[i+1]);C.closePath();C.fill()}
function line(x1,y1,x2,y2,c,w){C.strokeStyle=c;C.lineWidth=w;C.lineCap="round";C.beginPath();C.moveTo(x1,y1);C.lineTo(x2,y2);C.stroke()}
function star(x,y,ro,ri,n,c){F(c);C.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,r=i%2?ri:ro;C.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}C.closePath();C.fill()}
function heart(x,y,s,c){F(c);C.beginPath();C.moveTo(x,y+s*.9);C.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.8,y-s*1.15,x,y-s*.45);C.bezierCurveTo(x+s*.8,y-s*1.15,x+s*1.5,y-s*.1,x,y+s*.9);C.fill()}
function text(t,x,y,sz,c,al,w){C.font=sz+"px "+FONT;C.textAlign=al||"center";C.textBaseline="middle";if(w){C.lineWidth=w;C.strokeStyle="rgba(0,0,0,.55)";C.lineJoin="round";C.strokeText(t,x,y)}F(c);C.fillText(t,x,y)}
const sh=(x,y,rx)=>ell(x,y,rx,rx*.38,"rgba(0,0,0,.2)");

/* ===== 사람 그리기 도구 ===== */
const SPR=1.28,OL="rgba(40,22,28,.62)",SKIN="#f5c6a0",SKIN_D="#dca07c",SKIN_L="#ffe2cc",EINK="#23235e";
const angDiff=(a,b)=>Math.abs(((a-b)%TAU+TAU*1.5)%TAU-Math.PI);
function tint(hex,a){const n=parseInt(hex.slice(1),16),t=a>0?255:0,k=Math.abs(a);return"rgb("+[n>>16,n>>8&255,n&255].map(v=>Math.round(v+(t-v)*k)).join(",")+")"}
function seg(x1,y1,x2,y2,w,c){C.lineCap="round";C.beginPath();C.moveTo(x1,y1);C.lineTo(x2,y2);C.strokeStyle=OL;C.lineWidth=w+3;C.stroke();C.strokeStyle=c;C.lineWidth=w;C.stroke()}
function seg2(p,w,c){C.lineCap="round";C.lineJoin="round";C.beginPath();C.moveTo(p[0][0],p[0][1]);C.lineTo(p[1][0],p[1][1]);C.lineTo(p[2][0],p[2][1]);C.strokeStyle=OL;C.lineWidth=w+3;C.stroke();C.strokeStyle=c;C.lineWidth=w;C.stroke()}
/* 두 마디 관절: 어깨(엉덩이)에서 손(발)까지, 팔꿈치(무릎)가 어디로 굽을지 계산 */
function ik(sx,sy,tx,ty,l1,l2,bend){const dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy)||1,m=Math.min(d,l1+l2-.5),a=Math.atan2(dy,dx),A=Math.acos(clamp((l1*l1+m*m-l2*l2)/(2*l1*m),-1,1)),k=a+bend*A;return[[sx,sy],[sx+Math.cos(k)*l1,sy+Math.sin(k)*l1],[sx+Math.cos(a)*m,sy+Math.sin(a)*m]]}
function oell(x,y,rx,ry,c,rot){F(c);C.beginPath();C.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);C.fill();C.strokeStyle=OL;C.lineWidth=1.6;C.stroke()}
function lg(x0,y0,x1,y1,a,b){const g=C.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g}
function radG(x,y,r,a,b,c){const g=C.createRadialGradient(x+r*.3,y-r*.4,r*.08,x,y,r*1.1);g.addColorStop(0,a);g.addColorStop(.5,b);g.addColorStop(1,c);return g}
function heartP(x,y,s){C.beginPath();C.moveTo(x,y+s*.9);C.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.8,y-s*1.15,x,y-s*.45);C.bezierCurveTo(x+s*.8,y-s*1.15,x+s*1.5,y-s*.1,x,y+s*.9);C.closePath()}


/* ===== 색 ===== */
function hexRGB(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}
function mixC(a,b,t){const A=hexRGB(a),B=hexRGB(b);return"rgb("+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")+")"}

/* ===== 사람·좀비 (옆모습) ===== */
const SKINS=[["#f5c6a0","#dca07c"],["#eab48c","#c98e66"],["#f8d2b4","#e0ac88"],["#d9a07a","#b8805a"]];
const SHIRTC=["#ff6f61","#4fa3ff","#ffd24d","#7bd389","#c58bff","#ff9fd0","#f4f4f4","#5ad1c8"];
function randKind(){const s=pick(SKINS),type=pick(["man","woman","grandma","grandpa","kid","girl","tourist","man","woman"]);
 const k={skin:s[0],skinD:s[1],shirt:pick(SHIRTC),pants:pick(["#35609e","#4a4a55","#6a4a2a","#2f4f3f","#8a3a5a"]),shoe:pick(["#333333","#f4f4f4","#a0522d"]),hair:pick(["#1a1410","#3a2214","#5a3a1a"]),hs:"short",band:Math.random()<.5};
 if(type==="woman")k.hs="long";else if(type==="grandma"){k.hs="bun";k.hair="#a8a8a8"}else if(type==="grandpa"){k.hs="cap";k.hat="#3a6a3a"}else if(type==="kid"){k.kid=true;k.hs="spiky"}else if(type==="girl"){k.kid=true;k.hs="pony"}else if(type==="tourist"){k.hs="cap";k.hat=pick(["#ff6f61","#ffd24d","#4fa3ff"]);k.cam=true}
 return k}
const PLAYER_K={skin:"#f5c6a0",skinD:"#dca07c",shirt:"#ff8a1f",pants:"#2f5fae",shoe:"#e04040",hair:"#1a1410",hs:"bowl",kid:true};
function armP(sx,sy,t,w,skin,sleeve){const p=ik(sx,sy,t[0],t[1],17,16,1);seg2(p,w,skin);seg(p[0][0],p[0][1],lerp(p[0][0],p[1][0],.55),lerp(p[0][1],p[1][1],.55),w+3,sleeve);oell(p[2][0],p[2][1],w*.6,w*.55,skin)}
function drawGun(x,y,a,flash){C.save();C.translate(x,y);C.rotate(a);rr(-3,-1,8,13,3,"#3a3a46");rr(-10,-8,40,11,5,"#ff8a1f");rr(-10,-8,40,4,3,"#ffb060");rr(28,-6,12,7,3,"#2f8a3f");circ(10,-14,8,"#ff9a2a");ell(10,-21,4,2,"#2f9a3f",.4);if(flash>0){circ(44,-2,4+flash*8,"#ffd27d")}C.restore()}
function drawTang(x,y,r,big,rot){C.save();C.translate(x,y);C.rotate(rot||0);circ(0,0,r+1.5,"rgba(120,50,0,.5)");circ(0,0,r,big?"#ffa21f":"#ff8a1f");circ(-r*.3,-r*.3,r*.35,"rgba(255,255,255,.45)");for(let i=0;i<5;i++)circ(Math.cos(i*1.3)*r*.55,Math.sin(i*1.3)*r*.55,.9,"rgba(160,70,0,.45)");if(big)circ(0,-r,r*.35,"#ffa21f");ell(r*.2,-r-(big?3:1),r*.45,r*.22,"#2f9a3f",-.4);C.restore()}
function drawPerson(x,y,o){
 const k=o.k,z=clamp(o.z||0,0,1),pose=o.pose||"stand",t=o.t||0,f=o.f||1;
 const sc=(o.sc||1)*(k.kid?.72:1),hb=k.kid?1.3:1;
 const sk=z>0?mixC(k.skin,"#9bd38d",z):k.skin,skD=z>0?mixC(k.skinD,"#6fae6a",z):k.skinD;
 const shirt=k.shirt,shirtD=tint(shirt,-.22),pants=k.pants,pantsD=tint(pants,-.22);
 C.save();C.translate(x,y);if(pose!=="sit")sh(0,0,(k.fat?26:17)*sc);C.scale(sc*f,sc);
 if(o.shake)C.translate(Math.sin(T*60)*2.5,0);
 const zw=pose==="zombie",mv=o.mv?1:0,ph=t*(zw?5:9);
 if(pose==="sit")C.translate(0,56);
 const hop=o.hop&&mv?Math.abs(Math.sin(t*9))*12:0;C.translate(0,-hop);
 const bob=mv?Math.abs(Math.sin(ph))*(zw?4:3):0,lw=k.fat?13:11;
 if(pose==="sit"){for(const i of [0,1]){const hx=i?3:-3;seg2([[hx,-56],[hx+24,-54],[hx+26,-28]],lw,i?pants:pantsD);oell(hx+31,-30,8.5,4.3,k.shoe)}}
 else for(const i of [0,1]){const p2=ph+i*Math.PI,hx=i?4:-4,sx=mv?Math.sin(p2)*(zw?9:13):(i?3:-3),lift=mv?Math.max(0,Math.cos(p2))*(zw?5:7):0,p=ik(hx,-56+bob*.3,hx+sx,-lift,28,28,-1);seg2(p,lw,i?pants:pantsD);oell(p[2][0]+4,p[2][1]-2.5,8.5,4.3,k.shoe)}
 C.translate(0,-bob*.6);
 const lean=zw?.15+Math.sin(ph)*.06:(pose==="hurt"?-.3:0);C.translate(0,-56);C.rotate(lean);C.translate(0,56);
 let far=[-2+(mv?-Math.sin(ph)*8:0),-62],near=[6+(mv?Math.sin(ph)*8:0),-62];
 if(zw){far=[40,-94+Math.sin(ph)*3];near=[44,-89+Math.cos(ph)*3]}
 else if(pose==="cheer"){far=[-4,-128-Math.abs(Math.sin(T*10))*4];near=[12,-130-Math.abs(Math.cos(T*10))*4]}
 else if(pose==="eat"){far=[14,-104];near=[17,-103]}
 else if(pose==="sit"){far=[18,-58];near=[22,-56]}
 else if(pose==="hurt"||pose==="scared"){far=[-14,-122+Math.sin(T*30)*4];near=[16,-124+Math.cos(T*30)*4]}
 const hold=pose==="hold";let la=0,gx=0,gy=0;
 if(hold){la=clamp(o.aim||0,-.6,.6);const dx=Math.cos(la),dy=Math.sin(la),rc=(o.rec||0)*4;gx=4+dx*5-dx*rc;gy=-76+dy*5-dy*rc;far=[gx+dx*20,gy+dy*20-1];near=[gx,gy+2]}

function updPeople(dt){

   if(p.state==="cheer"&&p.t2>1){p.state="toSeat";let bs=null,bd=1e9;for(let i=0;i<6;i++)if(!seats[i].who){const d=Math.abs(seats[i].x-p.x);if(d<bd){bd=d;bs=i}}if(bs!=null){seats[bs].who=p;p.seat=bs}else{p.state="stand";p.seat=-1}}

    break}
  }

 }

 if(!(player.inv>0&&Math.sin(T*28)>0&&G.state==="play"))drawPerson(player.x,FLOOR,{k:PLAYER_K,z:player.z,pose:"hold",t:player.t,f:player.f,sc:1,mv:player.mv,aim:player.aim,flash:player.flash,rec:player.rec,photo:PHOTO});
 for(const tg of tangs)drawTang(tg.x,tg.y,tg.r,tg.big,tg.rot);
 for(const g of gifts){circ(g.x,g.y,16,"rgba(255,255,255,.7)");if(g.k==="big")drawTang(g.x,g.y,10,true,0);else if(g.k==="triple"){drawTang(g.x-6,g.y+2,6);drawTang(g.x+6,g.y+2,6);drawTang(g.x,g.y-6,6)}else{heart(g.x,g.y,9,"#ff6f91")}}
 for(const p of parts){C.globalAlpha=clamp(p.life*2,0,1);if(p.k==="star")star(p.x,p.y,p.r,p.r*.4,5,p.c);else if(p.k==="heart")heart(p.x,p.y,p.r,p.c);else circ(p.x,p.y,p.r,p.c)}C.globalAlpha=1;
 for(const t of texts){C.globalAlpha=clamp(t.life*1.5,0,1);text(t.t,clamp(t.x,cam.x+80,cam.x+W-80),t.y,t.sz,t.c,"center",4)}C.globalAlpha=1;
}
function drawRoute(){
 rr(0,62,W,80,0,"#16422f");const n=G.cars,w=Math.min(66,(W-70)/n-6),tot=n*(w+6),x0=(W-tot)/2;
 text(G.stage+"번 기차 · "+STG[G.stage-1].name+" → "+(STG[G.stage]?STG[G.stage].name:"종점"),W/2,80,15,"#cfead8");
 for(let i=0;i<n;i++){const x=x0+i*(w+6),cur=i===G.carI,boss=i===n-1;
  rr(x,94,w,30,boss?[6,16,6,6]:6,cur?"#ffd24d":i<G.carI?"#7dff8a":boss?"#d0604a":"#e8e2d0");circ(x+8,126,4,"#333");circ(x+w-8,126,4,"#333");
  text(boss?"기관실":cur?"지금":(i+1)+"",x+w/2,109,12,cur?"#3a2a00":"#3a3a3a")}
}
function drawHUD(){
 rr(0,0,W,62,0,"#123a2a");for(let i=0;i<player.max;i++)heart(22+i*24,31,9,i<player.hp?"#ff5a5a":"rgba(255,255,255,.2)");
 rr(W/2-70,12,140,38,19,"rgba(0,0,0,.3)");text("구한 사람 "+(save.saved||0),W/2,31,17,"#7dff8a");
 let px=W-12;if(G.big>0){text("왕귤 "+G.big,px-36,31,14,"#ffd24d");px-=80}if(G.triple>0){text("세 갈래 "+G.triple,px-40,31,14,"#ffd24d")}
}
function drawControls(){
 rr(0,CTRL,W,H-CTRL,0,"#0e2e21");
 for(const[k,dir,lab]of [["l",-1,"뒤로"],["r",1,"앞으로"]]){const b=BTN[k],on=k==="l"?G.left:G.right;rr(b.x,b.y,b.w,b.h,24,on?"#ffd24d":"#1f5a42");const cx=b.x+b.w/2,cy=b.y+b.h/2-10;poly([cx+dir*26,cy,cx-dir*16,cy-28,cx-dir*16,cy+28],on?"#3a2a00":"#cfead8");text(lab,cx,b.y+b.h-20,16,on?"#3a2a00":"#cfead8")}
 const f=BTN.f,on=G.fire;circ(f.x,f.y,f.r+6,"rgba(255,180,60,.25)");circ(f.x,f.y,f.r,on?"#ffb040":"#ff8a1f");drawTang(f.x,f.y-14,26,G.big>0,0);text("귤 던지기",f.x,f.y+44,17,"#fff","center",3);
 if(G.hint>0){C.globalAlpha=clamp(G.hint,0,1);rr(30,CEIL+4,W-60,64,16,"rgba(0,0,0,.72)");text("앞으로 버튼을 꾹! 귤 버튼으로 휙!",W/2,CEIL+26,18,"#fff");text("좀비를 톡 쳐도 귤이 날아가요",W/2,CEIL+50,15,"#ffd24d");C.globalAlpha=1}
}
function render(){
 C=ctx;ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
 rect(0,0,W,H,"#123a2a");
 ctx.save();ctx.beginPath();ctx.rect(0,CEIL,W,CARB-CEIL);ctx.clip();
 ctx.translate(-cam.x+(G.shake?rnd(-G.shake,G.shake)*.5:0),G.sway);drawCar();ctx.restore();
 drawRoute();drawHUD();drawControls();
 if(G.banner>0&&G.state!=="title"){C.globalAlpha=clamp(G.banner,0,1);rr(30,300,W-60,80,20,"rgba(18,58,42,.85)");text(G.bannerT,W/2,340,G.bannerT.length>14?24:30,"#ffd24d","center",5);C.globalAlpha=1}
 if(G.station){const sx=W/2,a=Math.min(1,(G.stopT-1.6)*2);C.globalAlpha=a;rr(sx-150,236,300,92,16,"#1f5ad0");rr(sx-142,244,284,76,12,"#fff");text(STG[Math.min(9,G.stage)].name+"역 도착!",sx,282,30,"#1f5ad0");C.globalAlpha=1}
 if(G.state==="trans"){const a=1-Math.abs(G.transT-.45)/.45;C.globalAlpha=clamp(a,0,1);rect(0,CEIL,W,CARB-CEIL,"#0e2e21");text(G.carI>=G.cars-2&&!G.built?"기관실로!":"다음 칸!",W/2,(CEIL+CARB)/2,36,"#ffd24d","center",5);C.globalAlpha=1}
 ctx.restore();
}
// 첫 화면 그림
const tCv=$("tCv");
function paintTitle(){const c=tCv.getContext("2d");C=c;c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,260,150);
 const g=c.createLinearGradient(0,0,0,150);g.addColorStop(0,"#7ccaff");g.addColorStop(1,"#e0f6ff");c.fillStyle=g;c.fillRect(0,0,260,150);rect(0,110,260,40,"#ffd84a");
 halla(130,300,70,"#9ab4d0","#fff");
 const ph=(T*.6)%1,z=ph<.5?1:Math.max(0,1-(ph-.5)*4);
 drawPerson(60,140,{k:PLAYER_K,pose:"hold",t:T,f:1,sc:1,mv:false,aim:0,flash:Math.max(0,.3-ph)*3,photo:PHOTO});
 const tx=lerp(90,190,clamp(ph*2.4,0,1));if(ph<.42)drawTang(tx,92,7,false,T*10);
 drawPerson(196,140,{k:TK,z,pose:z>.5?"zombie":ph>.75?"cheer":"eat",t:T,f:-1,sc:1,mv:z>.5});
 if(ph>.45&&ph<.8){C.globalAlpha=1-(ph-.45)/.35;for(let i=0;i<8;i++)star(196+Math.cos(i*.8+T*3)*30,80+Math.sin(i*.8+T*3)*24,6,2.4,5,"#fff27a");C.globalAlpha=1}
 if(ph>.75)text("고마워!",196,40,16,"#2a8a4a","center",3);
 C=ctx}
const TK=randKind();TK.band=true;TK.hs="short";TK.kid=false;

/* ===== 버튼 ===== */
if(save.stage>1&&save.stage<=10){$("contBtn").hidden=false;$("contBtn").textContent="이어하기 · "+save.stage+"번 기차 ("+STG[save.stage-1].name+")"}
$("tText").textContent=NAME+"(이)가 기차 맨 앞까지 가면서 모두를 구해 줘!";
$("goBtn").onclick=()=>{ac();startStage(1)};
$("contBtn").onclick=()=>{ac();startStage(clamp(save.stage,1,10))};
$("nextBtn").onclick=()=>startStage(Math.min(10,G.stage+1));
$("retryBtn").onclick=()=>{$("over").hidden=true;player.hp=player.max;player.z=0;G.state="play";buildCar()};
$("againBtn").onclick=()=>{save.stage=1;store();startStage(1)};

/* ===== 루프 ===== */
function fit(){const s=$("stage").getBoundingClientRect(),k=Math.min(s.width/W,s.height/H),w=Math.floor(W*k),h=Math.floor(H*k);
 cv.style.width=w+"px";cv.style.height=h+"px";const dpr=Math.min(2.5,window.devicePixelRatio||1);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
 ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);["title","clear","over","ending"].forEach(id=>{$(id).style.width=w+"px";$(id).style.height=h+"px"})}
new ResizeObserver(fit).observe($("stage"));fit();
G.stage=save.stage>=1&&save.stage<=10?save.stage:1;buildCar();G.banner=0;
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();if(G.state==="title")paintTitle();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.__train={G,player,ppl:()=>ppl,go:n=>startStage(n),cureAll:()=>{for(const p of ppl)if(p.zom&&p.state!=="cure")startCure(p)},fire:()=>{player.fireT=0;fireTang()},
 st:()=>({state:G.state,stage:G.stage,car:G.carI,cars:G.cars,hp:player.hp,zombies:zombies().length,door:G.doorOpen,saved:save.saved,toSpawn:G.toSpawn,x:Math.round(player.x)}),
 drawPersonAt:(c2,x,y,o)=>{C=c2;drawPerson(x,y,o);C=ctx},PLAYER_K};
})();
