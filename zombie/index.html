<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%;color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>쿵쾅 좀비 대소동</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 한 화면 게임: 위 얇은 상태줄 + 세로 무대. 시작·클리어·엔딩 판은 무대 위에 겹침 */
:root{
  --ink:#151026; --panel:#2a2144; --cream:#fff6e5; --muted:#c3b8e2; --hot:#ff5a3a; --gold:#ffc93a; --pink:#ff5ad1;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--cream);font-family:var(--display);overflow:hidden;box-sizing:border-box;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:6px;box-sizing:border-box;max-width:620px;margin:0 auto}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:34px}
h1{margin:0;font-weight:400;font-size:clamp(16px,4.8vw,21px);color:var(--hot);white-space:nowrap}
.hbtn{white-space:nowrap;font-family:var(--display);font-size:14px;border:0;border-radius:999px;padding:5px 11px;background:var(--panel);color:var(--cream);cursor:pointer}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;touch-action:none;border-radius:18px;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.sheet{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;box-sizing:border-box;text-align:center;border-radius:18px;background:linear-gradient(to bottom,rgba(21,16,38,.15),rgba(21,16,38,.9) 45%)}
.sheet[hidden]{display:none}
.sheet h2{margin:0;font-weight:400;font-size:36px;color:var(--hot);text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.sheet p{margin:0;font-size:17px;color:var(--muted);line-height:1.5;max-width:28ch}
.sheet .stars{font-size:46px;color:var(--gold);letter-spacing:.08em;line-height:1}
.sheet .unlock{background:var(--panel);border-radius:14px;padding:10px 16px;font-size:17px;color:var(--cream)}
.sheet .unlock b{font-weight:400;color:var(--gold)}
.map{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.map span{font-size:13px;padding:4px 8px;border-radius:999px;background:var(--panel);color:var(--muted)}
.map span.done{background:var(--gold);color:var(--ink)}
.map span.now{background:var(--hot);color:#fff}
.map{flex-direction:column;align-items:center;width:100%;max-width:300px}
.prog{width:100%;height:12px;background:var(--panel);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}
[hidden]{display:none!important}
.go{font-family:var(--display);font-size:24px;border:0;border-radius:16px;padding:14px 32px;background:var(--hot);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>

<div class="app">
  <div class="bar"><h1>쿵쾅 좀비 대소동</h1><div id="hud"><button type="button" class="hbtn" id="snd">소리</button></div></div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="좀비 무대. 아무 데나 누르면 쿵쾅이 달려가 쾅!"></canvas>
    <div class="sheet" id="intro">
      <h2>좀비가 몰려온다!</h2>
      <p>아무 데나 톡톡! 쿵쾅이 달려가서 쾅! 스테이지 100개! 갈수록 좀비가 점점 더 많이 몰려와요. 100번째 끝판왕까지!</p>
      <p>좀비에게 물리면 하트가 줄어요. 하트가 다 떨어져도 쿵쾅은 다시 태어나서 더 세져요.</p>
      <button type="button" class="go" id="goBtn">처음부터 출동!</button>
      <button type="button" class="go" id="contBtn" hidden style="background:var(--gold);color:var(--ink)">이어하기</button>
    </div>
    <div class="sheet" id="clear" hidden>
      <h2>스테이지 클리어!</h2>
      <div class="stars" id="cStars"></div>
      <p id="cText"></p>
      <div class="map" id="cMap"></div>
      <div class="unlock" id="cUnlock"></div>
      <button type="button" class="go" id="nextBtn">다음 스테이지</button>
    </div>
    <div class="sheet" id="ending" hidden>
      <h2>끝판왕을 물리쳤다!</h2>
      <p>좀비 왕의 성이 무너지고, 아침 해가 떴어요.</p>
      <div class="stars">★★★</div>
      <p id="eText"></p>
      <button type="button" class="go" id="againBtn">처음부터 다시</button>
    </div>
  </div>
</div>

      const cap=Math.min(70,Math.round(14+stage*.6+elapsed/400));
      if((spawnT-=dt)<=0){spawnT=Math.max(5,40-stage*.45-elapsed/150);const big=Math.random()<.3+Math.min(.4,stage*.006);const n=big?ri(3,4+Math.floor(stage/10)):ri(1,1+Math.floor(stage/20));for(let i=0;i<n&&zs.length<cap;i++)spawn()}
      if(stageK>=st.goal&&!bossOut){bossOut=true;bossQueue=st.bosses-1;spawn("boss");S.boss();shake=24;say(W/2,300,st.bosses>1?`${st.boss} ${st.bosses}명 등장!`:`${st.boss} 등장!`,"#ff5ad1",1);speak("Boss!")}
      if(bossQueue>0&&(summonT-=dt)<=0&&!st.final){summonT=180;bossQueue--;spawn("boss")}
      if(bossOut&&st.final&&(summonT-=dt)<=0){summonT=200;if(bossQueue>0){bossQueue--;spawn("boss")}for(let i=0;i<3+Math.floor(stage/20);i++)spawn();say(W/2,260,`${st.boss}이 부하를 불렀다!`,"#b36bff")}
    }
    heroStep();zStep();
    zs=zs.filter(z=>!z.dead);
    for(const p of props){p.shk-=dt;if(p.kind==="spray"){p.l-=dt;if(p.l<=0)p.gone=true}else if(p.gone&&(p.re-=dt)<=0&&!p.respawned){p.respawned=true;addProp(p.kind)}}
    props=props.filter(p=>!(p.gone&&(p.respawned||p.kind==="spray")));
    if(kos>best){best=kos;if(kos%10===0)try{localStorage.setItem("zomb-best",best)}catch(_){}}
  }
  for(const f of flyers){f.x+=f.vx*dt;f.vz-=.55*dt;f.z+=f.vz*dt;f.rot+=f.vr*dt;if(f.z<0&&f.vz<0){f.z=0;f.vz=-f.vz*.4;f.vx*=.6}f.l-=dt;
    if(f.l<=0&&!f.popped){f.popped=true;burst(f.x,f.gy-30,f.k==="boss"?40:14,["#ffc93a","#fff","#ff5ad1","#7cc46a"],f.k==="boss"?10:6)}}
  flyers=flyers.filter(f=>f.l>0);
  bolts=bolts.filter(b=>(b.l-=dt)>0);rings=rings.filter(r=>{r.r+=(r.max-r.r)*.25*dt;return (r.l-=dt)>0});
  comboT-=dt;if(comboT<=0)combo=0;popCool-=dt;groanCool-=dt;shake=Math.max(0,shake-dt*1.4);flash=Math.max(0,flash-dt);
  parts=parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.3*dt;return (p.l-=dt)>0});if(parts.length>700)parts.splice(0,parts.length-700);
  texts=texts.filter(t=>{t.y-=.6*dt;return (t.l-=dt)>0});
  draw();requestAnimationFrame(loop);
}

/* 입력 */
function pt(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener("pointerdown",e=>{if(!playing)return;A();const p=pt(e);
  if(Math.hypot(p.x-(W-62),p.y-(BOT+30))<40){if(superG>=SUPER_MAX&&hero.state!=="super"&&hero.state!=="stone"&&hero.state!=="reborn"){superG=0;hero.queue=[];hero.state="super";hero.t=0;S.superS()}else say(W-110,BOT-20,"좀비를 더 쳐요!","#fff");return}
  if(p.y<120)return;
  let tgt=null,bd=70;for(const z of zs){const d=Math.hypot(p.x-z.x,p.y-(z.y-(z.k==="boss"?120:50)*depth(z.y)));if(d<bd+(z.k==="boss"?50:0)){bd=d;tgt=z}}
  if(tgt)tap(tgt.x,tgt.y);else tap(p.x,p.y<TOP?TOP+20:p.y);
});
$("snd").onclick=()=>{sound=!sound;$("snd").textContent=sound?"소리":"무음"};
function fit(){const s=$("stage").getBoundingClientRect(),k=Math.min(s.width/W,s.height/H),w=Math.floor(W*k),h=Math.floor(H*k);
  cv.style.width=w+"px";cv.style.height=h+"px";const dpr=Math.min(2.5,window.devicePixelRatio||1);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  ["intro","clear","ending"].forEach(id=>{$(id).style.width=w+"px";$(id).style.height=h+"px"})}
new ResizeObserver(fit).observe($("stage"));
$("goBtn").onclick=()=>startGame(0);$("contBtn").onclick=()=>startGame(saved);$("nextBtn").onclick=nextStage;$("againBtn").onclick=()=>startGame(0);
if(saved>0){$("contBtn").hidden=false;$("contBtn").textContent=`이어하기 · 스테이지 ${saved+1}`}
makeProps();for(let i=0;i<5;i++)spawn();fit();requestAnimationFrame(loop);
window.__z={go:n=>{stage=n;morning=false;resetWorld();hearts=5;playing=true;["intro","clear","ending"].forEach(i=>$(i).hidden=true)},setStageK:n=>{stageK=n},
  st:()=>({kos,stage,stageK,hearts,rebirths,bossOut,clearing,playing,zs:zs.map(z=>({x:z.x,y:z.y,k:z.k,hp:z.hp})),superG,hero:hero.state,clearShown:!$("clear").hidden,endShown:!$("ending").hidden})};
})();
</script>
