<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="잉크총"><meta name="theme-color" content="#14102a">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%;color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>잉크총 대작전</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--ink:#14102a;--panel:#2a2148;--cream:#fff6e5;--muted:#c3b8e2;--hot:#2b8cff;--gold:#ffc93a;--pink:#ff5ad1;--red:#ff5a3a;
 --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--ink);color:var(--cream);font-family:var(--display);overflow:hidden;box-sizing:border-box;
 padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:6px;box-sizing:border-box;max-width:620px;margin:0 auto}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:34px}
h1{margin:0;font-weight:400;font-size:clamp(16px,4.8vw,21px);color:var(--hot);white-space:nowrap}
.hbtn{white-space:nowrap;font-family:var(--display);font-size:14px;border:0;border-radius:999px;padding:5px 11px;background:var(--panel);color:var(--cream);cursor:pointer}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;touch-action:none;border-radius:18px;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.sheet{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;box-sizing:border-box;text-align:center;border-radius:18px;background:linear-gradient(to bottom,rgba(20,16,42,.35),rgba(20,16,42,.92) 40%)}
.sheet h2{margin:0;font-weight:400;font-size:34px;color:var(--gold);text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.sheet p{margin:0;font-size:17px;color:var(--muted);line-height:1.5;max-width:30ch}
.sheet .stars{font-size:46px;color:var(--gold);letter-spacing:.08em;line-height:1}
.sheet .unlock{background:var(--panel);border-radius:14px;padding:10px 16px;font-size:17px;color:var(--cream)}
.sheet .unlock b{font-weight:400;color:var(--gold)}
.prog{width:100%;max-width:300px;height:12px;background:var(--panel);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}
.heroes{display:flex;gap:14px}
.hero{font-family:var(--display);border:4px solid transparent;border-radius:20px;background:var(--panel);color:var(--cream);padding:8px 10px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.hero.on{border-color:var(--gold);background:#3b2f66;transform:scale(1.04)}
.hero canvas{width:130px;height:150px;border-radius:12px}
.hero b{font-weight:400;font-size:22px}.hero small{color:var(--muted);font-size:13px}
.go{font-family:var(--display);font-size:24px;border:0;border-radius:16px;padding:14px 32px;background:var(--hot);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.go.gold{background:var(--gold);color:var(--ink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>

<div class="app">
 <div class="bar"><h1>잉크총 대작전</h1><div><button type="button" class="hbtn" id="snd">소리</button></div></div>
 <div class="stage" id="stage">
  <canvas id="cv" aria-label="잉크총 무대. 손가락으로 끌면 움직이고, 잉크총은 자동으로 발사돼요."></canvas>

  <div class="sheet" id="select">
   <h2>누가 출동할까?</h2>
   <div class="heroes">
    <button type="button" class="hero on" data-who="0"><canvas width="260" height="300"></canvas><b>하티</b><small>하트 모양 머리카락</small></button>
    <button type="button" class="hero" data-who="1"><canvas width="260" height="300"></canvas><b>포니</b><small>포니테일 묶은 머리</small></button>
   </div>
   <p>손가락으로 끌면 어디든 달려가요. 잉크총은 저절로 발사! 잉크칼 든 대머리 뚱땡이를 잉크 범벅으로! 빨간 바닥은 피하고, 폭탄 버튼으로 쾅! 장소 100곳, 100번째엔 뚱땡이 대왕!</p>
   <button type="button" class="go" id="goBtn">처음부터 출동!</button>
   <button type="button" class="go gold" id="contBtn" hidden>이어하기</button>
  </div>

  <div class="sheet" id="clear" hidden>
   <h2>클리어!</h2>
   <div class="stars" id="cStars"></div>
   <p id="cText"></p>
   <div class="prog"><i id="cBar"></i></div>
   <div class="unlock" id="cNext"></div>
   <button type="button" class="go" id="nextBtn">다음 장소로!</button>
  </div>

  <div class="sheet" id="dead" hidden>
   <h2>앗, 잉크 범벅!</h2>
   <p>뚱땡이한테 잉크칼을 맞았어요. 괜찮아요! 다시 일어나면 잉크총이 더 세져요.</p>
   <div class="unlock" id="dText"></div>
   <button type="button" class="go" id="retryBtn">다시 일어나기!</button>
  </div>

  <div class="sheet" id="ending" hidden>
   <h2>뚱땡이 대왕을 물리쳤다!</h2>
   <div class="stars">★★★</div>
   <p>100곳을 모두 지나 뚱땡이 대왕을 잉크로 범벅! 온 세상이 알록달록 잉크로 가득해졌어요.</p>
   <div class="unlock" id="eText"></div>
   <button type="button" class="go" id="againBtn">처음부터 다시</button>
  </div>
 </div>
</div>

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

let AC=null;let sound=save.snd!==false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type,g,slide,at){const a=ac();if(!a||!sound)return;type=type||"sine";g=g==null?.2:g;slide=slide||0;at=at||0;const o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+at);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+at+d);v.gain.setValueAtTime(g,a.currentTime+at);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+at+d);o.connect(v).connect(a.destination);o.start(a.currentTime+at);o.stop(a.currentTime+at+d+.02)}
function noise(d,g,at){const a=ac();if(!a||!sound)return;g=g==null?.2:g;at=at||0;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const v=a.createGain();v.gain.value=g;const f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=1400;s.connect(f).connect(v).connect(a.destination);s.start(a.currentTime+at)}

 clear(){[523,659,784,1047,1318].forEach((f,i)=>tone(f,.3,"triangle",.22,0,i*.12))},
 roar(){tone(80,.7,"sawtooth",.3,-40);noise(.6,.3)},

function rect(x,y,w,h,c){F(c);C.fillRect(x,y,w,h)}
function rr(x,y,w,h,r,c){F(c);C.beginPath();C.roundRect(x,y,w,h,r);C.fill()}
function poly(p,c){F(c);C.beginPath();C.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)C.lineTo(p[i],p[i+1]);C.closePath();C.fill()}
function line(x1,y1,x2,y2,c,w){C.strokeStyle=c;C.lineWidth=w;C.lineCap="round";C.beginPath();C.moveTo(x1,y1);C.lineTo(x2,y2);C.stroke()}
function star(x,y,ro,ri,n,c){F(c);C.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,r=i%2?ri:ro;C.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}C.closePath();C.fill()}

function ik(sx,sy,tx,ty,l1,l2,bend){const dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy)||1,m=Math.min(d,l1+l2-.5),a=Math.atan2(dy,dx),A=Math.acos(clamp((l1*l1+m*m-l2*l2)/(2*l1*m),-1,1)),k=a+bend*A;return[[sx,sy],[sx+Math.cos(k)*l1,sy+Math.sin(k)*l1],[sx+Math.cos(a)*m,sy+Math.sin(a)*m]]}

 const e={x,y,type,state:"walk",st:0,swT:.26,walk:rnd(0,6),face:1,inks:[],kx:0,ky:0,inkC:INKC[G.who],hitDone:false,t:rnd(0,9),hurt:0,dying:0,dieMax:.85,atkA:0,slipCD:1,slipMax:1.8,tauntCD:rnd(2,6),side:Math.random()<.5?-1:1,windT:.7};
 e.shirt=pick(SHIRTS,Math.random());e.pants=pick(PANTS,Math.random());
 if(type==="fast"){e.r=20;e.hp=Math.max(2,base-1);e.speed=115+n*.5;e.shirt="#e8413c";e.windT=.5}
 else if(type==="big"){e.r=31;e.hp=base*2;e.speed=48+n*.3;e.shirt=pick(["#8a6a4a","#4a7a5a","#5a5a8a"],Math.random());e.windT=.8}
 else if(type==="cap"){e.r=38;e.hp=base*4;e.speed=58+n*.3;e.shirt="#2e2e36";e.windT=.75}
 else if(type==="boss"){e.r=46;e.hp=120;e.speed=62;e.shirt="#3a2a5a";e.pants="#2a1640";e.atkT=2.5;e.phase=1;e.swT=.34;e.dieMax=2.2}
 else{e.r=24;e.hp=base;e.speed=62+n*.45}
 e.shirtL=tint(e.shirt,.35);e.shirtD=tint(e.shirt,-.3);e.pantsD=tint(e.pants,-.3);
 e.speed=Math.min(e.speed,135);e.maxHp=e.hp;e.reach=e.r+18+38*e.r/24;
 return e;
}
function spawnPoint(){
 for(let i=0;i<20;i++){
  const side=ri(0,3);let x,y;
  if(side===0){x=rnd(EDGE,WW-EDGE);y=EDGE+10}else if(side===1){x=rnd(EDGE,WW-EDGE);y=WH-EDGE-10}else if(side===2){x=EDGE+10;y=rnd(EDGE,WH-EDGE)}else{x=WW-EDGE-10;y=rnd(EDGE,WH-EDGE)}
  if(Math.hypot(x-player.x,y-player.y)>380)return{x,y};
 }
 return{x:EDGE+10,y:EDGE+10};
}
function spawnEnemy(){
 const n=G.stage,p=spawnPoint();let type="normal";const r=Math.random();
 if(n>=6&&r<.22)type="fast";else if(n>=12&&r<.42)type="big";
 enemies.push(makeEnemy(type,p.x,p.y));
 parts.push(...burst(p.x,p.y-20,8,"rgba(255,255,255,.7)",3));
}
function spawnBoss(){const e=makeEnemy("boss",WW/2,WH/2-170);enemies.push(e);G.boss=e}
const alive=e=>!(e.dying>0)&&!e.gone;

/* ===== 효과 ===== */
function burst(x,y,n,c,sp){const a=[];for(let i=0;i<n;i++){const an=rnd(0,TAU),v=rnd(40,140)*(sp||1)/2;a.push({x,y,vx:Math.cos(an)*v,vy:Math.sin(an)*v-60,r:rnd(3,7),c,life:rnd(.4,.9),g:260})}return a}
function say(x,y,t,c,sz){texts.push({x,y,t,c,sz:sz||22,life:1.2})}
function splat(x,y,r,c){C=g;for(let i=0;i<7;i++){const a=rnd(0,TAU),d=rnd(0,r*.9);circ(x+Math.cos(a)*d,y+Math.sin(a)*d*.6,rnd(r*.25,r*.6),c)}ell(x,y,r*.7,r*.42,c);C=ctx}
function puddle(x,y,r,c){C=g;ell(x,y,r,r*.6,c);for(let i=0;i<8;i++){const a=rnd(0,TAU),d=rnd(r*.5,r*1.3);ell(x+Math.cos(a)*d,y+Math.sin(a)*d*.6,rnd(4,10),rnd(3,7),c)}ell(x-r*.25,y-r*.2,r*.25,r*.12,"rgba(255,255,255,.35)");C=ctx;puddles.push({x,y,r});if(puddles.length>40)puddles.shift()}

/* ===== 입력 ===== */
const keys={};
addEventListener("keydown",e=>{keys[e.key]=true;if(e.key===" "){e.preventDefault();tryBomb()}if(e.key.startsWith("Arrow"))e.preventDefault();ac()});
addEventListener("keyup",e=>{keys[e.key]=false});
const joy={active:false,ox:0,oy:0,dx:0,dy:0,id:null},aimS={active:false,ox:0,oy:0,dx:0,dy:0,id:null};
const BOMB={x:W-70,y:H-80,r:46};
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener("pointerdown",e=>{ac();if(G.state!=="play")return;const p=cpos(e);
 if(Math.hypot(p.x-BOMB.x,p.y-BOMB.y)<BOMB.r+10){tryBomb();return}
 try{cv.setPointerCapture(e.pointerId)}catch(_){}
 if(!joy.active){joy.active=true;joy.id=e.pointerId;joy.ox=p.x;joy.oy=p.y;joy.dx=joy.dy=0}
 else if(!aimS.active){aimS.active=true;aimS.id=e.pointerId;aimS.ox=p.x;aimS.oy=p.y;aimS.dx=aimS.dy=0}
});
cv.addEventListener("pointermove",e=>{const p=cpos(e);
 if(joy.active&&e.pointerId===joy.id){let dx=p.x-joy.ox,dy=p.y-joy.oy;const l=Math.hypot(dx,dy),R=58;if(l>R){joy.ox=p.x-dx/l*R;joy.oy=p.y-dy/l*R;dx=dx/l*R;dy=dy/l*R}joy.dx=dx/R;joy.dy=dy/R}
 else if(aimS.active&&e.pointerId===aimS.id){const dx=p.x-aimS.ox,dy=p.y-aimS.oy,l=Math.hypot(dx,dy);if(l>14){aimS.dx=dx/l;aimS.dy=dy/l}}
});
const release=e=>{if(joy.active&&e.pointerId===joy.id){joy.active=false;joy.dx=joy.dy=0}if(aimS.active&&e.pointerId===aimS.id){aimS.active=false;aimS.dx=aimS.dy=0}};
cv.addEventListener("pointerup",release);cv.addEventListener("pointercancel",release);
addEventListener("blur",()=>{joy.active=false;aimS.active=false;for(const k in keys)keys[k]=false});

/* ===== 싸움 ===== */
function shoot(a){
 const triple=player.pw.triple>0,big=player.pw.big>0;
 for(const an of triple?[a-.24,a,a+.24]:[a])bullets.push({x:player.x+Math.cos(an)*30,y:player.y+Math.sin(an)*30,vx:Math.cos(an)*560,vy:Math.sin(an)*560,r:big?13:7,dmg:save.dmg*(big?2:1),pierce:big?2:0,life:.68,c:INKC[G.who]});
 player.flash=1;player.recoil=1;SFX.pew();
}
function hitEnemy(e,b){
 if(!alive(e))return;
 const kb=.22*Math.min(1,(24/e.r)*(24/e.r));
 e.hp-=b.dmg;e.kx+=b.vx*kb;e.ky+=b.vy*kb;e.hurt=.16;
 if(e.inks.length<14){if(Math.random()<.35)e.inks.push({h:1,x:6+rnd(-11,10),y:-112+rnd(-10,8),r:rnd(3,5.5)});else e.inks.push({x:4+rnd(-24,24),y:-66+rnd(-24,20),r:rnd(4,8)})}
 parts.push(...burst(b.x,b.y-75*e.r/24,6,b.c,1));
 if(Math.random()<.5)splat(b.x+rnd(-10,10),b.y+rnd(0,20),rnd(8,16),b.c);
 if(e.type==="boss"){SFX.bossHit();G.shake=Math.max(G.shake,3)}else SFX.splat();
 if(e.state==="taunt"){e.state="walk";say(e.x,e.y-e.r*7.2,"앗 차가워!","#fff",18)}
 if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
 if(!alive(e))return;
 e.dying=e.dieMax;kills++;
 if(G.comboT>0)G.combo++;else G.combo=1;G.comboT=2.6;
 if(G.combo>=2){G.comboShow=1.3;SFX.combo(G.combo)}
 G.bomb=Math.min(1,G.bomb+.25);
 if(G.bomb>=1&&!G.bombHint){G.bombHint=true;say(player.x,player.y-195,"잉크 폭탄 준비! 오른쪽 아래 버튼!","#ffd24d",22)}
 say(e.x,e.y-e.r*7.2,pick(["철퍼덕!","뿅!","으아아~","잉크 범벅!","꽈당!"],Math.random()),"#fff",e.type==="boss"?44:26);
 parts.push(...burst(e.x,e.y-60*e.r/24,e.type==="boss"?50:14,e.inkC,e.type==="boss"?3:1.6));
 SFX.ko();G.stop=.06;G.shake=Math.max(G.shake,6);
 if(e.type==="boss"){G.slow=1.6;G.shake=24;SFX.roar();for(const o of enemies)if(o!==e&&alive(o)){o.dying=o.dieMax}return}
 if(e.type==="cap")say(e.x,e.y-e.r*7.2-30,"대장 뚱땡이 처치!","#ffd24d",26);
 if(kills>=goal&&!door){G.slow=.9;openDoor()}
}
function finishEnemy(e){
 e.gone=true;
 puddle(e.x,e.y,e.r*1.4,e.inkC);
 parts.push(...burst(e.x,e.y-30,e.type==="boss"?60:14,e.inkC,e.type==="boss"?3:1.5));
 parts.push(...burst(e.x,e.y-30,8,"#fff",1.2));
 SFX.pop();
 if(e.type==="boss"){G.state="bossdead";G.bossT=2.2;return}
 if(Math.random()<(e.type==="cap"?1:.22))items.push({x:e.x,y:e.y,k:pick(["triple","big","speed","heart"],Math.random()),t:0});
}
function openDoor(){
 let best=null;for(let i=0;i<30;i++){const x=rnd(EDGE+80,WW-EDGE-80),y=rnd(EDGE+80,WH-EDGE-80),d=Math.hypot(x-player.x,y-player.y);if(d>340&&d<760){best={x,y};break}}
 if(!best)best={x:clamp(player.x+rnd(-500,500),EDGE+80,WW-EDGE-80),y:clamp(player.y+rnd(-500,500),EDGE+80,WH-EDGE-80)};
 door={x:best.x,y:best.y,t:0};G.hint=0;
 say(player.x,player.y-195,"출구 문이 열렸다! 뚱땡이들이 도망가요!","#ffd24d",22);
 for(const e of enemies)if(alive(e)&&e.type!=="boss"){e.state="flee";e.st=99}
 SFX.door();
}
function hitPlayer(src){
 if(player.inv>0||G.state!=="play"||player.jumpT>0)return;
 player.hp-=1;player.inv=1.4;player.hurt=.35;player.inkFace=2.5;hitsTaken++;
 const a=Math.atan2(player.y-src.y,player.x-src.x);player.kx=Math.cos(a)*460;player.ky=Math.sin(a)*460;
 parts.push(...burst(player.x,player.y-90,14,EINK,1.5));
 say(player.x,player.y-195,pick(["으악!","앗 따가워!","잉크 묻었다!"],Math.random()),"#ff5a3a",28);SFX.ouch();G.shake=12;G.stop=.1;
 if(player.hp<=0){G.state="dying";G.dieT=1.3;SFX.dead();save.deaths=(save.deaths||0)+1;save.dmg+=1;store()}
}
function tryBomb(){
 if(G.state!=="play"||G.bomb<1||player.jumpT>0)return;
 G.bomb=0;player.jumpT=.5;SFX.jump();say(player.x,player.y-195,"잉크 폭탄!!","#ffd24d",32);
}

/* ===== 업데이트 ===== */
function update(dt){
 T+=dt;
 if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);
 if(G.banner>0)G.banner-=dt;if(G.hint>0)G.hint-=dt;if(G.bossIntro>0)G.bossIntro-=dt;
 if(G.comboT>0)G.comboT-=dt;if(G.comboShow>0)G.comboShow-=dt;
 const th=TH[G.stage-1];
 for(const a of amb){
  switch(a.k){
   case "petal":case "leaf":a.y+=dt*(30+a.r*6);a.x+=Math.sin(T*2+a.ph)*dt*30;break;
   case "snow":a.y+=dt*(40+a.r*8);a.x+=Math.sin(T+a.ph)*dt*20;break;
   case "blizzard":a.y+=dt*180;a.x+=dt*120;break;
   case "bubble":case "ember":case "spore":a.y-=dt*(25+a.r*8);a.x+=Math.sin(T*3+a.ph)*dt*25;break;
   case "firefly":a.x+=Math.cos(T+a.ph)*dt*30;a.y+=Math.sin(T*1.3+a.ph)*dt*30;break;
   case "dust":a.x+=dt*(60+a.r*10);a.y+=Math.sin(T+a.ph)*dt*10;break;
   case "sandstorm":a.x+=dt*(260+a.r*20);a.y+=Math.sin(T*3+a.ph)*dt*30;break;
  }
  if(a.y>H+12||a.y<-12||a.x>W+12||a.x<-12)Object.assign(a,newAmb(a.k,false));
 }
 for(const p of parts){p.vx*=.96;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);
 for(const t of texts){t.life-=dt;t.y-=dt*30}texts=texts.filter(t=>t.life>0);
 if(G.state==="dying"){G.dieT-=dt;player.inv=1;player.hurt=.3;if(G.dieT<=0){G.state="dead";$("dText").innerHTML="잉크 세기 <b>"+save.dmg+"</b> 으로 업! 뚱땡이가 더 빨리 뿅!";$("dead").hidden=false}return}
 if(G.state==="bossdead"){G.bossT-=dt;G.shake=6;if(Math.random()<.5)parts.push(...burst(rnd(cam.x,cam.x+W),rnd(cam.y,cam.y+H),10,pick(["#ff4040","#ffd400","#2f80ed","#2fb36a","#ff2bd6"],Math.random()),1.5));
  if(G.bossT<=0){G.state="ending";SFX.win();save.stage=1;store();$("eText").innerHTML="잉크 세기 <b>"+save.dmg+"</b> · 다시 일어난 횟수 <b>"+(save.deaths||0)+"</b>";$("ending").hidden=false}
  return}
 if(G.state!=="play")return;
 stageT+=dt;
 // 주인공 이동
 let mx=0,my=0;
 if(joy.active){mx=joy.dx;my=joy.dy;if(Math.hypot(mx,my)<.15)mx=my=0}
 if(keys.ArrowLeft||keys.a)mx-=1;if(keys.ArrowRight||keys.d)mx+=1;if(keys.ArrowUp||keys.w)my-=1;if(keys.ArrowDown||keys.s)my+=1;
 let l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l;l=1}
 const sp=player.speed*(player.pw.speed>0?1.5:1);
 player.x+=mx*sp*dt+player.kx*dt;player.y+=my*sp*dt+player.ky*dt;
 player.kx*=.82;player.ky*=.82;
 player.moving=l>.1;if(player.moving)player.walk+=dt*13;
 player.inv=Math.max(0,player.inv-dt);player.flash=Math.max(0,player.flash-dt*8);player.recoil=Math.max(0,player.recoil-dt*10);
 player.hurt=Math.max(0,player.hurt-dt);player.inkFace=Math.max(0,player.inkFace-dt);player.fireT-=dt;
 player.pony+=(((player.moving?.3:0)+Math.sin(player.walk)*.15*(player.moving?1:0)+Math.sin(T*2)*.05)-player.pony)*Math.min(1,dt*8);
 for(const k in player.pw)player.pw[k]=Math.max(0,player.pw[k]-dt);
 // 잉크 폭탄 점프 → 쾅
 if(player.jumpT>0){player.jumpT-=dt;player.jump=Math.sin(clamp(1-player.jumpT/.5,0,1)*Math.PI)*70;
  if(player.jumpT<=0){player.jump=0;G.wave={x:player.x,y:player.y,r:20,max:340,hit:new Set()};SFX.bomb();G.shake=22;G.stop=.08;knives=[];parts.push(...burst(player.x,player.y-20,30,INKC[G.who],3))}}
 if(G.wave){const wv=G.wave;wv.r+=dt*850;
  for(const e of enemies){if(!alive(e)||wv.hit.has(e))continue;if(dist(e,wv)<wv.r+e.r){wv.hit.add(e);const a=Math.atan2(e.y-wv.y,e.x-wv.x);hitEnemy(e,{dmg:e.type==="boss"?14:6+Math.floor(G.stage/8),vx:Math.cos(a)*2600,vy:Math.sin(a)*2600,x:e.x,y:e.y,c:INKC[G.who]})}}
  if(wv.r>=wv.max){for(let i=0;i<14;i++){const a=i/14*TAU;splat(wv.x+Math.cos(a)*wv.max*.8,wv.y+Math.sin(a)*wv.max*.8,rnd(18,30),INKC[G.who])}G.wave=null}}
 // 조준 + 자동 발사
 let fire=null;
 if(aimS.active&&(aimS.dx||aimS.dy))fire=Math.atan2(aimS.dy,aimS.dx);
 else{let best=null,bd=430;for(const e of enemies){if(!alive(e)||e.state==="flee")continue;const d=dist(e,player)-e.r;if(d<bd){bd=d;best=e}}
  if(!best&&door)for(const e of enemies){if(!alive(e))continue;const d=dist(e,player)-e.r;if(d<260&&d<bd){bd=d;best=e}}
  if(best)fire=Math.atan2(best.y-player.y,best.x-player.x)}
 if(fire!==null&&player.jumpT<=0){player.aim=fire;if(player.fireT<=0){shoot(fire);player.fireT=fireInterval()}}
 else if(player.moving)player.aim=Math.atan2(my,mx);
 const ca=Math.cos(player.aim);if(ca>.15)player.face=1;else if(ca<-.15)player.face=-1;
 // 잉크 총알
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  for(const e of enemies){if(!alive(e)||b.dead||(b.hit&&b.hit.includes(e)))continue;if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r+6){(b.hit||(b.hit=[])).push(e);hitEnemy(e,b);if(b.pierce>0)b.pierce--;else b.dead=true}}
  if(b.life<=0&&!b.dead){b.dead=true;splat(b.x,b.y,rnd(10,18),b.c)}
  if(b.x<EDGE-20||b.x>WW-EDGE+20||b.y<EDGE-20||b.y>WH-EDGE+20){b.dead=true;splat(clamp(b.x,EDGE,WW-EDGE),clamp(b.y,EDGE,WH-EDGE),14,b.c)}
 }
 bullets=bullets.filter(b=>!b.dead);
 // 뚱땡이들
 for(const e of enemies){
  e.t+=dt;e.hurt=Math.max(0,e.hurt-dt);e.slipCD-=dt;e.tauntCD-=dt;
  if(e.dying>0){e.dying-=dt;e.x+=e.kx*dt;e.y+=e.ky*dt;e.kx*=.9;e.ky*=.9;if(e.dying<=0)finishEnemy(e);continue}
  e.st-=dt;
  const d=dist(e,player),ang=Math.atan2(player.y-e.y,player.x-e.x);
  if(e.state!=="swing"&&e.state!=="charge"&&e.state!=="flee"&&e.state!=="slip")e.face=player.x>=e.x?1:-1;
  let vx=0,vy=0;
  if(e.type==="boss")bossAI(e,dt,d,ang);
  else switch(e.state){
   case "walk":{const aa=ang+(d>170?e.side*.55:0);vx=Math.cos(aa)*e.speed;vy=Math.sin(aa)*e.speed;
    if(d<e.reach){e.state="wind";e.st=e.windT;e.atkA=ang;SFX.grunt();if(Math.random()<.35)say(e.x,e.y-e.r*7.2,pick(["에잇!","받아라!","이얍!"],Math.random()),"#fff",18)}
    else if(d>230&&e.tauntCD<=0&&Math.random()<dt*.3){e.state="taunt";e.st=1.2;e.tauntCD=7;say(e.x,e.y-e.r*7.2,pick(TAUNTS,Math.random()),"#fff",19)}
    break}
   case "wind":vx=Math.cos(ang)*e.speed*.12;vy=Math.sin(ang)*e.speed*.12;if(e.st<=0){e.state="swing";e.st=e.swT;e.hitDone=false;SFX.swing()}break;
   case "swing":if(!e.hitDone&&e.st<e.swT*.5){e.hitDone=true;if(d<e.reach+18&&angDiff(ang,e.atkA)<1.05)hitPlayer(e);else if(Math.random()<.4)say(e.x,e.y-e.r*7.2,pick(["헛방!","어라?","어디 갔지?"],Math.random()),"#fff",18)}if(e.st<=0){e.state="rest";e.st=.8}break;
   case "rest":if(e.st<=0)e.state="walk";break;
   case "taunt":if(Math.floor(e.st*8)!==Math.floor((e.st+dt)*8))SFX.drum();if(e.st<=0)e.state="walk";break;
   case "slip":if(e.st<=0){e.state=door?"flee":"walk";e.slipCD=2.5}break;
   case "flee":{const fa=ang+Math.PI;vx=Math.cos(fa)*e.speed*1.3;vy=Math.sin(fa)*e.speed*1.3;e.face=vx>=0?1:-1;if(Math.random()<dt*.5)say(e.x,e.y-e.r*7.2,pick(["으악!","도망가자!","살려줘~"],Math.random()),"#fff",18)}break;
  }
  // 잉크 웅덩이에서 미끄덩
  if((e.state==="walk"||e.state==="flee")&&e.slipCD<=0&&e.type!=="boss")for(const p of puddles){if(Math.hypot(p.x-e.x,p.y-e.y)<p.r*.8){if(Math.random()<.5){e.state="slip";e.st=e.slipMax=1.8;SFX.slip();say(e.x,e.y-70,"미끄덩!","#fff",26)}e.slipCD=1.5;break}}
  if(e.state==="walk"||e.state==="flee"||e.state==="wind")e.walk+=dt*9*(e.type==="fast"?1.6:1);
  for(const o of enemies){if(o===e||!alive(o))continue;const dd=dist(e,o),m=e.r+o.r-6;if(dd<m&&dd>0){e.x+=(e.x-o.x)/dd*(m-dd)*.5;e.y+=(e.y-o.y)/dd*(m-dd)*.5}}
  e.x+=(vx+e.kx)*dt;e.y+=(vy+e.ky)*dt;e.kx*=.8;e.ky*=.8;

function bossAI(e,dt,d,ang){
 if(e.hp<e.maxHp*.5&&e.phase===1){e.phase=2;say(e.x,e.y-e.r*7.6,"으아아! 대머리에서 김 난다!!","#ff3030",28);SFX.roar();G.shake=14}
 const fast=e.phase===2?.75:1,minions=enemies.filter(o=>o.type!=="boss"&&alive(o)).length;
 switch(e.state){
  case "walk":{e.atkT-=dt;const sp=e.speed*(e.phase===2?1.3:1);e.x+=Math.cos(ang)*sp*dt;e.y+=Math.sin(ang)*sp*dt;e.walk+=dt*6;
   if(d<e.reach){e.state="wind";e.st=.8*fast;e.atkA=ang;SFX.grunt();say(e.x,e.y-e.r*7.2,"에잇!","#fff",26)}
   else if(e.atkT<=0){const r=Math.random();e.atkA=ang;
    if(r<.38){e.state="cwind";e.st=1.05*fast;say(e.x,e.y-e.r*7.2,"배치기 간다!","#ff3030",28)}
    else if(r<.72||minions>=4){e.state="twind";e.st=.65*fast;say(e.x,e.y-e.r*7.2,"잉크칼 받아라!","#ff3030",26)}
    else{e.state="summon";e.st=.8;say(e.x,e.y-e.r*7.2,"부하들아, 나와라!","#ffd24d",26)}}
   break}
  case "wind":if(e.st<=0){e.state="swing";e.st=e.swT;e.hitDone=false;SFX.swing()}break;
  case "swing":if(!e.hitDone&&e.st<e.swT*.5){e.hitDone=true;SFX.stomp();G.shake=8;if(d<e.reach+18&&angDiff(ang,e.atkA)<1.05)hitPlayer(e)}if(e.st<=0){e.state="rest";e.st=.9}break;
  case "cwind":if(e.st<=0){e.state="charge";e.st=.8;e.face=Math.cos(e.atkA)>=0?1:-1;SFX.roar()}break;
  case "charge":e.x+=Math.cos(e.atkA)*520*dt;e.y+=Math.sin(e.atkA)*520*dt;e.walk+=dt*20;if(Math.random()<.5)parts.push(...burst(e.x,e.y,2,"rgba(255,255,255,.6)",1));
   if(d<e.r+player.r+6)hitPlayer(e);
   if(e.st<=0||e.x<=EDGE||e.x>=WW-EDGE||e.y<=EDGE||e.y>=WH-EDGE){e.state="slip";e.st=e.slipMax=1.7;G.shake=14;SFX.stomp();SFX.slip();say(e.x,e.y-90,"꽈당! 어지러워~","#ffd24d",28)}break;
  case "twind":if(e.st<=0){for(let i=-1;i<=1;i++){const a=ang+i*.3;knives.push({x:e.x+Math.cos(a)*60,y:e.y+Math.sin(a)*60,vx:Math.cos(a)*290,vy:Math.sin(a)*290,rot:0,life:2.4})}SFX.swing();e.state="rest";e.st=.8}break;
  case "summon":if(e.st<=0){for(let i=0;i<2;i++){const p=spawnPoint();enemies.push(makeEnemy(i?"fast":"normal",p.x,p.y))}e.state="rest";e.st=.6}break;
  case "slip":if(e.st<=0){e.state="walk";e.atkT=1.2}break;
  case "rest":if(e.st<=0){e.state="walk";e.atkT=e.phase===2?1.4:2.3}break;
 }
}

heroBtns[G.who].classList.add("on");heroBtns[1-G.who].classList.remove("on");
if(save.stage>1){$("contBtn").hidden=false;$("contBtn").textContent="이어하기 · "+save.stage+"탄 "+TH[save.stage-1][0]}
$("goBtn").onclick=()=>{ac();save.dmg=1;save.rate=0;save.deaths=0;G.bomb=0;startStage(1)};
$("contBtn").onclick=()=>{ac();startStage(clamp(save.stage,1,100))};
$("nextBtn").onclick=()=>startStage(Math.min(100,G.stage+1));
$("retryBtn").onclick=()=>startStage(G.stage);
$("againBtn").onclick=()=>{save.dmg=1;save.rate=0;save.deaths=0;save.stage=1;G.bomb=0;store();startStage(1)};

/* ===== 루프 ===== */
function fit(){const s=$("stage").getBoundingClientRect(),k=Math.min(s.width/W,s.height/H),w=Math.floor(W*k),h=Math.floor(H*k);
 cv.style.width=w+"px";cv.style.height=h+"px";const dpr=Math.min(2.5,window.devicePixelRatio||1);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
 ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
 ["select","clear","dead","ending"].forEach(id=>{$(id).style.width=w+"px";$(id).style.height=h+"px"})}
new ResizeObserver(fit).observe($("stage"));fit();
let last=performance.now();
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;
 if(G.stop>0){G.stop-=dt;dt=0}else if(G.slow>0){G.slow-=dt;dt*=.35}
 if(G.state==="select")paintHeroes();
 update(dt);render();requestAnimationFrame(loop)}
player=newPlayer();requestAnimationFrame(loop);
window.__ink={go:n=>startStage(n),st:()=>({state:G.state,stage:G.stage,kills,goal,hp:player.hp,enemies:enemies.length,door:!!door,bullets:bullets.length,bomb:G.bomb}),G,
 kill:()=>{for(const e of [...enemies])killEnemy(e)},player:()=>player,door:()=>door,enemies:()=>enemies,bomb:()=>{G.bomb=1;tryBomb()},
 portrait:(c2,who,x,y,sc)=>{C=c2;c2.save();c2.translate(x,y);drawHero(0,0,who,{sc,face:1,walk:0,moving:false,aim:-.2,ink:INKC[who],pony:.2});c2.restore();C=ctx},
 fatty:(c2,x,y,state)=>{C=c2;const e=makeEnemy("normal",0,0);e.state=state||"walk";e.st=.1;e.face=-1;drawFatty(x,y,e);C=ctx}};
})();
</script>
