<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="잉크총"><meta name="theme-color" content="#14102a">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%;color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>잉크총 대작전</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--ink:#14102a;--panel:#2a2148;--cream:#fff6e5;--muted:#c3b8e2;--hot:#2b8cff;--gold:#ffc93a;--pink:#ff5ad1;--red:#ff5a3a;
 --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--ink);color:var(--cream);font-family:var(--display);overflow:hidden;box-sizing:border-box;
 padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:6px;box-sizing:border-box;max-width:620px;margin:0 auto}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:34px}
h1{margin:0;font-weight:400;font-size:clamp(16px,4.8vw,21px);color:var(--hot);white-space:nowrap}
.hbtn{white-space:nowrap;font-family:var(--display);font-size:14px;border:0;border-radius:999px;padding:5px 11px;background:var(--panel);color:var(--cream);cursor:pointer}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;touch-action:none;border-radius:18px;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.sheet{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;box-sizing:border-box;text-align:center;border-radius:18px;background:linear-gradient(to bottom,rgba(20,16,42,.35),rgba(20,16,42,.92) 40%)}
.sheet h2{margin:0;font-weight:400;font-size:34px;color:var(--gold);text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.sheet p{margin:0;font-size:17px;color:var(--muted);line-height:1.5;max-width:30ch}
.sheet .stars{font-size:46px;color:var(--gold);letter-spacing:.08em;line-height:1}
.sheet .unlock{background:var(--panel);border-radius:14px;padding:10px 16px;font-size:17px;color:var(--cream)}
.sheet .unlock b{font-weight:400;color:var(--gold)}
.prog{width:100%;max-width:300px;height:12px;background:var(--panel);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}
.heroes{display:flex;gap:14px}
.hero{font-family:var(--display);border:4px solid transparent;border-radius:20px;background:var(--panel);color:var(--cream);padding:8px 10px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.hero.on{border-color:var(--gold);background:#3b2f66;transform:scale(1.04)}
.hero canvas{width:130px;height:150px;border-radius:12px}
.hero b{font-weight:400;font-size:22px}.hero small{color:var(--muted);font-size:13px}
.go{font-family:var(--display);font-size:24px;border:0;border-radius:16px;padding:14px 32px;background:var(--hot);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.go.gold{background:var(--gold);color:var(--ink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>

<div class="app">
 <div class="bar"><h1>잉크총 대작전</h1><div><button type="button" class="hbtn" id="snd">소리</button></div></div>
 <div class="stage" id="stage">
  <canvas id="cv" aria-label="잉크총 무대. 손가락으로 끌면 움직이고, 잉크총은 자동으로 발사돼요."></canvas>

  <div class="sheet" id="select">
   <h2>누가 출동할까?</h2>
   <div class="heroes">
    <button type="button" class="hero on" data-who="0"><canvas width="260" height="300"></canvas><b>하티</b><small>하트머리 소년</small></button>
    <button type="button" class="hero" data-who="1"><canvas width="260" height="300"></canvas><b>포니</b><small>긴머리 묶은 소녀</small></button>
   </div>
   <p>손가락으로 끌면 어디든 달려가요. 잉크총은 저절로 발사! 대머리 뚱땡이를 잉크로 범벅 만들고 출구 문으로! 장소 100곳, 100번째엔 뚱땡이 대왕!</p>
   <button type="button" class="go" id="goBtn">처음부터 출동!</button>
   <button type="button" class="go gold" id="contBtn" hidden>이어하기</button>
  </div>

  <div class="sheet" id="clear" hidden>
   <h2>클리어!</h2>
   <div class="stars" id="cStars"></div>
   <p id="cText"></p>
   <div class="prog"><i id="cBar"></i></div>
   <div class="unlock" id="cNext"></div>
   <button type="button" class="go" id="nextBtn">다음 장소로!</button>
  </div>

  <div class="sheet" id="dead" hidden>
   <h2>앗, 잉크 범벅!</h2>
   <p>뚱땡이한테 잉크칼을 맞았어요. 괜찮아요! 다시 일어나면 잉크총이 더 세져요.</p>
   <div class="unlock" id="dText"></div>
   <button type="button" class="go" id="retryBtn">다시 일어나기!</button>
  </div>

  <div class="sheet" id="ending" hidden>
   <h2>뚱땡이 대왕을 물리쳤다!</h2>
   <div class="stars">★★★</div>
   <p>100곳을 모두 지나 뚱땡이 대왕을 잉크로 범벅! 온 세상이 알록달록 잉크로 가득해졌어요.</p>
   <div class="unlock" id="eText"></div>
   <button type="button" class="go" id="againBtn">처음부터 다시</button>
  </div>
 </div>
</div>

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type,g,slide,at){const a=ac();if(!a||!sound)return;type=type||"sine";g=g==null?.2:g;slide=slide||0;at=at||0;const o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+at);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+at+d);v.gain.setValueAtTime(g,a.currentTime+at);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+at+d);o.connect(v).connect(a.destination);o.start(a.currentTime+at);o.stop(a.currentTime+at+d+.02)}
function noise(d,g,at){const a=ac();if(!a||!sound)return;g=g==null?.2:g;at=at||0;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const v=a.createGain();v.gain.value=g;const f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=1400;s.connect(f).connect(v).connect(a.destination);s.start(a.currentTime+at)}

 clear(){[523,659,784,1047,1318].forEach((f,i)=>tone(f,.3,"triangle",.22,0,i*.12))},

function rr(x,y,w,h,r,c){F(c);C.beginPath();C.roundRect(x,y,w,h,r);C.fill()}
function poly(p,c){F(c);C.beginPath();C.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)C.lineTo(p[i],p[i+1]);C.closePath();C.fill()}
function line(x1,y1,x2,y2,c,w){C.strokeStyle=c;C.lineWidth=w;C.lineCap="round";C.beginPath();C.moveTo(x1,y1);C.lineTo(x2,y2);C.stroke()}
function star(x,y,ro,ri,n,c){F(c);C.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,r=i%2?ri:ro;C.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}C.closePath();C.fill()}

function update(dt){
 T+=dt;
 if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);
 if(G.banner>0)G.banner-=dt;if(G.hint>0)G.hint-=dt;if(G.bossIntro>0)G.bossIntro-=dt;
 // 공중 효과
 const th=TH[G.stage-1];
 for(const a of amb){
  switch(a.k){
   case "petal":case "leaf":a.y+=dt*(30+a.r*6);a.x+=Math.sin(T*2+a.ph)*dt*30;break;
   case "snow":a.y+=dt*(40+a.r*8);a.x+=Math.sin(T+a.ph)*dt*20;break;
   case "blizzard":a.y+=dt*180;a.x+=dt*120;break;
   case "bubble":case "ember":case "spore":a.y-=dt*(25+a.r*8);a.x+=Math.sin(T*3+a.ph)*dt*25;break;
   case "firefly":a.x+=Math.cos(T+a.ph)*dt*30;a.y+=Math.sin(T*1.3+a.ph)*dt*30;break;
   case "dust":a.x+=dt*(60+a.r*10);a.y+=Math.sin(T+a.ph)*dt*10;break;
   case "sandstorm":a.x+=dt*(260+a.r*20);a.y+=Math.sin(T*3+a.ph)*dt*30;break;
  }
  if(a.y>H+12||a.y<-12||a.x>W+12||a.x<-12){Object.assign(a,newAmb(a.k,false))}
 }
 if(G.state==="dying"){G.dieT-=dt;player.inv=1;if(G.dieT<=0){G.state="dead";$("dText").innerHTML="잉크 세기 <b>"+save.dmg+"</b> 으로 업! 뚱땡이가 더 빨리 뿅!";$("dead").hidden=false}return}
 if(G.state==="bossdead"){G.bossT-=dt;G.shake=6;if(Math.random()<.5)parts.push(...burst(rnd(cam.x,cam.x+W),rnd(cam.y,cam.y+H),10,pick(["#ff4040","#ffd400","#2f80ed","#2fb36a","#ff2bd6"],Math.random()),1.5));
  if(G.bossT<=0){G.state="ending";save.stage=1;store();$("eText").innerHTML="잉크 세기 <b>"+save.dmg+"</b> · 다시 태어난 횟수 <b>"+(save.deaths||0)+"</b>";$("ending").hidden=false}
  for(const p of parts){p.vx*=.96;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);
  for(const t of texts)t.life-=dt;texts=texts.filter(t=>t.life>0);return}
 if(G.state!=="play")return;
 stageT+=dt;
 // 플레이어 이동
 let mx=0,my=0;
 if(joy.active){mx=joy.dx;my=joy.dy;if(Math.hypot(mx,my)<.15){mx=my=0}}
 if(keys.ArrowLeft||keys.a)mx-=1;if(keys.ArrowRight||keys.d)mx+=1;if(keys.ArrowUp||keys.w)my-=1;if(keys.ArrowDown||keys.s)my+=1;
 let l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l;l=1}
 const sp=player.speed*(player.pw.speed>0?1.5:1);
 player.x+=mx*sp*dt+(player.kx||0)*dt;player.y+=my*sp*dt+(player.ky||0)*dt;
 player.kx=(player.kx||0)*.82;player.ky=(player.ky||0)*.82;
 player.x=clamp(player.x,EDGE,WW-EDGE);player.y=clamp(player.y,EDGE,WH-EDGE);
 player.moving=l>.1;if(player.moving)player.walk+=dt*13;
 player.inv=Math.max(0,player.inv-dt);player.flash=Math.max(0,player.flash-dt*8);player.fireT-=dt;
 for(const k in player.pw)player.pw[k]=Math.max(0,player.pw[k]-dt);
 // 조준
 let fire=null;
 if(aimS.active&&(aimS.dx||aimS.dy))fire=Math.atan2(aimS.dy,aimS.dx);
 else{let best=null,bd=430;for(const e of enemies){if(e.state==="flee")continue;const d=dist(e,player)-e.r;if(d<bd){bd=d;best=e}}
  if(!best&&door){/* 도망가는 애도 가까우면 쏜다 */for(const e of enemies){const d=dist(e,player)-e.r;if(d<260&&d<bd){bd=d;best=e}}}
  if(best)fire=Math.atan2(best.y-player.y,best.x-player.x)}
 if(fire!==null){player.aim=fire;if(player.fireT<=0){shoot(fire);player.fireT=fireInterval()}}
 else if(player.moving)player.aim=Math.atan2(my,mx);
 player.face=Math.cos(player.aim)>=0?1:-1;
 // 총알
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  for(const e of enemies){if(e.dead||b.dead||(b.hit&&b.hit.includes(e)))continue;if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){(b.hit||(b.hit=[])).push(e);hitEnemy(e,b);if(b.pierce>0)b.pierce--;else b.dead=true}}
  if(b.life<=0&&!b.dead){b.dead=true;splat(b.x,b.y,rnd(10,18),b.c)}
  if(b.x<EDGE-20||b.x>WW-EDGE+20||b.y<EDGE-20||b.y>WH-EDGE+20){b.dead=true;splat(clamp(b.x,EDGE,WW-EDGE),clamp(b.y,EDGE,WH-EDGE),14,b.c)}
 }
 bullets=bullets.filter(b=>!b.dead);
 enemies=enemies.filter(e=>!e.dead);
 // 적
 for(const e of enemies){
  e.t+=dt;e.st-=dt;
  const d=dist(e,player),ang=Math.atan2(player.y-e.y,player.x-e.x);
  if(e.state!=="swing"&&e.state!=="charge")e.face=player.x>=e.x?1:-1;
  let vx=0,vy=0;
  const reach=e.r+player.r+(e.type==="boss"?60:30);
  if(e.type==="boss")bossAI(e,dt,d,ang);
  else switch(e.state){
   case "walk":vx=Math.cos(ang)*e.speed;vy=Math.sin(ang)*e.speed;if(d<reach){e.state="wind";e.st=e.type==="fast"?.4:.55}break;
   case "wind":vx=Math.cos(ang)*e.speed*.25;vy=Math.sin(ang)*e.speed*.25;if(e.st<=0){e.state="swing";e.st=e.swT;e.hitDone=false;SFX.swing()}break;
   case "swing":if(!e.hitDone&&e.st<e.swT*.6){e.hitDone=true;if(d<reach+16)hitPlayer(e)}if(e.st<=0){e.state="rest";e.st=.75}break;
   case "rest":if(e.st<=0)e.state="walk";break;
   case "flee":{const fa=ang+Math.PI;vx=Math.cos(fa)*e.speed*1.3;vy=Math.sin(fa)*e.speed*1.3;e.face=vx>=0?1:-1;if(Math.random()<dt*.5)say(e.x,e.y-e.r*3,pick(["으악!","도망가자!","살려줘~"],Math.random()),"#fff",18)}break;
  }
  if(e.state==="walk"||e.state==="flee"||e.state==="wind")e.walk+=dt*9*(e.type==="fast"?1.6:1);
  // 서로 밀기
  for(const o of enemies){if(o===e)continue;const dd=dist(e,o),m=e.r+o.r-6;if(dd<m&&dd>0){const px=(e.x-o.x)/dd*(m-dd)*.5;const py=(e.y-o.y)/dd*(m-dd)*.5;e.x+=px;e.y+=py}}
  e.x+=(vx+e.kx)*dt;e.y+=(vy+e.ky)*dt;e.kx*=.8;e.ky*=.8;
  e.x=clamp(e.x,EDGE-10,WW-EDGE+10);e.y=clamp(e.y,EDGE-10,WH-EDGE+10);
 }
 enemies=enemies.filter(e=>!e.dead);
 // 뚱땡이 대왕의 날아오는 칼
 for(const k of knives){k.x+=k.vx*dt;k.y+=k.vy*dt;k.rot+=dt*14;k.life-=dt;if(Math.hypot(k.x-player.x,k.y-player.y)<player.r+14){hitPlayer(k);k.life=0}if(k.life<=0)splat(k.x,k.y,12,"#2b4fff")}
 knives=knives.filter(k=>k.life>0);
 // 스폰
 if(G.stage<100&&!door){
  const alive=enemies.filter(e=>e.type!=="cap").length,maxAlive=Math.min(7,2+Math.floor(G.stage/12)),remaining=goal-kills-alive;
  spawnT-=dt;if(spawnT<=0&&alive<maxAlive&&remaining>0){spawnEnemy();spawnT=Math.max(.7,1.7-G.stage*.009)}
  if(G.stage%10===0&&!capOut&&kills>=Math.floor(goal/2)){capOut=true;const p=spawnPoint();enemies.push(makeEnemy("cap",p.x,p.y));say(player.x,player.y-110,"대장 뚱땡이 등장!","#ffd24d",26);SFX.roar();G.shake=8}
 }
 // 아이템
 for(const it of items){it.t+=dt;if(Math.hypot(it.x-player.x,it.y-player.y)<player.r+26){it.dead=true;SFX.pick();
  if(it.k==="heart"){player.hp=Math.min(player.maxHp,player.hp+1);say(player.x,player.y-100,"하트 +1","#ff5a3a",26)}
  else if(it.k==="triple"){player.pw.triple=12;say(player.x,player.y-100,"3단 잉크!","#ffd24d",26)}
  else if(it.k==="big"){player.pw.big=10;say(player.x,player.y-100,"왕 잉크!","#ff2bd6",26)}
  else{player.pw.speed=9;say(player.x,player.y-100,"번개 발!","#ffd400",26)}
  parts.push(...burst(it.x,it.y-20,14,"#fff",1.4))}}
 items=items.filter(i=>!i.dead);
 // 출구
 if(door){door.t+=dt;if(Math.hypot(door.x-player.x,door.y-player.y)<player.r+36){clearStage()}}
 // 파티클, 글자
 for(const p of parts){p.vx*=.96;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}parts=parts.filter(p=>p.life>0);
 for(const t of texts){t.life-=dt;t.y-=dt*30}texts=texts.filter(t=>t.life>0);
 // 카메라
 cam.x=clamp(player.x-W/2,0,WW-W);cam.y=clamp(player.y-H/2-40,0,WH-H);
}
function bossAI(e,dt,d,ang){
 if(e.hp<e.maxHp*.45&&e.phase===1){e.phase=2;e.shirt="#c01030";say(e.x,e.y-220,"으르렁! 화났다!!","#ff3030",30);SFX.roar();G.shake=12}
 const minions=enemies.filter(o=>o.type!=="boss").length,fast=e.phase===2?.7:1;
 const reach=e.r+player.r+60;
 switch(e.state){
  case "walk":{e.atkT-=dt;const vx=Math.cos(ang)*e.speed*(e.phase===2?1.3:1),vy=Math.sin(ang)*e.speed*(e.phase===2?1.3:1);e.x+=vx*dt;e.y+=vy*dt;e.walk+=dt*7;
   if(d<reach){e.state="wind";e.st=.7*fast}
   else if(e.atkT<=0){const r=Math.random();
    if(r<.4){e.state="cwind";e.st=.8*fast;say(e.x,e.y-220,"돌진이다!","#ff3030",26)}
    else if(r<.75||minions>=4){e.state="twind";e.st=.55*fast}
    else{e.state="summon";e.st=.6;say(e.x,e.y-220,"부하들아, 나와라!","#ffd24d",26)}}
   break}
  case "wind":if(e.st<=0){e.state="swing";e.st=e.swT;e.hitDone=false;SFX.swing();G.shake=5}break;
  case "swing":if(!e.hitDone&&e.st<e.swT*.6){e.hitDone=true;if(d<reach+24)hitPlayer(e);SFX.stomp()}if(e.st<=0){e.state="rest";e.st=.9}break;
  case "cwind":if(e.st<=0){e.state="charge";e.st=.75;e.cx=Math.cos(ang);e.cy=Math.sin(ang);e.face=e.cx>=0?1:-1;SFX.roar()}break;
  case "charge":e.x+=e.cx*470*dt;e.y+=e.cy*470*dt;e.walk+=dt*18;if(Math.random()<.6)parts.push(...burst(e.x,e.y,2,"rgba(255,255,255,.5)",1));
   if(d<e.r+player.r+6)hitPlayer(e);
   if(e.st<=0||e.x<EDGE||e.x>WW-EDGE||e.y<EDGE||e.y>WH-EDGE){e.state="rest";e.st=1.4;G.shake=12;SFX.stomp();say(e.x,e.y-220,"어지러워~","#ffd24d",24)}break;
  case "twind":if(e.st<=0){for(let i=-1;i<=1;i++){const a=ang+i*.28;knives.push({x:e.x+Math.cos(a)*50,y:e.y+Math.sin(a)*50,vx:Math.cos(a)*300,vy:Math.sin(a)*300,rot:0,life:2.2})}SFX.swing();e.state="rest";e.st=.7}break;
  case "summon":if(e.st<=0){for(let i=0;i<2;i++){const p=spawnPoint();enemies.push(makeEnemy(i?"fast":"normal",p.x,p.y))}e.state="rest";e.st=.6}break;
  case "rest":if(e.st<=0){e.state="walk";e.atkT=(e.phase===2?1.5:2.4)}break;
 }
}
function clearStage(){
 G.state="clear";SFX.clear();
 const st=hitsTaken===0?3:hitsTaken<=2?2:1;
 $("cStars").textContent="★".repeat(st)+"☆".repeat(3-st);
 const n=G.stage;
 $("cText").textContent=n+"탄 "+TH[n-1][0]+" 통과! 뚱땡이 "+kills+"마리를 잉크 범벅으로 만들었어요."+(st===3?" 한 번도 안 맞았어요, 최고!":"");
 $("cBar").style.width=n+"%";
 if(n%10===0){save.rate=Math.min(10,save.rate+1);$("cNext").innerHTML="잉크총 연사 업! <b>"+(n+1)+"탄 "+TH[n][0]+"</b>"+(n===90?" · 다음은 뚱땡이 왕의 성!":"")}
 else if(n===99)$("cNext").innerHTML="다음은 <b>뚱땡이 대왕</b>! 끝판왕이다!";
 else $("cNext").innerHTML="다음 장소: <b>"+(n+1)+"탄 "+TH[n][0]+"</b>";
 save.stage=n+1;store();
 setTimeout(()=>{$("clear").hidden=false},500);
}

/* ===== 그리기 ===== */
function drawItem(it){
 const f=Math.sin(it.t*4)*4;C.save();C.translate(it.x,it.y);sh(0,0,14);C.translate(0,-18+f);
 if(it.k==="heart"){heart(0,0,13,"#ff5a3a");heart(-3,-2,6,"rgba(255,255,255,.5)")}
 else{rr(-12,-12,24,30,6,it.k==="triple"?"#ffd24d":it.k==="big"?"#ff2bd6":"#ffd400");rr(-6,-20,12,10,3,"#444");
  if(it.k==="triple")text("3",0,4,18,"#222");else if(it.k==="big")star(0,4,9,4,5,"#fff");else poly([2,-8,-6,4,0,4,-2,12,6,0,0,0],"#fff")}
 C.restore();
}
function drawDoor(d){
 C.save();C.translate(d.x,d.y);const p=Math.sin(d.t*5)*.5+.5;
 ell(0,4,44,16,"rgba(255,210,77,"+(.25+p*.25)+")");
 rr(-30,-92,60,92,[28,28,4,4],"#6a3b8f");rr(-24,-86,48,86,[22,22,2,2],"#ffe28a");
 rr(-24,-86,48,86,[22,22,2,2],"rgba(255,180,60,"+(.3+p*.3)+")");
 for(let i=0;i<5;i++)star(Math.cos(d.t*2+i*1.26)*44,-50+Math.sin(d.t*2+i*1.26)*44,6,2.5,5,"#fff27a");
 rr(-34,-124,68,26,8,"#ffd24d");text("출구",0,-111,20,"#5a2a00");
 C.restore();
}
function drawFlyingKnife(k){C.save();C.translate(k.x,k.y-30);C.scale(1.1,1.1);drawKnife(k.rot,1);C.restore();sh(k.x,k.y,12)}
function drawArrow(tx,ty,c,label){
 const dx=tx-player.x,dy=ty-player.y,a=Math.atan2(dy,dx);
 const sx=player.x-cam.x,sy=player.y-cam.y-40;
 C.save();C.translate(sx+Math.cos(a)*78,sy+Math.sin(a)*78);C.rotate(a);
 poly([14,0,-6,-10,-2,0,-6,10],c);C.restore();
 if(label)text(label,sx+Math.cos(a)*105,sy+Math.sin(a)*105,15,c,"center",3);
}
function render(){
 C=ctx;
 const shx=G.shake?rnd(-G.shake,G.shake)*.5:0,shy=G.shake?rnd(-G.shake,G.shake)*.5:0;
 ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
 if(G.state==="select"){drawSelectBG();ctx.restore();return}
 ctx.translate(-cam.x+shx,-cam.y+shy);
 ctx.drawImage(gcv,cam.x-20,cam.y-20,W+40,H+40,cam.x-20,cam.y-20,W+40,H+40);
 const list=[];
 const vx0=cam.x-120,vx1=cam.x+W+120,vy0=cam.y-160,vy1=cam.y+H+160;
 for(const p of props)if(p.x>vx0&&p.x<vx1&&p.y>vy0&&p.y<vy1)list.push({y:p.y,f:()=>drawProp(p)});
 for(const it of items)list.push({y:it.y,f:()=>drawItem(it)});
 if(door)list.push({y:door.y,f:()=>drawDoor(door)});
 for(const e of enemies)if(e.x>vx0&&e.x<vx1&&e.y>vy0&&e.y<vy1)list.push({y:e.y,f:()=>drawFatty(e.x,e.y,e)});
 if(G.state!=="dying"||Math.sin(T*20)>0)list.push({y:player.y,f:()=>{if(player.inv>0&&Math.sin(T*28)>0&&G.state==="play")ctx.globalAlpha=.45;drawHero(player.x,player.y,G.who,player.face,player.walk,player.aim,{moving:player.moving,ink:INKC[G.who],flash:player.flash});ctx.globalAlpha=1}});
 for(const k of knives)list.push({y:k.y,f:()=>drawFlyingKnife(k)});
 list.sort((a,b)=>a.y-b.y);for(const d of list)d.f();
 for(const b of bullets){sh(b.x,b.y,b.r*.8);circ(b.x-b.vx*.012,b.y-36-b.vy*.012,b.r*.7,b.c);circ(b.x,b.y-36,b.r,b.c);circ(b.x-b.r*.3,b.y-36-b.r*.3,b.r*.35,"rgba(255,255,255,.6)")}
 for(const p of parts){ctx.globalAlpha=clamp(p.life*2,0,1);circ(p.x,p.y,p.r,p.c)}ctx.globalAlpha=1;
 for(const t of texts){ctx.globalAlpha=clamp(t.life*1.5,0,1);text(t.t,t.x,t.y,t.sz,t.c,"center",4)}ctx.globalAlpha=1;
 ctx.restore();
 // 화면 효과
 ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
 drawAmb();
 drawHUD();
 ctx.restore();
}
function drawAmb(){
 const th=TH[G.stage-1];
 for(const a of amb){
  switch(a.k){
   case "petal":ell(a.x,a.y,a.r+2,a.r,th[5],a.ph+T);break;
   case "leaf":ell(a.x,a.y,a.r+3,a.r*.6,"#5fb35f",a.ph+T*2);break;
   case "snow":case "blizzard":circ(a.x,a.y,a.r*.7,"rgba(255,255,255,.85)");break;
   case "bubble":C.strokeStyle="rgba(255,255,255,.6)";C.lineWidth=1.5;C.beginPath();C.arc(a.x,a.y,a.r,0,TAU);C.stroke();break;
   case "sparkle":case "stars":case "aurora":case "firefly":{const t=Math.max(0,Math.sin(T*3+a.ph));const col=a.k==="stars"?"#fff":a.k==="firefly"?"#eaff7a":th[5];ctx.globalAlpha=t;star(a.x,a.y,a.r*1.2,a.r*.4,4,col);ctx.globalAlpha=1;break}
   case "ember":circ(a.x,a.y,a.r*.6,"#ff8c1f");break;
   case "spore":circ(a.x,a.y,a.r*.5,"rgba(255,255,255,.6)");break;
   case "dust":ell(a.x,a.y,a.r*2,a.r*.6,"rgba(255,240,200,.35)");break;
   case "sandstorm":ell(a.x,a.y,a.r*4,a.r*.8,"rgba(230,200,140,.45)");break;
  }
 }
 if(TH[G.stage-1][6]==="aurora"){const gr=ctx.createLinearGradient(0,0,W,0);gr.addColorStop(0,"rgba(125,255,179,0)");gr.addColorStop(.5,"rgba(125,255,179,"+(.12+Math.sin(T)*.05)+")");gr.addColorStop(1,"rgba(180,120,255,0)");ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
 if(TH[G.stage-1][6]==="sandstorm")rect(0,0,W,H,"rgba(220,180,100,.18)");
}
function drawHUD(){
 if(G.state==="dying"||G.state==="dead")return;
 // 하트
 rr(8,8,150,40,20,"rgba(0,0,0,.35)");
 for(let i=0;i<player.maxHp;i++)heart(28+i*26,28,10,i<player.hp?"#ff5a3a":"rgba(255,255,255,.25)");
 // 스테이지
 const name=G.stage+"탄 "+TH[G.stage-1][0];
 ctx.font="17px "+FONT;const w=ctx.measureText(name).width+28;
 rr(W-8-w,8,w,40,20,"rgba(0,0,0,.35)");text(name,W-8-w/2,28,17,"#ffe28a");
 // 진행
 if(G.stage===100){const b=G.boss;if(b&&!b.dead){rr(W/2-150,56,300,22,11,"rgba(0,0,0,.4)");rr(W/2-146,60,292*clamp(b.hp/b.maxHp,0,1),14,7,b.phase===2?"#ff3030":"#b53bff");text("뚱땡이 대왕",W/2,67,13,"#fff","center",3)}}
 else if(!door){rr(W/2-96,56,192,24,12,"rgba(0,0,0,.35)");rr(W/2-92,60,184*clamp(kills/goal,0,1),16,8,"#2b8cff");text("뚱땡이 "+kills+" / "+goal,W/2,68,15,"#fff","center",3)}
 else{text("출구 문으로 가자!",W/2,68,20,"#ffd24d","center",4)}
 // 파워
 let px=16;for(const k of ["triple","big","speed"]){if(player.pw[k]>0){const col=k==="triple"?"#ffd24d":k==="big"?"#ff2bd6":"#ffd400";rr(px,54,52,22,11,"rgba(0,0,0,.35)");circ(px+12,65,7,col);text(Math.ceil(player.pw[k])+"",px+34,65,14,"#fff");px+=58}}
 // 길잡이 화살표
 if(G.state==="play"){
  if(door){const on=door.x>cam.x&&door.x<cam.x+W&&door.y>cam.y&&door.y<cam.y+H;if(!on)drawArrow(door.x,door.y,"#ffd24d","출구")}
  else{let near=null,bd=1e9,onScreen=false;for(const e of enemies){const d=dist(e,player);if(d<bd){bd=d;near=e}if(e.x>cam.x-20&&e.x<cam.x+W+20&&e.y>cam.y-20&&e.y<cam.y+H+20)onScreen=true}
   if(near&&!onScreen)drawArrow(near.x,near.y,"#ff5a3a","뚱땡이")}
 }
 // 배너
 if(G.banner>0){const a=clamp(G.banner,0,1);ctx.globalAlpha=a;rr(30,H/2-60,W-60,80,20,"rgba(20,16,42,.75)");text(G.bannerT,W/2,H/2-20,34,"#ffe28a","center",5);ctx.globalAlpha=1}
 if(G.bossIntro>0){ctx.globalAlpha=clamp(G.bossIntro,0,1);text("뚱땡이 대왕 등장!!",W/2,H/2+50,40,"#ff3030","center",6);ctx.globalAlpha=1}
 if(G.hint>0&&G.banner<=0){ctx.globalAlpha=clamp(G.hint,0,1);rr(30,H-150,W-60,70,16,"rgba(20,16,42,.7)");text("손가락으로 끌면 달려가요",W/2,H-128,20,"#fff");text("잉크총은 저절로 발사! 뚱땡이를 찾아가요",W/2,H-100,17,"#c3b8e2");ctx.globalAlpha=1}
 // 조이스틱
 if(joy.active){circ(joy.ox,joy.oy,58,"rgba(255,255,255,.14)");C.strokeStyle="rgba(255,255,255,.4)";C.lineWidth=2;C.beginPath();C.arc(joy.ox,joy.oy,58,0,TAU);C.stroke();circ(joy.ox+joy.dx*58,joy.oy+joy.dy*58,24,"rgba(255,255,255,.55)")}
 if(aimS.active){circ(aimS.ox,aimS.oy,40,"rgba(255,90,58,.15)");if(aimS.dx||aimS.dy)circ(aimS.ox+aimS.dx*40,aimS.oy+aimS.dy*40,16,"rgba(255,90,58,.6)")}
}
function drawSelectBG(){
 const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,"#2b1f5a");gr.addColorStop(1,"#14102a");ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 for(let i=0;i<12;i++){const x=(i*173+T*20)%(W+80)-40,y=(i*97)%H;circ(x,y,20+i%3*8,INKC[i%2]+"33")}
}

/* ===== 캐릭터 선택 ===== */
const heroBtns=[...document.querySelectorAll(".hero")];
function paintHeroes(){
 heroBtns.forEach((b,i)=>{const c=b.querySelector("canvas"),cc=c.getContext("2d");C=cc;cc.setTransform(2,0,0,2,0,0);cc.clearRect(0,0,130,150);
  const gr=cc.createLinearGradient(0,0,0,150);gr.addColorStop(0,i?"#5a2a6a":"#2a4a8a");gr.addColorStop(1,"#1a1430");cc.fillStyle=gr;cc.fillRect(0,0,130,150);
  cc.save();cc.translate(65,128);cc.scale(1.15,1.15);drawHero(0,0,i,1,T*8,-.3+Math.sin(T*2)*.1,{moving:true,ink:INKC[i]});cc.restore();C=ctx})}
heroBtns.forEach(b=>b.onclick=()=>{G.who=+b.dataset.who;heroBtns.forEach(x=>x.classList.toggle("on",x===b));SFX.pick();save.who=G.who;store()});
heroBtns[G.who].classList.add("on");heroBtns[1-G.who].classList.remove("on");
if(save.stage>1){$("contBtn").hidden=false;$("contBtn").textContent="이어하기 · "+save.stage+"탄 "+TH[save.stage-1][0]}
$("goBtn").onclick=()=>{ac();save.dmg=1;save.rate=0;save.deaths=0;startStage(1)};
$("contBtn").onclick=()=>{ac();startStage(clamp(save.stage,1,100))};
$("nextBtn").onclick=()=>{startStage(Math.min(100,G.stage+1))};
$("retryBtn").onclick=()=>{startStage(G.stage)};
$("againBtn").onclick=()=>{save.dmg=1;save.rate=0;save.deaths=0;save.stage=1;store();startStage(1)};

/* ===== 루프 ===== */
function fit(){const s=$("stage").getBoundingClientRect(),k=Math.min(s.width/W,s.height/H),w=Math.floor(W*k),h=Math.floor(H*k);
 cv.style.width=w+"px";cv.style.height=h+"px";const dpr=Math.min(2.5,window.devicePixelRatio||1);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
 ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
 ["select","clear","dead","ending"].forEach(id=>{$(id).style.width=w+"px";$(id).style.height=h+"px"})}
new ResizeObserver(fit).observe($("stage"));fit();
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(G.state==="select")paintHeroes();
 update(dt);render();requestAnimationFrame(loop)}
player=newPlayer();requestAnimationFrame(loop);
window.__ink={go:n=>{G.who=G.who||0;startStage(n)},st:()=>({state:G.state,stage:G.stage,kills,goal,hp:player.hp,enemies:enemies.length,door:!!door,bullets:bullets.length}),G,kill:()=>{for(const e of [...enemies])killEnemy(e)},player:()=>player,door:()=>door};
})();
</script>
