<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="바다 특공대"><meta name="theme-color" content="#0f1a33">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%;color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>서준이 바다 특공대</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--ink:#0f1a33;--panel:#22345a;--cream:#fff6e5;--muted:#bcd0ea;--hot:#ff8a2a;--gold:#ffc93a;--blue:#2f80ed;
 --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--ink);color:var(--cream);font-family:var(--display);overflow:hidden;box-sizing:border-box;
 padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:6px;box-sizing:border-box;max-width:620px;margin:0 auto}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:34px}
h1{margin:0;font-weight:400;font-size:clamp(16px,4.8vw,21px);color:var(--hot);white-space:nowrap}
.hbtn{white-space:nowrap;font-family:var(--display);font-size:14px;border:0;border-radius:999px;padding:5px 11px;background:var(--panel);color:var(--cream);cursor:pointer}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
#cv{display:block;touch-action:none;border-radius:18px;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.sheet{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:18px;box-sizing:border-box;text-align:center;border-radius:18px;background:linear-gradient(to bottom,rgba(15,26,51,.35),rgba(15,26,51,.93) 38%);overflow:auto}
.sheet h2{margin:0;font-weight:400;font-size:32px;color:var(--gold);text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.sheet p{margin:0;font-size:16px;color:var(--muted);line-height:1.5;max-width:31ch}
.sheet .stars{font-size:46px;color:var(--gold);letter-spacing:.08em;line-height:1}
.sheet .unlock{background:var(--panel);border-radius:14px;padding:10px 16px;font-size:17px;color:var(--cream)}
.sheet .unlock b{font-weight:400;color:var(--gold)}
.crewrow{display:flex;gap:12px}
.ccard{background:var(--panel);border-radius:18px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;width:132px}
.ccard canvas{width:120px;height:150px;border-radius:12px;background:#2f6fb0}
.ccard .nm{font-family:var(--display);font-size:20px;background:none;border:0;color:var(--cream);cursor:pointer;padding:0}
.pbtn{font-family:var(--display);font-size:15px;border:0;border-radius:12px;padding:7px 12px;background:var(--hot);color:#fff;cursor:pointer;width:100%}
.xbtn{font-family:var(--display);font-size:12px;border:0;background:none;color:var(--muted);cursor:pointer;text-decoration:underline}
.go{font-family:var(--display);font-size:23px;border:0;border-radius:16px;padding:13px 30px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.go.gold{background:var(--gold);color:var(--ink)}.go.gray{background:#4a5a78}
.row{display:flex;gap:10px}
#cropCv{width:280px;height:280px;border-radius:14px;touch-action:none;background:#222}
#zoom{width:240px;accent-color:var(--gold)}
.small{font-size:13px!important;opacity:.85}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>

<div class="app">
 <div class="bar"><h1>서준이 바다 특공대</h1><div><button type="button" class="hbtn" id="snd">소리</button></div></div>
 <div class="stage" id="stage">
  <canvas id="cv" aria-label="바다 무대. 꾹 눌러 끌면 대포 조준, 손을 떼면 발사. 톡 치면 총을 쏴요."></canvas>

  <div class="sheet" id="title">
   <h2>바다 특공대 출동!</h2>
   <div class="crewrow">
    <div class="ccard"><canvas width="240" height="300"></canvas><button type="button" class="nm" data-i="0">아빠</button><button type="button" class="pbtn" data-i="0">사진 넣기</button><button type="button" class="xbtn" data-x="0" hidden>사진 빼기</button></div>
    <div class="ccard"><canvas width="240" height="300"></canvas><button type="button" class="nm" data-i="1">서준</button><button type="button" class="pbtn" data-i="1">사진 넣기</button><button type="button" class="xbtn" data-x="1" hidden>사진 빼기</button></div>
   </div>
   <p>대머리 뚱땡이 해적선이 나타났다! 꾹 눌러서 끌면 대포 조준, 손을 떼면 펑! 날아오는 대포알은 톡 쳐서 총으로 맞혀요.</p>
   <p class="small">사진은 이 폰에만 저장돼요. 인터넷에 올라가지 않아요.</p>
   <div class="row"><button type="button" class="go" id="goBtn">처음부터 출동!</button></div>
   <button type="button" class="go gold" id="contBtn" hidden>이어하기</button>
  </div>

  <div class="sheet" id="crop" hidden>
   <h2 id="cropTitle">얼굴 맞추기</h2>
   <canvas id="cropCv" width="560" height="560"></canvas>
   <p>사진을 끌어서 얼굴을 동그라미 안에 넣어요</p>
   <input type="range" id="zoom" min="1" max="4" step="0.01" value="1" aria-label="크게 작게">
   <div class="row"><button type="button" class="go gold" id="cropOk">좋아요!</button><button type="button" class="go gray" id="cropNo">취소</button></div>
  </div>

  <div class="sheet" id="clear" hidden>
   <h2>해적선 격파!</h2>
   <div class="stars" id="cStars"></div>
   <p id="cText"></p>
   <div class="unlock" id="cNext"></div>
   <button type="button" class="go" id="nextBtn">다음 바다로!</button>
  </div>

  <div class="sheet" id="dead" hidden>
   <h2>우리 배가 부서졌어요!</h2>
   <p>괜찮아요! 배를 고치고 다시 출동하면 대포가 더 빨리 장전돼요.</p>
   <div class="unlock" id="dText"></div>
   <button type="button" class="go" id="retryBtn">다시 출동!</button>
  </div>

  <div class="sheet" id="ending" hidden>
   <h2>대머리 대왕을 물리쳤다!</h2>
   <div class="stars">★★★</div>
   <p>대머리 해적단의 배가 모두 가라앉고, 바다가 다시 평화로워졌어요. 바다 특공대 최고!</p>
   <div class="unlock" id="eText"></div>
   <button type="button" class="go" id="againBtn">처음부터 다시</button>
  </div>
 </div>
</div>
<input type="file" id="file" accept="image/*" hidden>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
const W=500,H=860,HZ=440,FARW=588,NEARW=706,GRAV=520,BX=104,TAU=Math.PI*2;
const FONT='"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const pick=(arr,r)=>arr[Math.floor((r==null?Math.random():r)*arr.length)%arr.length];
const lerp=(a,b,t)=>a+(b-a)*t;
let T=0;

/* ===== 저장 ===== */
const SAVE="sea.save";
let save={stage:1,gold:0,power:0,snd:true,names:["아빠","서준"]};
try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE)||"{}"))}catch(e){}
if(!Array.isArray(save.names)||save.names.length<2)save.names=["아빠","서준"];
const store=()=>{try{localStorage.setItem(SAVE,JSON.stringify(save))}catch(e){}};

/* ===== 소리 ===== */
let AC=null,sound=save.snd!==false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,type,g,slide,at){const a=ac();if(!a||!sound)return;type=type||"sine";g=g==null?.2:g;slide=slide||0;at=at||0;const o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+at);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+at+d);v.gain.setValueAtTime(g,a.currentTime+at);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+at+d);o.connect(v).connect(a.destination);o.start(a.currentTime+at);o.stop(a.currentTime+at+d+.02)}
function noise(d,g,at,fq){const a=ac();if(!a||!sound)return;g=g==null?.2:g;at=at||0;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const v=a.createGain();v.gain.value=g;const f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=fq||1400;s.connect(f).connect(v).connect(a.destination);s.start(a.currentTime+at)}
let coinSnd=0;
const SFX={
 boom(){noise(.4,.55,0,900);tone(70,.45,"sine",.5,-30)},
 eboom(){noise(.3,.3,0,800);tone(95,.3,"sine",.3,-40)},
 splash(){noise(.35,.3,0,1100)},
 crash(){noise(.35,.5,0,1600);tone(120,.25,"sawtooth",.15,-60)},
 pew(){tone(1100,.07,"square",.06,-700)},
 pop(){tone(500,.12,"triangle",.25,400);noise(.08,.15)},
 coin(){const n=performance.now();if(n-coinSnd<45)return;coinSnd=n;tone(1320,.06,"square",.07);tone(1760,.08,"square",.07,0,.05)},
 chest(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.2,0,i*.07))},
 fuse(){noise(.7,.06,0,5000)},
 horn(){tone(160,.7,"sawtooth",.12,-20);tone(214,.7,"sawtooth",.08,-20)},
 rip(){noise(.15,.2,0,3500)},
 yell(){tone(420,.3,"sawtooth",.08,-260)},
 ouch(){tone(300,.25,"sawtooth",.18,-200)},
 sink(){tone(220,1.3,"sine",.2,-170)},
 drum(){tone(110,.12,"sine",.35,-40)},
 pick(){tone(660,.08,"square",.14);tone(990,.14,"square",.14,0,.08)},
 ready(){tone(880,.06,"sine",.08)},
 clear(){[523,659,784,1047,1318].forEach((f,i)=>tone(f,.3,"triangle",.22,0,i*.12))},
 win(){[523,659,784,1047,784,1047,1318,1568].forEach((f,i)=>tone(f,.35,"triangle",.22,0,i*.13))},
 lose(){[400,350,300,200].forEach((f,i)=>tone(f,.3,"triangle",.2,0,i*.18))},
 thunder(){noise(1.2,.35,0,500)}
};
$("snd").textContent=sound?"소리":"무음";
$("snd").onclick=()=>{sound=!sound;save.snd=sound;store();$("snd").textContent=sound?"소리":"무음";if(sound)SFX.pick()};

/* ===== 그리기 도우미 (C 는 지금 그리는 캔버스) ===== */
let C=ctx;
const F=c=>{C.fillStyle=c};
function circ(x,y,r,c){F(c);C.beginPath();C.arc(x,y,r,0,TAU);C.fill()}
function ell(x,y,rx,ry,c,rot){F(c);C.beginPath();C.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),rot||0,0,TAU);C.fill()}
function rect(x,y,w,h,c){F(c);C.fillRect(x,y,w,h)}
function rr(x,y,w,h,r,c){F(c);C.beginPath();C.roundRect(x,y,w,h,r);C.fill()}
function poly(p,c){F(c);C.beginPath();C.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)C.lineTo(p[i],p[i+1]);C.closePath();C.fill()}
function line(x1,y1,x2,y2,c,w){C.strokeStyle=c;C.lineWidth=w;C.lineCap="round";C.beginPath();C.moveTo(x1,y1);C.lineTo(x2,y2);C.stroke()}
function star(x,y,ro,ri,n,c){F(c);C.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,r=i%2?ri:ro;C.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}C.closePath();C.fill()}
function heart(x,y,s,c){F(c);C.beginPath();C.moveTo(x,y+s*.9);C.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.8,y-s*1.15,x,y-s*.45);C.bezierCurveTo(x+s*.8,y-s*1.15,x+s*1.5,y-s*.1,x,y+s*.9);C.fill()}
function text(t,x,y,sz,c,al,w){C.font=sz+"px "+FONT;C.textAlign=al||"center";C.textBaseline="middle";if(w){C.lineWidth=w;C.strokeStyle="rgba(0,0,0,.55)";C.lineJoin="round";C.strokeText(t,x,y)}F(c);C.fillText(t,x,y)}
const sh=(x,y,rx)=>ell(x,y,rx,rx*.38,"rgba(0,0,0,.2)");

/* ===== 사람 그리기 도구 ===== */
const SPR=1.28,OL="rgba(40,22,28,.62)",SKIN="#f5c6a0",SKIN_D="#dca07c",SKIN_L="#ffe2cc",EINK="#23235e";
const angDiff=(a,b)=>Math.abs(((a-b)%TAU+TAU*1.5)%TAU-Math.PI);
function tint(hex,a){const n=parseInt(hex.slice(1),16),t=a>0?255:0,k=Math.abs(a);return"rgb("+[n>>16,n>>8&255,n&255].map(v=>Math.round(v+(t-v)*k)).join(",")+")"}
function seg(x1,y1,x2,y2,w,c){C.lineCap="round";C.beginPath();C.moveTo(x1,y1);C.lineTo(x2,y2);C.strokeStyle=OL;C.lineWidth=w+3;C.stroke();C.strokeStyle=c;C.lineWidth=w;C.stroke()}
function seg2(p,w,c){C.lineCap="round";C.lineJoin="round";C.beginPath();C.moveTo(p[0][0],p[0][1]);C.lineTo(p[1][0],p[1][1]);C.lineTo(p[2][0],p[2][1]);C.strokeStyle=OL;C.lineWidth=w+3;C.stroke();C.strokeStyle=c;C.lineWidth=w;C.stroke()}
/* 두 마디 관절: 어깨(엉덩이)에서 손(발)까지, 팔꿈치(무릎)가 어디로 굽을지 계산 */
function ik(sx,sy,tx,ty,l1,l2,bend){const dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy)||1,m=Math.min(d,l1+l2-.5),a=Math.atan2(dy,dx),A=Math.acos(clamp((l1*l1+m*m-l2*l2)/(2*l1*m),-1,1)),k=a+bend*A;return[[sx,sy],[sx+Math.cos(k)*l1,sy+Math.sin(k)*l1],[sx+Math.cos(a)*m,sy+Math.sin(a)*m]]}
function oell(x,y,rx,ry,c,rot){F(c);C.beginPath();C.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);C.fill();C.strokeStyle=OL;C.lineWidth=1.6;C.stroke()}
function lg(x0,y0,x1,y1,a,b){const g=C.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g}
function radG(x,y,r,a,b,c){const g=C.createRadialGradient(x+r*.3,y-r*.4,r*.08,x,y,r*1.1);g.addColorStop(0,a);g.addColorStop(.5,b);g.addColorStop(1,c);return g}
function heartP(x,y,s){C.beginPath();C.moveTo(x,y+s*.9);C.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.8,y-s*1.15,x,y-s*.45);C.bezierCurveTo(x+s*.8,y-s*1.15,x+s*1.5,y-s*.1,x,y+s*.9);C.closePath()}

/* ===== 대머리 뚱땡이 (안경·모자 없음, 그냥 대머리) ===== */
function drawInkKnife(x,y,a,k){
 C.save();C.translate(x,y);C.rotate(a);C.scale(k,k);
 rr(-7,-3.5,15,7,2,"#5a3420");for(let i=0;i<3;i++)rect(-5+i*4,-3.5,1.6,7,"#3a2010");
 rr(7,-7,4,14,2,"#c9a045");
 C.beginPath();C.moveTo(11,-4.5);C.lineTo(44,-5.5);C.quadraticCurveTo(54,-2,57,1);C.lineTo(11,4.5);C.closePath();F(lg(0,-5,0,4,"#eef2f8","#98a4b6"));C.fill();C.strokeStyle=OL;C.lineWidth=1.2;C.stroke();
 C.beginPath();C.moveTo(22,0);C.lineTo(50,-1.5);C.quadraticCurveTo(54,-.5,57,1);C.lineTo(22,4.4);C.closePath();F(EINK);C.fill();
 for(let i=0;i<3;i++){const dx=27+i*9,len=3+((T*2.5+i*.37)%1)*6;rr(dx-1.2,3,2.4,len,1.2,EINK);circ(dx,3+len,1.9,EINK)}
 C.restore();
}
function fatPose(e,mv){
 const sw=Math.sin(e.walk),ns=[14,-88],pol=(th,r)=>[ns[0]+Math.cos(th)*r,ns[1]+Math.sin(th)*r];
 let near,far,ka;
 switch(e.dying>0?"die":e.state){
  case "wind":case "twind":{const th=-1.75+Math.sin(T*45)*.06;near=pol(th,38);ka=th-.7;far=[-26,-96];break}
  case "swing":{const t=clamp(1-e.st/e.swT,0,1),q=1-Math.pow(1-t,3),th=-1.75+2.85*q;near=pol(th,38);ka=th+.25;far=[-24,-70];break}
  case "rest":near=[30,-62];ka=.9;far=[-14,-60];break;
  case "flee":near=[18+Math.sin(T*22)*5,-124];ka=-1.7;far=[-18+Math.cos(T*22)*5,-122];break;
  case "taunt":{const b=Math.sin(T*16)>0;near=[30,b?-64:-74];ka=-.4;far=[24,b?-74:-64];break}
  case "cwind":near=[-6,-64];ka=2.6;far=[-30,-66];break;
  case "charge":near=[-10,-58];ka=2.8;far=[-30,-60];break;
  case "summon":near=[22,-126];ka=-1.5;far=[-10,-128];break;
  case "slip":case "die":near=[34,-70+Math.sin(T*18)*6];ka=-.3;far=[-28,-74+Math.cos(T*18)*6];break;
  default:near=[30-sw*6*mv,-60];ka=-.75;far=[-18+sw*8*mv,-60];
 }
 return{near,far,ka};
}
function drawFatty(x,y,e){
 const s=e.r/24,boss=e.type==="boss";
 C.save();C.translate(x,y);sh(0,0,30*s);
 C.scale(s*e.face,s);
 const mv=(e.state==="walk"||e.state==="flee"||e.state==="charge")&&!(e.dying>0)?1:0,w=e.walk;
 let rot=0;
 if(e.dying>0){const t=1-e.dying/e.dieMax;rot=-1.45*Math.min(1,t/.3);if(t>.3&&t<.5)C.translate(0,-Math.sin((t-.3)/.2*Math.PI)*9)}
 else if(e.state==="slip"){const t=1-e.st/e.slipMax;rot=t<.12?-1.45*t/.12:t>.85?-1.45*(1-(t-.85)/.15):-1.45}
 else{if(e.state==="wind"||e.state==="cwind"||e.state==="twind")rot=-.14+Math.sin(T*50)*.02;else if(e.state==="swing")rot=.22;else if(e.state==="charge")rot=.3;rot-=e.hurt*1.6}
 C.rotate(rot);
 const lying=rot<-1;
 const H=fatPose(e,mv);
 if(boss){const fl=Math.sin(T*5)*5;poly([-14,-96,12,-96,-34+fl,-2,-52+fl,-10],"#b0102a");poly([-14,-96,-4,-96,-46+fl,-6,-52+fl,-10],"#ffd24d")}
 // 다리
 for(const i of [0,1]){const ph=w+i*Math.PI,hx=i?9:-7;let fx,fy;
  if(lying){fx=hx+16+Math.sin(T*20+i*2)*4;fy=-12}else{fx=hx+(mv?Math.sin(ph)*10:(i?4:-3));fy=mv?-Math.max(0,Math.cos(ph))*6:0}

 if(!b.tore&&((lx>-44&&lx<44&&ly>-236&&ly<-96)||(lx>-118&&lx<-48&&ly>-196&&ly<-92))){b.tore=true;s.tears.push({x:lx,y:ly,r:rnd(9,14)});SFX.rip();parts.push(...burst(b.x,b.y,8,s.sail,1.2))}
 const deck=lx>70?-104:-60;
 if(lx>-142&&lx<126&&ly>deck&&ly<26){b.dead=true;hitShip(s,lx,ly,b)}
}
function clearStage(){
 G.state="clear";SFX.clear();
 if(G.stage===30){G.state="ending";SFX.win();save.stage=1;store();$("eText").innerHTML="모은 보물 <b>"+save.gold+"</b>개";$("ending").hidden=false;return}
 const st=G.hits===0?3:G.hits<=2?2:1;$("cStars").textContent="★".repeat(st)+"☆".repeat(3-st);
 const n=G.stage;$("cText").textContent=n+"탄 "+ST[n-1][0]+" 통과! 보물 "+G.goldStage+"개를 얻었어요."+(st===3?" 한 번도 안 맞았어요, 최고!":"");
 $("cNext").innerHTML=n===29?"다음은 <b>대머리 대왕</b>! 끝판왕이다!":(n===9||n===19)?"다음은 <b>대장 해적선</b>이 나와요!":"다음 바다: <b>"+(n+1)+"탄 "+ST[n][0]+"</b>";

/* ===== 그리기 ===== */
function drawPreview(){
 if(!(aim.on&&aim.drag&&G.state==="play"))return;
 const v=aimVel();let[x,y]=muzzle(),vx=v.vx,vy=v.vy,hit=false;
 for(let i=0;i<60;i++){vy+=GRAV*.035;x+=vx*.035;y+=vy*.035;
  if(ship&&!ship.sink){const[lx,ly]=toShip(ship,x,y);if(lx>-142&&lx<126&&ly>(lx>70?-104:-60)&&ly<26){hit=true}}
  if(hit||y>wy(x,x>250?FARW:NEARW)||x>W+20)break;
  if(i%2===0)circ(x,y,i<4?3:4,"rgba(255,255,255,"+(1-i/70)+")")}
 C.strokeStyle=hit?"#3fff7f":"#ff5a3a";C.lineWidth=4;C.beginPath();C.arc(x,y,16+Math.sin(T*10)*3,0,TAU);C.stroke();
 if(hit)text("명중!",x,y-30,20,"#3fff7f","center",4);
 circ(aim.x,aim.y,10,"rgba(255,255,255,.35)");
}
function render(){
 C=ctx;ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
 if(G.state==="title"||G.state==="crop"){drawTitleBG();ctx.restore();return}
 const sx=G.shake?rnd(-G.shake,G.shake)*.5:0,sy=G.shake?rnd(-G.shake,G.shake)*.5:0;ctx.translate(sx,sy);
 ctx.drawImage(bgc,0,0);
 drawSky(lastDt);
 if(ship)drawShip(ship);
 waterBand(FARW+8,ST[G.stage-1][3],.8,.92);
 for(const s of swimmers)if(s.base===FARW)drawSwimmer(s);
 for(const t of treas)drawTreasure(t);
 for(const c of crates)drawCrate(c);
 for(const r of rows)drawRow(r);
 drawBoat();
 waterBand(NEARW+6,ST[G.stage-1][4],1,.93);
 for(const s of swimmers)if(s.base===NEARW)drawSwimmer(s);
 C.globalAlpha=.3;for(const f of fish){C.save();C.translate(f.x,f.y);C.scale(f.v<0?-1:1,1);ell(0,0,14,6,f.c);poly([-12,0,-22,-7,-22,7],f.c);C.restore()}C.globalAlpha=1;
 for(const s of splashes){const k=s.t/.8;C.strokeStyle="rgba(255,255,255,"+(1-k)+")";C.lineWidth=3;C.beginPath();C.ellipse(s.x,s.y,10+k*40*s.s,3+k*9*s.s,0,0,TAU);C.stroke()}
 for(const b of eballs)drawBall(b,true);
 for(const s of swords){C.save();C.translate(s.x,s.y);drawInkKnife(0,0,s.rot,1.3);C.restore();if(G.tapHint)text("톡!",s.x,s.y-34,18,"#ffd24d","center",4)}
 for(const b of balls)drawBall(b,false);
 for(const b of bullets){line(b.x,b.y,b.x-b.vx*.018,b.y-b.vy*.018,b.c,4);circ(b.x,b.y,3.5,"#fff")}
 for(const f of flyers){C.save();C.translate(f.x,f.y);C.rotate(f.rot);C.scale(f.sc,f.sc);drawFatty(0,60*f.e.r/24,f.e);C.restore()}
 for(const p of parts){ctx.globalAlpha=clamp(p.life*2,0,1);if(p.k==="plank"){C.save();C.translate(p.x,p.y);C.rotate(p.rot);rect(-7,-2,14,4,p.c);C.restore()}else circ(p.x,p.y,p.r,p.c)}ctx.globalAlpha=1;
 for(const c of coins){if(c.t<0)continue;ell(c.x,c.y,7*Math.abs(Math.cos(T*8+c.x)),7,"#ffd24d");circ(c.x,c.y,2,"#fff3a8")}
 drawWeather(lastDt);
 drawPreview();
 for(const t of texts){ctx.globalAlpha=clamp(t.life*1.5,0,1);text(t.t,t.x,t.y,t.sz,t.c,"center",4)}ctx.globalAlpha=1;
 ctx.restore();
 ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();drawHUD();ctx.restore();
}
function drawHUD(){
 rr(8,8,22+boat.maxHp*22,40,20,"rgba(0,0,0,.38)");for(let i=0;i<boat.maxHp;i++)heart(28+i*22,28,8.5,i<boat.hp?"#ff5a3a":"rgba(255,255,255,.25)");
 rr(8,64,96,40,20,"rgba(0,0,0,.38)");circ(30,84,11,"#ffd24d");circ(30,84,7,"#ffb000");text(save.gold+"",68,84,18,"#ffe28a");
 const name=G.stage+"탄 "+ST[G.stage-1][0];ctx.font="16px "+FONT;const w=ctx.measureText(name).width+26;rr(W-8-w,8,w,40,20,"rgba(0,0,0,.38)");text(name,W-8-w/2,28,16,"#ffe28a");
 const total=(G.stage===30?1:(G.stage===10||G.stage===20)?2:G.stage<8?1:G.stage<20?2:3),done=total-G.queue.length-(ship?1:0);
 if(ship&&!ship.sink&&ship.entered){const bw=170;rr(W-8-bw,56,bw,30,15,"rgba(0,0,0,.38)");rr(W-4-bw,70,(bw-8)*clamp(ship.hp/ship.maxHp,0,1),10,5,ship.kind===2?"#ff3a5a":"#ff8a2a");text((ship.kind===2?"대왕의 배":ship.kind===1?"대장 해적선":"해적선")+" "+(done+1)+"/"+total,W-8-bw/2,62,12,"#fff","center",3)}
 let px=120;if(G.triple>0){rr(px,64,54,26,13,"rgba(0,0,0,.38)");text("3갈래 "+G.triple,px+27,77,12,"#ffd24d");px+=60}if(G.big>0){rr(px,64,54,26,13,"rgba(0,0,0,.38)");text("왕알 "+G.big,px+27,77,12,"#ff9ae6");px+=60}
 const[mx,my]=boatW(CAN.x,CAN.y-32);if(reload>0){C.strokeStyle="rgba(0,0,0,.4)";C.lineWidth=6;C.beginPath();C.arc(mx,my,14,0,TAU);C.stroke();C.strokeStyle="#ffd24d";C.beginPath();C.arc(mx,my,14,-Math.PI/2,-Math.PI/2+TAU*(1-reload/reloadTime()));C.stroke()}
 if(G.banner>0){ctx.globalAlpha=clamp(G.banner,0,1);rr(30,H/2-200,W-60,80,20,"rgba(15,26,51,.75)");text(G.bannerT,W/2,H/2-160,32,"#ffe28a","center",5);ctx.globalAlpha=1}
 if(G.handHint&&G.state==="play"&&G.banner<=0){const t=(T*.7)%1,[ax,ay]=boatW(CAN.x,CAN.y),hx=ax+20+t*150,hy=ay-30-t*170;
  rr(30,120,W-60,62,16,"rgba(15,26,51,.75)");text("꾹 누르고 끌어서 대포 조준!",W/2,140,19,"#fff");text("손을 떼면 펑! 하얀 점이 날아갈 길이에요",W/2,164,15,"#bcd0ea");
  C.globalAlpha=.85;circ(hx,hy,16,"#fff");circ(hx,hy,10,"#ffd9b3");C.globalAlpha=1}
}
function drawTitleBG(){const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,"#2a5a9a");gr.addColorStop(.55,"#7ac0f0");gr.addColorStop(.56,"#2f80c0");gr.addColorStop(1,"#0f2a55");ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 for(let i=0;i<5;i++)cloud(((i*130+T*10)%(W+120))-80,60+i*40,1.2,"rgba(255,255,255,.7)")}

/* ===== 사진 넣기 ===== */
const cards=[...document.querySelectorAll(".ccard")];
function paintCards(){
 cards.forEach((card,i)=>{const c=card.querySelector("canvas"),cc=c.getContext("2d");C=cc;cc.setTransform(2,0,0,2,0,0);
  const gr=cc.createLinearGradient(0,0,0,150);gr.addColorStop(0,i?"#ff9a4a":"#3a6ab0");gr.addColorStop(1,"#14244a");cc.fillStyle=gr;cc.fillRect(0,0,120,150);
  drawCrew(56,146,i,{sc:i?1.12:.86,aim:-.25});C=ctx;
  card.querySelector(".nm").textContent=save.names[i];
  card.querySelector(".pbtn").textContent=faces[i]?"사진 바꾸기":"사진 넣기";
  card.querySelector(".xbtn").hidden=!faces[i]});
}
let cImg=null,cWho=0,cZ=1,cX=0,cY=0,cBase=1;const cropCv=$("cropCv");
function drawCrop(c2,full){const s=cBase*cZ,w=cImg.naturalWidth*s,h=cImg.naturalHeight*s;c2.drawImage(cImg,140-w/2+cX,140-h/2+cY,w,h);
 if(full){c2.fillStyle="rgba(0,0,0,.55)";c2.beginPath();c2.rect(0,0,280,280);c2.arc(140,140,110,0,TAU);c2.fill("evenodd");c2.strokeStyle="#fff";c2.lineWidth=3;c2.beginPath();c2.arc(140,140,110,0,TAU);c2.stroke()}}
function redrawCrop(){const c2=cropCv.getContext("2d");c2.setTransform(2,0,0,2,0,0);c2.fillStyle="#222";c2.fillRect(0,0,280,280);if(cImg)drawCrop(c2,true)}
cards.forEach((card,i)=>{
 card.querySelector(".pbtn").onclick=()=>{ac();cWho=i;$("file").value="";$("file").click()};
 card.querySelector(".xbtn").onclick=()=>{try{localStorage.removeItem("sea.photo"+i)}catch(e){}loadFace(i,null)};
 card.querySelector(".nm").onclick=()=>{const v=prompt("이름을 바꿀까요?",save.names[i]);if(v&&v.trim()){save.names[i]=v.trim().slice(0,6);store();paintCards()}};
});
$("file").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{cImg=im;cBase=280/Math.min(im.naturalWidth,im.naturalHeight);cZ=1;cX=cY=0;$("zoom").value=1;$("cropTitle").textContent=save.names[cWho]+" 얼굴 맞추기";$("title").hidden=true;$("crop").hidden=false;G.state="crop";redrawCrop()};
 im.onerror=()=>alert("사진을 열 수 없어요. 다른 사진을 골라 주세요.");im.src=url};
const cp=new Map();let pinch0=0,z0=1;
cropCv.addEventListener("pointerdown",e=>{cropCv.setPointerCapture(e.pointerId);cp.set(e.pointerId,{x:e.clientX,y:e.clientY});if(cp.size===2){const[a,b]=[...cp.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);z0=cZ}});
cropCv.addEventListener("pointermove",e=>{if(!cp.has(e.pointerId))return;const prev=cp.get(e.pointerId),k=280/cropCv.getBoundingClientRect().width;
 if(cp.size===1){cX+=(e.clientX-prev.x)*k;cY+=(e.clientY-prev.y)*k}cp.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(cp.size===2&&pinch0){const[a,b]=[...cp.values()];cZ=clamp(z0*Math.hypot(a.x-b.x,a.y-b.y)/pinch0,1,4);$("zoom").value=cZ}redrawCrop()});
const cpEnd=e=>{cp.delete(e.pointerId);if(cp.size<2)pinch0=0};cropCv.addEventListener("pointerup",cpEnd);cropCv.addEventListener("pointercancel",cpEnd);
$("zoom").oninput=e=>{cZ=+e.target.value;redrawCrop()};
function closeCrop(){$("crop").hidden=true;$("title").hidden=false;G.state="title";cImg=null}
$("cropNo").onclick=closeCrop;
$("cropOk").onclick=()=>{if(!cImg)return closeCrop();const o=document.createElement("canvas");o.width=o.height=220;const c2=o.getContext("2d");c2.translate(-30,-30);drawCrop(c2,false);
 const data=o.toDataURL("image/jpeg",.86);try{localStorage.setItem("sea.photo"+cWho,data)}catch(e){alert("사진을 저장할 공간이 부족해요. 이번 게임에서만 쓸게요.")}
 loadFace(cWho,data);SFX.pick();closeCrop()};

/* ===== 시작 버튼 ===== */
if(save.stage>1&&save.stage<=30){$("contBtn").hidden=false;$("contBtn").textContent="이어하기 · "+save.stage+"탄 "+ST[save.stage-1][0]}
$("goBtn").onclick=()=>{ac();save.power=0;startStage(1)};
$("contBtn").onclick=()=>{ac();startStage(clamp(save.stage,1,30))};
$("nextBtn").onclick=()=>startStage(Math.min(30,G.stage+1));
$("retryBtn").onclick=()=>startStage(G.stage);
$("againBtn").onclick=()=>{save.power=0;save.stage=1;store();startStage(1)};

function fit(){const s=$("stage").getBoundingClientRect(),k=Math.min(s.width/W,s.height/H),w=Math.floor(W*k),h=Math.floor(H*k);
 cv.style.width=w+"px";cv.style.height=h+"px";const dpr=Math.min(2.5,window.devicePixelRatio||1);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
 ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
 ["title","clear","dead","ending","crop"].forEach(id=>{$(id).style.width=w+"px";$(id).style.height=h+"px"})}
new ResizeObserver(fit).observe($("stage"));fit();
for(let i=0;i<2;i++){let d=null;try{d=localStorage.getItem("sea.photo"+i)}catch(e){}loadFace(i,d)}
paintCards();if(document.fonts)document.fonts.ready.then(paintCards);
let last=performance.now(),lastDt=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;lastDt=dt;update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.__sea={go:n=>startStage(n),G,st:()=>({state:G.state,stage:G.stage,hp:boat.hp,ship:ship?{hp:ship.hp,kind:ship.kind,entered:ship.entered,sink:ship.sink,pirates:ship.pirates.filter(p=>!p.gone).length}:null,queue:G.queue.length,eballs:eballs.length,rows:rows.length,gold:save.gold}),
 fire:(vx,vy)=>{reload=0;fireCannon(vx,vy)},
 autoFire:()=>{if(!ship)return false;const[mx,my]=muzzle();for(let sp=300;sp<900;sp+=10)for(let an=-1.4;an<-.1;an+=.02){let x=mx,y=my,vx=Math.cos(an+boat.rot)*sp,vy=Math.sin(an+boat.rot)*sp;for(let i=0;i<90;i++){vy+=GRAV*.02;x+=vx*.02;y+=vy*.02;const[lx,ly]=toShip(ship,x,y);if(lx>-100&&lx<60&&ly>-60&&ly<10){reload=0;cannonA=an;fireCannon(Math.cos(an+boat.rot)*sp,Math.sin(an+boat.rot)*sp);return true}if(y>H)break}}return false},tap:(x,y)=>tapShoot(x,y),ship:()=>ship,eballs:()=>eballs,muzzle,setFace:(i,d)=>loadFace(i,d),
 aimAt:(x,y)=>{aim.on=true;aim.drag=true;aim.x=x;aim.y=y},release:()=>{aim.on=false;const v=aimVel();fireCannon(v.vx,v.vy)},
 portrait:(c2,i,x,y,sc)=>{C=c2;drawCrew(x,y,i,{sc,aim:-.25});C=ctx},drawShipAt:(c2,x,y,ss)=>{C=c2;const s=newShip(0);s.x=x;s.wy=y;s.ss=ss;s.entered=true;drawShip(s);C=ctx}};
})();
