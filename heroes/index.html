<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%;color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>서준이 히어로즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 밤하늘 한 화면 게임: 위 얇은 상태줄 + 세로 무대. 메뉴·결과·노래는 무대 위에 겹치는 판 */
:root{
  --night:#141036; --deep:#1f1950; --gold:#ffcf4a; --mint:#5fe3c8; --lilac:#a993ff; --cream:#fff6e5; --muted:#b7b0e6; --pink:#ff8fc7;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--display);overflow:hidden;box-sizing:border-box;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:6px;box-sizing:border-box;max-width:620px;margin:0 auto}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:34px}
h1{margin:0;font-weight:400;font-size:clamp(16px,5vw,21px);color:var(--gold);white-space:nowrap}
.hud{display:flex;gap:5px;align-items:center;font-size:15px}
.pill{white-space:nowrap;padding:4px 10px;border-radius:999px;background:var(--deep);color:var(--muted)}
.pill.hi{background:var(--gold);color:var(--night)}
.hearts{color:var(--pink);letter-spacing:1px}
.hbtn{white-space:nowrap;font-family:var(--display);font-size:14px;border:0;border-radius:999px;padding:5px 11px;background:var(--deep);color:var(--cream);cursor:pointer}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
canvas{display:block;touch-action:none;border-radius:18px;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.sheet{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;box-sizing:border-box;text-align:center;border-radius:18px}
.sheet[hidden]{display:none}
#menu{justify-content:flex-end;padding-bottom:20px;background:linear-gradient(to bottom,transparent 52%,rgba(20,16,54,.88) 68%)}
#menu h2{font-size:26px}
.sheet h2{margin:0;font-weight:400;font-size:32px;color:var(--gold);text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.sheet p{margin:0;font-size:16px;color:var(--muted);line-height:1.45;max-width:30ch}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}
.cards button{font-family:var(--display);border:0;border-radius:16px;cursor:pointer;text-align:left;padding:12px 13px;color:var(--night);display:grid;gap:3px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.cards button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.cards b{font-weight:400;font-size:19px}
.cards span{font-size:13px;opacity:.75;line-height:1.3}
.c1{background:var(--mint)} .c2{background:var(--gold)} .c3{background:var(--pink)} .c4{background:var(--lilac)}
#done{background:rgba(20,16,54,.72)}
.stars{font-size:46px;letter-spacing:.08em;color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.go{font-family:var(--display);font-size:21px;border:0;border-radius:14px;padding:12px 26px;background:var(--gold);color:var(--night);cursor:pointer}
.ghost{font-family:var(--display);font-size:18px;border:0;border-radius:14px;padding:12px 18px;background:var(--deep);color:var(--cream);cursor:pointer}
.howto{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,16,54,.88);border-radius:18px;padding:16px 20px;text-align:center;pointer-events:none;transition:opacity .35s;max-width:78%}
.howto b{display:block;font-weight:400;font-size:24px;color:var(--gold);margin-bottom:6px}
.howto span{font-size:16px;line-height:1.45;color:var(--cream)}
/* 노래 */
#song{justify-content:flex-end;padding-bottom:18px;background:linear-gradient(to bottom,transparent 50%,rgba(20,16,54,.85) 64%)}
.lyr{min-height:118px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center}
.lyr .now{font-size:30px;line-height:1.25;color:var(--cream);text-wrap:balance}
.lyr .now i{font-style:normal;color:rgba(255,246,229,.35);transition:color .15s}
.lyr .now i.on{color:var(--gold)}
.lyr .nxt{font-size:17px;color:var(--muted)}
.songT{font-size:15px;color:var(--muted)}
.songT b{display:block;font-weight:400;font-size:24px;color:var(--lilac)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.howto,.lyr .now i{transition:none}}
</style>

<div class="app">
  <div class="bar">
    <h1>서준이 히어로즈</h1>
    <div class="hud" id="hud"></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="히어로 게임 무대"></canvas>
    <div class="howto" id="howto" style="opacity:0"></div>
    <div class="sheet" id="menu">
      <h2>오늘은 누가 출동할까?</h2>
      <div class="cards">
        <button type="button" class="c1" id="m1"><b>별빛 장풍</b><span>루미가 톡! 좀비를 별로 바꿔요</span></button>
        <button type="button" class="c2" id="m2"><b>마법 포털</b><span>서준이가 동그라미를 그려 쏙!</span></button>
        <button type="button" class="c3" id="m3"><b>반사 방패</b><span>바위 거인의 돌을 되돌려요</span></button>
        <button type="button" class="c4" id="m4"><b>쉬는 시간 노래</b><span>별님이 지켜 줄게</span></button>
      </div>
    </div>
    <div class="sheet" id="done" hidden>
      <h2 id="dTitle">우리가 이겼다!</h2>
      <div class="stars" id="dStars"></div>
      <p id="dText"></p>
      <div class="row"><button type="button" class="go" id="dAgain">한 번 더</button><button type="button" class="ghost" id="dMenu">다른 게임</button></div>
    </div>
    <div class="sheet" id="song" hidden>
      <div class="songT"><b>완다가 쉴 때 듣는 노래</b>「별님이 지켜 줄게」</div>
      <div class="lyr"><div class="now" id="lNow"></div><div class="nxt" id="lNext"></div></div>
      <div class="row"><button type="button" class="go" id="sPlay">처음부터 듣기</button><button type="button" class="ghost" id="sLoop">계속 듣기 끔</button><button type="button" class="ghost" id="sBack">나가기</button></div>
    </div>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
const W=500,H=860;
const rnd=(a,b)=>a+Math.random()*(b-a);
let mode="menu",T=0,last=performance.now(),dt=1,sound=true;
let hearts=5,score=0,ents=[],shots=[],parts=[],texts=[],boss=null,wave=0,spawnLeft=0,spawnT=0,over=false,shake=0,castT=0;

/* ───── 소리 ───── */
let ac=null,master=null;
function A(){if(!sound)return null;try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.8;master.connect(ac.destination)}if(ac.state==="suspended")ac.resume()}catch(_){ac=null}return ac}
function tone(f1,f2,d,type,vol,at){const a=A();if(!a)return;const t=a.currentTime+(at||0),o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d+.03);o.connect(g).connect(master);o.start(t);o.stop(t+d+.06)}

  const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+(at||0);fl.type="bandpass";fl.frequency.setValueAtTime(f,t);if(sweep)fl.frequency.exponentialRampToValueAtTime(sweep,t+d);fl.Q.value=1.2;g.gain.value=vol||.3;s.buffer=b;s.connect(fl).connect(g).connect(master);s.start(t)}

  zap(){tone(1200,500,.12,"triangle",.14);tone(1800,900,.1,"sine",.08)},
  big(){tone(300,1400,.35,"sawtooth",.08);noise(.4,800,.18,0,3000)},
  boom(){noise(.25,600,.35);tone(140,50,.2,"sine",.3)},
  pop(){[880,1175,1568].forEach((f,i)=>tone(f,f*1.02,.09,"triangle",.12,i*.05))},
  hurt(){tone(400,120,.3,"square",.08)},
  hit(){noise(.18,300,.4);tone(110,60,.22,"sine",.35)},
  swoosh(){noise(.6,300,.25,0,2400)},
  ding(){tone(1568,1568,.25,"sine",.15);tone(2093,2093,.3,"sine",.1,.06)},
  nope(){tone(330,300,.12,"triangle",.1)},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,.25,"square",.07,i*.12));setTimeout(()=>noise(1,1500,.2),500)}
};
function shout(t){if(!sound||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.pitch=1.3;u.rate=1;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(_){}}

/* ───── 그림 도구 ───── */
function star(x,y,r,c,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.restore()}
function ell(x,y,rx,ry,c){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fillStyle=c;ctx.fill()}
function circ(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=c;ctx.fill()}
function glow(x,y,r,c){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}

/* 루미: 민트 망토, 별 머리핀, 손에서 별빛 */
function lumi(x,y,s,cast){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);const b=Math.sin(T*.08)*1.5;
  ell(0,44,30,8,"rgba(0,0,0,.28)");
  ctx.fillStyle="#2fbfa6";ctx.beginPath();ctx.moveTo(-16,-6);ctx.quadraticCurveTo(-36,26+b,-28,42);ctx.lineTo(28,42);ctx.quadraticCurveTo(36,26-b,16,-6);ctx.closePath();ctx.fill();
  ctx.fillStyle="#3b2f63";ctx.fillRect(-11,22,8,18);ctx.fillRect(3,22,8,18);ell(-7,41,7,4,"#ffcf4a");ell(7,41,7,4,"#ffcf4a");
  ctx.fillStyle="#9a7cf5";ctx.beginPath();ctx.moveTo(-15,-8);ctx.lineTo(15,-8);ctx.lineTo(21,26);ctx.lineTo(-21,26);ctx.closePath();ctx.fill();
  star(0,8,6,"#ffcf4a");
  ctx.strokeStyle="#9a7cf5";ctx.lineWidth=8;ctx.lineCap="round";ctx.beginPath();
  const ax=cast?24:21,ay=cast?-26:14;ctx.moveTo(-13,-4);ctx.lineTo(-ax,ay);ctx.moveTo(13,-4);ctx.lineTo(ax,ay);ctx.stroke();
  circ(-ax,ay,5,"#ffd9bd");circ(ax,ay,5,"#ffd9bd");
  if(cast){glow(-ax,ay,22,"rgba(127,243,255,.9)");glow(ax,ay,22,"rgba(127,243,255,.9)")}
  circ(0,-30,23,"#5a3423");ell(-17,-14,8,17,"#5a3423");ell(17,-14,8,17,"#5a3423");
  circ(0,-29,18,"#ffd9bd");
  ctx.fillStyle="#5a3423";ctx.beginPath();ctx.arc(0,-31,19.5,Math.PI*1.02,Math.PI*1.98);ctx.quadraticCurveTo(4,-36,-19,-33);ctx.fill();
  eyes(-7,7,-27,3.6);ell(-12,-21,4,2.5,"rgba(255,120,150,.45)");ell(12,-21,4,2.5,"rgba(255,120,150,.45)");
  ctx.strokeStyle="#6b2c3a";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-21,4,.15*Math.PI,.85*Math.PI);ctx.stroke();
  star(14,-46,7,"#ffcf4a",.3);
  ctx.restore();
}
/* 서준: 파란 옷, 금빛 망토, 별 지팡이 */
function seojun(x,y,s,cast){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);const b=Math.sin(T*.08+1)*1.5;
  ell(0,44,30,8,"rgba(0,0,0,.28)");
  ctx.fillStyle="#f2b33a";ctx.beginPath();ctx.moveTo(-16,-6);ctx.quadraticCurveTo(-38,24+b,-30,42);ctx.lineTo(30,42);ctx.quadraticCurveTo(38,24-b,16,-6);ctx.closePath();ctx.fill();
  ctx.fillStyle="#24357a";ctx.fillRect(-11,20,9,20);ctx.fillRect(2,20,9,20);ell(-7,41,7,4,"#e8f0ff");ell(7,41,7,4,"#e8f0ff");
  ctx.fillStyle="#3a6ff0";ctx.beginPath();ctx.roundRect(-16,-9,32,32,9);ctx.fill();
  ctx.fillStyle="#ffcf4a";ctx.fillRect(-16,12,32,4);
  ctx.strokeStyle="#3a6ff0";ctx.lineWidth=8;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-13,-3);ctx.lineTo(-21,14);ctx.moveTo(13,-3);ctx.lineTo(cast?22:21,cast?-24:12);ctx.stroke();
  circ(-21,14,5,"#ffd9bd");const hx=cast?22:21,hy=cast?-24:12;circ(hx,hy,5,"#ffd9bd");
  ctx.strokeStyle="#7a4a24";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(hx,hy+6);ctx.lineTo(hx+(cast?6:10),hy-(cast?30:24));ctx.stroke();
  const sx=hx+(cast?6:10),sy=hy-(cast?32:26);if(cast)glow(sx,sy,26,"rgba(255,207,74,.9)");star(sx,sy,9,"#ffcf4a",T*.05);
  circ(0,-29,18,"#ffd9bd");
  ctx.fillStyle="#1c1712";ctx.beginPath();ctx.arc(0,-31,19,Math.PI*1.05,Math.PI*1.95);ctx.lineTo(16,-36);ctx.lineTo(8,-38);ctx.lineTo(2,-34);ctx.lineTo(-6,-38);ctx.lineTo(-17,-34);ctx.closePath();ctx.fill();
  eyes(-7,7,-26,3.4);ell(-12,-20,4,2.5,"rgba(255,120,150,.4)");ell(12,-20,4,2.5,"rgba(255,120,150,.4)");
  ctx.strokeStyle="#6b2c3a";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-21,5,.1*Math.PI,.9*Math.PI);ctx.stroke();
  ctx.restore();
}
/* 좀비: 초록 얼굴, 짝짝이 눈, 팔 앞으로 */
function zombie(e){
  ctx.save();ctx.translate(e.x,e.y);const s=e.s||1;ctx.scale(s,s);const w=Math.sin(T*.12+e.ph)*4;ctx.rotate(Math.sin(T*.1+e.ph)*.08);
  if(e.flash>0){ctx.globalAlpha=.6+.4*Math.sin(T)}
  ell(0,34,22,6,"rgba(0,0,0,.25)");
  ctx.fillStyle="#4d5385";ctx.fillRect(-11,16,9,17+w*.3);ctx.fillRect(2,16,9,17-w*.3);
  ctx.fillStyle="#8a7b67";ctx.beginPath();ctx.moveTo(-15,-6);ctx.lineTo(15,-6);ctx.lineTo(16,18);ctx.lineTo(9,14);ctx.lineTo(3,19);ctx.lineTo(-4,14);ctx.lineTo(-10,19);ctx.lineTo(-16,16);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#7cc46a";ctx.lineWidth=7;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-13,-2);ctx.lineTo(-22,8+w);ctx.moveTo(13,-2);ctx.lineTo(22,8-w);ctx.stroke();
  circ(0,-20,16,"#7cc46a");
  if(e.hp>1){ctx.fillStyle="#9aa3b5";ctx.beginPath();ctx.arc(0,-22,17,Math.PI,0);ctx.fill();ctx.fillStyle="#c9d0dc";ctx.fillRect(-17,-23,34,4)}
  else{ctx.fillStyle="#3e6b33";ctx.beginPath();ctx.moveTo(-4,-35);ctx.lineTo(0,-42);ctx.lineTo(3,-35);ctx.fill()}
  circ(-6,-18,5.5,"#fff");circ(7,-19,3.8,"#fff");circ(-5,-17,2.5,"#231a3a");circ(7,-18,1.9,"#231a3a");
  ctx.strokeStyle="#2f4a28";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-7,-8);ctx.lineTo(-3,-10);ctx.lineTo(0,-8);ctx.lineTo(3,-10);ctx.lineTo(7,-8);ctx.stroke();
  ctx.restore();

/* 깡통 대왕: 은색 로봇, 왕관 */
function robot(b){
  ctx.save();ctx.translate(b.x,b.y+(b.hurt>0?rnd(-3,3):0));const s=b.s;ctx.scale(s,s);
  ell(0,58,52,10,"rgba(0,0,0,.3)");
  ctx.fillStyle="#555b6e";ctx.fillRect(-44,40,30,16);ctx.fillRect(14,40,30,16);
  ctx.fillStyle=b.hurt>0?"#ffffff":"#b9c2d3";ctx.beginPath();ctx.roundRect(-40,-20,80,62,12);ctx.fill();
  ctx.fillStyle="#2a2f45";ctx.beginPath();ctx.roundRect(-28,-8,56,30,8);ctx.fill();
  const blink=Math.sin(T*.05)>.95;ctx.fillStyle="#ffcf4a";if(!blink){ctx.fillRect(-18,0,10,10);ctx.fillRect(8,0,10,10)}else{ctx.fillRect(-18,4,10,3);ctx.fillRect(8,4,10,3)}
  ctx.strokeStyle="#b9c2d3";ctx.lineWidth=9;ctx.lineCap="round";const sw=Math.sin(T*.1)*8;ctx.beginPath();ctx.moveTo(-40,8);ctx.lineTo(-58,20+sw);ctx.moveTo(40,8);ctx.lineTo(58,20-sw);ctx.stroke();
  ctx.strokeStyle="#7d869a";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(0,-34);ctx.stroke();circ(0,-36,5,Math.sin(T*.2)>0?"#ff6a6a":"#ffd0d0");
  ctx.fillStyle="#ffcf4a";ctx.beginPath();ctx.moveTo(-26,-20);ctx.lineTo(-26,-32);ctx.lineTo(-15,-25);ctx.lineTo(-8,-36);ctx.lineTo(0,-26);ctx.lineTo(8,-36);ctx.lineTo(15,-25);ctx.lineTo(26,-32);ctx.lineTo(26,-20);ctx.closePath();ctx.fill();
  ctx.restore();hpBar(b);
}
/* 바위 거인 쿵쾅: 이끼 덮인 돌 */
function giant(b){
  ctx.save();ctx.translate(b.x+(b.hurt>0?rnd(-4,4):0),b.y);const s=b.s;ctx.scale(s,s);
  ell(0,62,62,12,"rgba(0,0,0,.3)");
  ctx.fillStyle="#6e655b";ctx.fillRect(-36,36,24,26);ctx.fillRect(12,36,24,26);
  const lift=b.throwT>0?-30:0;ctx.fillStyle="#857a6d";ell(-58,-4+lift,16,22,"#857a6d");ell(58,-4+lift,16,22,"#857a6d");
  ctx.fillStyle=b.hurt>0?"#ffffff":"#958a7c";ctx.beginPath();ctx.ellipse(0,0,56,50,0,0,7);ctx.fill();
  ell(-22,18,9,6,"#7d7266");ell(26,24,7,5,"#7d7266");ell(30,-8,6,4,"#7d7266");
  ctx.fillStyle="#6fae55";ctx.beginPath();ctx.ellipse(0,-40,40,14,0,Math.PI,0);ctx.fill();circ(-26,-40,9,"#6fae55");circ(22,-42,10,"#6fae55");

    ctx.fillStyle=hot?"rgba(255,143,199,.22)":"rgba(255,143,199,.08)";ctx.fillRect(0,ZONE.y1,W,ZONE.y2-ZONE.y1);

    ctx.fillStyle="rgba(255,246,229,.7)";ctx.font="16px Jua, sans-serif";ctx.textAlign="right";ctx.fillText("반사 줄",W-12,ZONE.y1+22);
    if(boss)giant(boss);
    for(const e of ents)zombie(e);
    for(const r of shots){if(r.inZone){ctx.strokeStyle="#ff8fc7";ctx.lineWidth=4;ctx.beginPath();ctx.arc(r.x,r.y,r.r+10+Math.sin(T*.4)*3,0,7);ctx.stroke()}rock(r);if(r.back)glow(r.x,r.y,30,"rgba(255,143,199,.6)")}
    const c=castT>0;lumi(H3[0].x,H3[0].y,1.3,c);seojun(H3[1].x,H3[1].y,1.3,c);
    if(c){ctx.strokeStyle="rgba(255,143,199,.7)";ctx.lineWidth=5;ctx.beginPath();ctx.arc(W/2,H-110,170,Math.PI*1.15,Math.PI*1.85);ctx.stroke()}
  }
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l/p.m);if(p.st)star(p.x,p.y,p.r,p.c,p.rot);else circ(p.x,p.y,p.r*.6,p.c)}ctx.globalAlpha=1;
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.l/20);ctx.textAlign="center";ctx.font=`${t.big?30:22}px Jua, sans-serif`;ctx.lineWidth=5;ctx.strokeStyle="rgba(20,16,54,.85)";ctx.strokeText(t.t,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.t,t.x,t.y)}ctx.globalAlpha=1;
}
function drawSleep(){
  // 노래: 구름 침대에서 쉬는 루미, 떠다니는 별
  const y=H*.3+Math.sin(T*.02)*6;
  ell(250,y+40,150,40,"#e9e4ff");ell(170,y+20,70,42,"#f4f0ff");ell(320,y+18,80,46,"#f4f0ff");ell(250,y+6,70,44,"#fff");
  ctx.save();ctx.translate(250,y-6);ctx.rotate(-.12);
  ell(0,10,58,18,"#9a7cf5");circ(-52,-2,20,"#5a3423");circ(-52,-1,15,"#ffd9bd");
  ctx.strokeStyle="#231a3a";ctx.lineWidth=2;ctx.beginPath();ctx.arc(-57,0,3,.1,Math.PI-.1);ctx.stroke();ctx.beginPath();ctx.arc(-47,0,3,.1,Math.PI-.1);ctx.stroke();
  star(-44,-18,6,"#ffcf4a",.3);ctx.restore();
  ctx.fillStyle="rgba(255,246,229,.85)";ctx.font="26px Jua, sans-serif";ctx.textAlign="left";const z=(T*.02)%3;["z","z","Z"].forEach((c,i)=>{ctx.globalAlpha=Math.max(0,Math.min(1,z-i));ctx.fillText(c,200-i*14+i*30,y-60-i*24)});ctx.globalAlpha=1;
  if(T%14<1)parts.push({x:rnd(30,470),y:H-160,vx:rnd(-.2,.2),vy:-rnd(.4,.9),l:200,m:200,c:["#ffcf4a","#fff","#a993ff","#7ff3ff"][Math.floor(rnd(0,4))],r:rnd(2,5),st:true,rot:0});
}

/* ───── 반복 ───── */
function loop(now){
  dt=Math.min(2.5,(now-last)/16.67);last=now;T+=dt;
  if(!over){if(mode==="g1")g1();if(mode==="g2")g2();if(mode==="g3")g3()}
  else if(mode==="g3"&&boss)boss.hurt-=dt;
  castT-=dt;
  parts=parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.st&&mode!=="song"?.08*dt:0;p.rot+=.05;return (p.l-=dt)>0});
  texts=texts.filter(t=>{t.y-=.5*dt;return (t.l-=dt)>0});
  draw();if(mode==="song")songTick();requestAnimationFrame(loop);
}

/* ───── 입력 ───── */
function pt(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener("pointerdown",e=>{if(over)return;A();const p=pt(e);
  if(mode==="g1"){cv.setPointerCapture(e.pointerId);g1Down(p)}
  if(mode==="g2"){cv.setPointerCapture(e.pointerId);stroke=[p]}
  if(mode==="g3")g3Down(p)});
cv.addEventListener("pointermove",e=>{const p=pt(e);if(mode==="g1"&&charge){charge.x=p.x;charge.y=p.y}if(mode==="g2"&&stroke){const l=stroke[stroke.length-1];if(Math.hypot(p.x-l.x,p.y-l.y)>6)stroke.push(p)}});
cv.addEventListener("pointerup",e=>{const p=pt(e);if(mode==="g1")g1Up(p);if(mode==="g2")g2Up()});
cv.addEventListener("pointercancel",()=>{charge=null;stroke=null});

/* ───── 노래: 「별님이 지켜 줄게」 3/4박 자장가 ───── */
const BEAT=.72;
const N=n=>440*Math.pow(2,(n-69)/12);
const V8=[1,1,1,1,1,1,1,2],C7=[1,1,1,1,1,1,3];
const MEL={
  VA:[67,64,64,65,67,69,67,64],VB:[65,62,62,64,65,67,65,62],VC:[64,67,72,72,71,69,67,69],VD:[67,65,64,62,64,62,60,60],
  CA:[72,71,69,67,69,71,72],CB:[69,67,65,64,65,67,69],CC:[67,64,67,64,65,64,62],CD:[64,65,67,69,67,62,60]};
const CH={C:[48,55,64],F:[41,53,60],G:[43,55,62],Am:[45,52,60],Dm:[50,57,65]};
const HAR={VA:["C","F","C"],VB:["Dm","G","G"],VC:["C","Am","F"],VD:["G","G","C"],CA:["C","F","C"],CB:["F","C","F"],CC:["C","C","G"],CD:["C","G","C"]};
const SONG=[
  ["VA","반 짝 반 짝|마 법 손 을"],["VB","이 제|살 짝|내 려 놔 요"],["VC","오 늘 도|고 마 웠 어 요"],["VD","우 리|완 다|최 고 예 요"],
  ["CA","별 님 이|지 켜 줄 게"],["CB","달 님 이|안 아 줄 게"],["CC","코 오|코 오|쉬 어 요"],["CD","꿈 에 서|또|만 나 요"],
  ["VA","좀 비 들 도|잠 이|들 고"],["VB","악 당 들 도|집 에|갔 어"],["VC","서 준 이 가|옆 에|있 어"],["VD","이 제|푹|쉬 어 도|돼 요"],
  ["CA","별 님 이|지 켜 줄 게"],["CB","달 님 이|안 아 줄 게"],["CC","코 오|코 오|쉬 어 요"],["CD","꿈 에 서|또|만 나 요"]];
let song={on:false,t0:0,loop:false,line:-1,timer:null,nodes:[]};
function lineLen(){return 9*BEAT}
function playNote(a,f,t,d,vol,kind){
  const o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain();
  if(kind==="mel"){o.type="sine";o2.type="triangle";o2.frequency.value=f*2;const g2=a.createGain();g2.gain.value=.12;o2.connect(g2).connect(g);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.03);g.gain.exponentialRampToValueAtTime(vol*.5,t+.25);g.gain.exponentialRampToValueAtTime(.0001,t+d+.35);
    const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=5;lg.gain.value=f*.006;lfo.connect(lg).connect(o.frequency);lfo.start(t);lfo.stop(t+d+.4);song.nodes.push(lfo)}
  else{o.type="triangle";o2.type="sine";o2.frequency.value=f*3;const g2=a.createGain();g2.gain.value=.05;o2.connect(g2).connect(g);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
  o.frequency.value=f;o.connect(g).connect(master);o.start(t);o2.start(t);o.stop(t+d+.4);o2.stop(t+d+.4);song.nodes.push(o,o2);
}
function startSong(){
  const a=A();if(!a){$("lNow").textContent="소리를 켜면 노래가 나와요";return}
  stopSong();song.on=true;const t0=a.currentTime+.25;song.t0=t0;song.line=-1;
  SONG.forEach(([k,ly],li)=>{const mel=MEL[k],rh=mel.length===8?V8:C7;let t=t0+li*lineLen();
    mel.forEach((n,i)=>{playNote(a,N(n),t,rh[i]*BEAT*.95,.16,"mel");t+=rh[i]*BEAT});
    HAR[k].forEach((c,bi)=>{const ch=CH[c],bt=t0+li*lineLen()+bi*3*BEAT;playNote(a,N(ch[0]),bt,BEAT*2.8,.11,"acc");playNote(a,N(ch[1]),bt+BEAT,BEAT*.9,.06,"acc");playNote(a,N(ch[2]),bt+BEAT*2,BEAT*.9,.06,"acc");
      if(li%4===3&&bi===2)playNote(a,N(ch[0]+24),bt+BEAT*2,BEAT*2,.04,"acc")})});
  $("sPlay").textContent="멈추기";
}
function stopSong(){song.on=false;song.nodes.forEach(n=>{try{n.stop()}catch(_){}});song.nodes=[];$("sPlay").textContent="처음부터 듣기"}
function songTick(){
  if(!song.on||!ac){return}
  const el=ac.currentTime-song.t0;if(el<0)return;
  const li=Math.floor(el/lineLen());
  if(li>=SONG.length){if(song.loop){startSong()}else{stopSong();$("lNow").innerHTML="잘 자요, 완다";$("lNext").textContent="코오…";}return}
  const [k,ly]=SONG[li],rh=MEL[k].length===8?V8:C7;
  let b=(el-li*lineLen())/BEAT,idx=-1,acc=0;for(let i=0;i<rh.length;i++){if(b>=acc)idx=i;acc+=rh[i]}
  if(li!==song.line||idx!==song.idx){song.line=li;song.idx=idx;
    $("lNow").innerHTML=lyr(ly,idx);
    $("lNext").textContent=SONG[li+1]?plain(SONG[li+1][1]):""}
}
function plain(ly){return ly.split("|").map(w=>w.replace(/ /g,"")).join(" ")}
function lyr(ly,idx){let n=0;return ly.split("|").map(w=>w.split(" ").map(c=>`<i class="${n++<=idx?"on":""}">${c}</i>`).join("")).join(" ")}
function openSong(){mode="song";reset();$("menu").hidden=true;$("song").hidden=false;$("lNow").innerHTML=lyr(SONG[0][1],-1);$("lNext").textContent=plain(SONG[1][1]);hud();startSong()}
$("sPlay").onclick=()=>{if(song.on)stopSong();else startSong()};
$("sLoop").onclick=()=>{song.loop=!song.loop;$("sLoop").textContent=song.loop?"계속 듣기 켬":"계속 듣기 끔"};
$("sBack").onclick=toMenu;

/* 버튼 */
$("m1").onclick=()=>start("g1");$("m2").onclick=()=>start("g2");$("m3").onclick=()=>start("g3");$("m4").onclick=openSong;
$("dAgain").onclick=()=>start(mode);$("dMenu").onclick=toMenu;

function fit(){const s=$("stage").getBoundingClientRect(),k=Math.min(s.width/W,s.height/H),w=Math.floor(W*k),h=Math.floor(H*k);
  cv.style.width=w+"px";cv.style.height=h+"px";const dpr=Math.min(2.5,window.devicePixelRatio||1);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  ["menu","done","song"].forEach(id=>{const el=$(id);el.style.inset="auto";el.style.width=w+"px";el.style.height=h+"px"})}
new ResizeObserver(fit).observe($("stage"));
hud();fit();requestAnimationFrame(loop);
window.__h={st:()=>({mode,hearts,score,sent,need,wave,over,boss:boss&&{hp:boss.hp,x:boss.x,y:boss.y},ents:ents.length,shots:shots.map(r=>({x:r.x,y:r.y,back:r.back}))}),ents:()=>ents,song:()=>song};
})();
</script>
