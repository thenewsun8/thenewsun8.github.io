<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="노화 바이러스">
<meta name="theme-color" content="#BFE6FF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>*,::before,::after{box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>노화 바이러스 베기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap">
<style>
/* 단일 테마(밝은 놀이판): 하늘색 배경 + 위쪽 나이 게이지 + 전체 화면 캔버스 */
:root{--sky1:#BFE6FF;--sky2:#FFF4D6;--ink:#20314A;--virus:#7BC96F;--virus-dark:#3E8E41;--sun:#FFB627;--pink:#FF6F91;--white:#FFFFFF;
  --f-display:"Jua","Apple SD Gothic Neo",sans-serif;--f-body:"Gaegu","Apple SD Gothic Neo",sans-serif;color-scheme:light}
html,body{height:100%}
body{background:var(--sky1);color:var(--ink);font-family:var(--f-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;display:block;width:100%;height:100%}
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));pointer-events:none;font-family:var(--f-display)}
.pill{background:var(--white);border-radius:999px;padding:6px 14px;font-size:18px;box-shadow:0 2px 0 rgba(32,49,74,.15);font-variant-numeric:tabular-nums}
.pill b{color:var(--pink)}
.screen{position:fixed;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.box{max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.box h1{font-family:var(--f-display);font-size:clamp(34px,9vw,52px);margin:0;line-height:1.15;color:var(--ink)}
.box p{margin:0;font-size:21px;line-height:1.4}
.box .small{font-size:17px;opacity:.75}
.btn{font-family:var(--f-display);font-size:24px;border:0;border-radius:999px;padding:12px 34px;background:var(--pink);color:var(--white);cursor:pointer;box-shadow:0 4px 0 #C94468}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #C94468}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.legend{display:flex;gap:18px;justify-content:center;font-size:19px}
canvas.face{width:120px;height:120px}
[hidden]{display:none!important}
.opts{display:flex;flex-direction:column;gap:8px;align-items:center;margin:4px 0}
.optrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:16px}
.opt{font:inherit;font-size:16px;border:2px solid #E6D8B8;background:#FFFFFF;color:#20314A;border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:#FF6F91;background:#FFE1E8}
</style>

<canvas id="game" aria-label="노화 바이러스 베기 게임 화면"></canvas>
<div class="hud" id="hud" hidden>
  <div class="pill">나이 <b id="age">80</b>살</div>
  <div class="pill">⏱ <span id="time">60</span></div>
  <div class="pill">베기 <span id="score">0</span></div>
</div>

<div class="screen" id="start">
  <div class="box">
    <canvas class="face" id="faceStart" width="240" height="240" aria-hidden="true"></canvas>
    <h1>노화 바이러스 베기</h1>
    <p>날아오는 초록 바이러스를 손가락으로 쓱! 베면 할아버지가 젊어져요.</p>
    <div class="legend"><span>🦠 베기 = 젊어짐</span><span>💣 베면 = 늙음</span></div>
    <div class="opts">
      <div class="optrow" role="group" aria-label="한 마리당 젊어지는 나이"><span>한 마리당</span><button class="opt" type="button" data-step="1" aria-pressed="false">-1살</button><button class="opt" type="button" data-step="2" aria-pressed="true">-2살</button><button class="opt" type="button" data-step="3" aria-pressed="false">-3살</button></div>
      <div class="optrow"><span>소리</span><button class="opt" type="button" id="snd" aria-pressed="true">켜짐 🔊</button></div>
    </div>
    <button class="btn" id="go" type="button">시작!</button>
    <p class="small">60초 동안 몇 살까지 젊어질 수 있을까?</p>
  </div>
</div>

<div class="screen" id="end" hidden>
  <div class="box">
    <canvas class="face" id="faceEnd" width="240" height="240" aria-hidden="true"></canvas>
    <h1 id="endTitle">20살이 됐어요!</h1>
    <p id="endText">바이러스 0마리를 벴어요.</p>
    <p class="small" id="best"></p>
    <button class="btn" id="again" type="button">한 번 더!</button>
  </div>
</div>

<script>
const cv=document.getElementById("game"),cx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

const AGE_START=80,AGE_MIN=10,ROUND=60;
let STEP=2,SOUND=true;
try{const s=JSON.parse(localStorage.getItem("agegame-opts")||"null");if(s){STEP=s.step||2;SOUND=s.sound!==false}}catch(_){}
let actx=null;
function tone(f1,f2,dur,type,vol){if(!SOUND)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.connect(g);g.connect(actx.destination);const t=actx.currentTime;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.02)}catch(_){}}
const sfx={cut:()=>tone(900,1500,.12,"triangle",.18),combo:()=>{tone(700,1400,.1,"square",.08);setTimeout(()=>tone(1000,1900,.14,"square",.08),90)},bomb:()=>tone(220,55,.45,"sawtooth",.22),end:()=>{tone(523,523,.15);setTimeout(()=>tone(659,659,.15),160);setTimeout(()=>tone(784,784,.3),320)}};
let things=[],halves=[],sparks=[],pops=[],trail=[];
let age=AGE_START,score=0,timeLeft=ROUND,playing=false,last=0,spawnT=0;
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

function drawFace(c,a,x,y,r){ // a: age 10~80
  const t=Math.max(0,Math.min(1,(a-10)/70)); // 1=old
  c.save();c.translate(x,y);
  c.fillStyle="#FFD9B8";c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();
  // hair
  const hair=`rgb(${Math.round(60+180*t)},${Math.round(40+190*t)},${Math.round(30+200*t)})`;
  c.fillStyle=hair;c.beginPath();c.arc(0,-r*.15,r*1.02,Math.PI*1.05,Math.PI*1.95);c.fill();
  if(t<.6){c.beginPath();c.ellipse(0,-r*.72,r*.8*(1-t*.6),r*.32,0,0,Math.PI*2);c.fill()}
  // eyes
  c.fillStyle="#20314A";c.beginPath();c.arc(-r*.35,-r*.05,r*.09,0,Math.PI*2);c.arc(r*.35,-r*.05,r*.09,0,Math.PI*2);c.fill();
  // wrinkles
  c.strokeStyle=`rgba(150,90,60,${.75*t})`;c.lineWidth=r*.04;c.lineCap="round";
  for(let i=0;i<3;i++){c.beginPath();c.moveTo(-r*.45,-r*.45+i*r*.12);c.quadraticCurveTo(0,-r*.52+i*r*.12,r*.45,-r*.45+i*r*.12);c.stroke()}
  // cheeks
  c.fillStyle=`rgba(255,111,145,${.55*(1-t)})`;c.beginPath();c.arc(-r*.55,r*.22,r*.14,0,Math.PI*2);c.arc(r*.55,r*.22,r*.14,0,Math.PI*2);c.fill();
  // mouth
  c.strokeStyle="#20314A";c.lineWidth=r*.07;c.beginPath();c.arc(0,r*.25,r*.3,Math.PI*.15,Math.PI*.85);c.stroke();
  c.restore();
}
function paintFaceCanvas(id,a){const c=$(id).getContext("2d");c.clearRect(0,0,240,240);drawFace(c,a,120,128,96)}
paintFaceCanvas("faceStart",80);

function spawn(){
  const bomb=Math.random()<Math.min(.12+0.002*(ROUND-timeLeft)*2,.22);
  const r=bomb?26:30+Math.random()*10;
  const x=W*.15+Math.random()*W*.7;
  const vx=(W/2-x)*(.4+Math.random()*.5)/60+(Math.random()-.5)*1.2;
  const vy=-(Math.sqrt(2*0.22*(H*.55+Math.random()*H*.3)));
  things.push({x,y:H+r,vx,vy,r,bomb,rot:Math.random()*6,vr:(Math.random()-.5)*.08});
}
function drawVirus(t){
  cx.save();cx.translate(t.x,t.y);cx.rotate(t.rot);
  if(t.bomb){
    cx.fillStyle="#2B2B3A";cx.beginPath();cx.arc(0,0,t.r,0,Math.PI*2);cx.fill();
    cx.strokeStyle="#8A6A3A";cx.lineWidth=4;cx.beginPath();cx.moveTo(0,-t.r);cx.quadraticCurveTo(8,-t.r-12,16,-t.r-8);cx.stroke();
    cx.fillStyle="#FFB627";cx.beginPath();cx.arc(17,-t.r-9,5,0,Math.PI*2);cx.fill();
    cx.fillStyle="#FFFFFF";cx.font="bold 14px Jua, sans-serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText("주름",0,1);
  }else{
    cx.fillStyle="#3E8E41";
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2;cx.beginPath();cx.arc(Math.cos(a)*t.r*1.05,Math.sin(a)*t.r*1.05,t.r*.2,0,Math.PI*2);cx.fill()}
    cx.fillStyle="#7BC96F";cx.beginPath();cx.arc(0,0,t.r,0,Math.PI*2);cx.fill();
    cx.fillStyle="#E8E8E8";cx.beginPath();cx.ellipse(0,-t.r*.62,t.r*.55,t.r*.22,0,0,Math.PI*2);cx.fill(); // grey hair
    cx.fillStyle="#20314A";cx.beginPath();cx.arc(-t.r*.3,-t.r*.05,t.r*.11,0,Math.PI*2);cx.arc(t.r*.3,-t.r*.05,t.r*.11,0,Math.PI*2);cx.fill();
    cx.strokeStyle="#20314A";cx.lineWidth=3;cx.beginPath();cx.arc(0,t.r*.35,t.r*.22,Math.PI*1.15,Math.PI*1.85);cx.stroke();
    cx.strokeStyle="rgba(32,49,74,.5)";cx.lineWidth=2;cx.beginPath();cx.moveTo(-t.r*.45,-t.r*.3);cx.lineTo(-t.r*.15,-t.r*.32);cx.moveTo(t.r*.15,-t.r*.32);cx.lineTo(t.r*.45,-t.r*.3);cx.stroke();
  }
  cx.restore();
}
function segHit(ax,ay,bx,by,px,py,r){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy||1;let u=((px-ax)*dx+(py-ay)*dy)/l;u=Math.max(0,Math.min(1,u));const qx=ax+u*dx-px,qy=ay+u*dy-py;return qx*qx+qy*qy<=r*r}

let down=false;
cv.addEventListener("pointerdown",e=>{down=true;trail=[{x:e.clientX,y:e.clientY,t:performance.now()}];cv.setPointerCapture&&cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{if(!down||!playing)return;const p={x:e.clientX,y:e.clientY,t:performance.now()};const q=trail[trail.length-1];trail.push(p);if(q)slice(q,p)});
addEventListener("pointerup",()=>{down=false});addEventListener("pointercancel",()=>{down=false});

function slice(a,b){
  let n=0;
  for(const t of things){ if(t.dead)continue;
    if(segHit(a.x,a.y,b.x,b.y,t.x,t.y,t.r)){t.dead=true;
      if(t.bomb){sfx.bomb();age=Math.min(AGE_START,age+10);pops.push({x:t.x,y:t.y,txt:"+10살 😵",c:"#2B2B3A",life:1});boom(t,"#2B2B3A")}
      else{n++;score++;age=Math.max(AGE_MIN,age-STEP);halfs(t);boom(t,"#7BC96F")}
    }}
  if(n){if(n>1)sfx.combo();else sfx.cut();pops.push({x:b.x,y:b.y-20,txt:n>1?`콤보 ${n}! -${n*STEP+n}살`:`-${STEP}살 ✨`,c:"#FF6F91",life:1});if(n>1){age=Math.max(AGE_MIN,age-n)}}
}
function halfs(t){for(const s of [-1,1])halves.push({x:t.x,y:t.y,vx:t.vx+s*2,vy:t.vy-1,r:t.r,rot:t.rot,s,life:1})}
function boom(t,c){if(reduce)return;for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,v=2+Math.random()*4;sparks.push({x:t.x,y:t.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c,life:1})}}

function bg(){const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#BFE6FF");g.addColorStop(1,"#FFF4D6");cx.fillStyle=g;cx.fillRect(0,0,W,H);
  drawFace(cx,age,W/2,H*.58,Math.min(W,H)*.16);cx.globalAlpha=1}
function loop(ts){
  const dt=Math.min(32,ts-(last||ts));last=ts;const k=dt/16.7;
  bg();
  if(playing){
    timeLeft-=dt/1000;spawnT-=dt;
    if(spawnT<=0){const burst=1+(Math.random()<.35?1:0)+(timeLeft<20&&Math.random()<.4?1:0);for(let i=0;i<burst;i++)spawn();spawnT=650+Math.random()*450-(ROUND-timeLeft)*5}
    if(timeLeft<=0){finish()}
  }
  for(const t of things){t.x+=t.vx*k;t.y+=t.vy*k;t.vy+=.22*k;t.rot+=t.vr*k;if(!t.dead)drawVirus(t)}
  things=things.filter(t=>!t.dead&&t.y<H+80);
  for(const h of halves){h.x+=h.vx*k;h.y+=h.vy*k;h.vy+=.25*k;h.life-=.02*k;cx.save();cx.globalAlpha=Math.max(0,h.life);cx.translate(h.x,h.y);cx.rotate(h.rot+h.s*.6);cx.beginPath();cx.arc(0,0,h.r,h.s>0?-Math.PI/2:Math.PI/2,h.s>0?Math.PI/2:Math.PI*1.5);cx.fillStyle="#7BC96F";cx.fill();cx.restore()}
  halves=halves.filter(h=>h.life>0);
  for(const s of sparks){s.x+=s.vx*k;s.y+=s.vy*k;s.life-=.03*k;cx.globalAlpha=Math.max(0,s.life);cx.fillStyle=s.c;cx.beginPath();cx.arc(s.x,s.y,4,0,Math.PI*2);cx.fill()}
  cx.globalAlpha=1;sparks=sparks.filter(s=>s.life>0);
  for(const p of pops){p.y-=.8*k;p.life-=.02*k;cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;cx.font="26px Jua, sans-serif";cx.textAlign="center";cx.fillText(p.txt,p.x,p.y)}
  cx.globalAlpha=1;pops=pops.filter(p=>p.life>0);
  const now=performance.now();trail=trail.filter(p=>now-p.t<140);
  if(trail.length>1){cx.strokeStyle="rgba(255,255,255,.9)";cx.lineCap="round";cx.lineJoin="round";cx.lineWidth=7;cx.beginPath();cx.moveTo(trail[0].x,trail[0].y);for(const p of trail)cx.lineTo(p.x,p.y);cx.stroke()}
  if(playing){$("age").textContent=Math.round(age);$("time").textContent=Math.max(0,Math.ceil(timeLeft));$("score").textContent=score}
  requestAnimationFrame(loop);
}
function start(){things=[];halves=[];sparks=[];pops=[];age=AGE_START;score=0;timeLeft=ROUND;spawnT=300;playing=true;
  $("start").hidden=true;$("end").hidden=true;$("hud").hidden=false}
function finish(){playing=false;$("hud").hidden=true;const a=Math.round(age);
  $("endTitle").textContent=a<=20?`${a}살! 완전 젊어졌어요!`:`${a}살이 됐어요!`;
  $("endText").textContent=`노화 바이러스 ${score}마리를 벴어요.`;
  let best=null;try{best=JSON.parse(localStorage.getItem("agegame-best")||"null")}catch(_){}
  if(!best||a<best.age){best={age:a,score};try{localStorage.setItem("agegame-best",JSON.stringify(best))}catch(_){}}
  $("best").textContent=`최고 기록: ${best.age}살 (${best.score}마리)`;
  paintFaceCanvas("faceEnd",a);$("end").hidden=false;sfx.end()}
function syncOpts(){document.querySelectorAll(".opt[data-step]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.step===STEP)));$("snd").setAttribute("aria-pressed",String(SOUND));$("snd").textContent=SOUND?"켜짐 🔊":"꺼짐 🔇";try{localStorage.setItem("agegame-opts",JSON.stringify({step:STEP,sound:SOUND}))}catch(_){}}
document.querySelectorAll(".opt[data-step]").forEach(b=>b.addEventListener("click",()=>{STEP=+b.dataset.step;syncOpts()}));
$("snd").addEventListener("click",()=>{SOUND=!SOUND;syncOpts();sfx.cut()});syncOpts();
$("go").addEventListener("click",start);$("again").addEventListener("click",start);
requestAnimationFrame(loop);
</script>

</body>
</html>
