<style>
:root{--wall:#0B0B0C;--panel:rgba(16,17,16,.94);--line:#2A2A27;--ink:#EDEDE8;--soft:#C9C9C2;--mute:#9A9A93;--green:#7CFFB2;--acc:#7CFFB2;
--fd:"Nanum Myeongjo","Batang",serif;--fb:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
*,::before,::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wall);color:var(--ink);font-family:var(--fb);-webkit-text-size-adjust:100%}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.mono{font-family:var(--fm);letter-spacing:.2em;text-transform:uppercase;font-size:11px}

/* 상단 */
#top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;
 padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
 background:linear-gradient(rgba(11,11,12,.85),rgba(11,11,12,0));pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none}
.brand img{width:28px;height:28px}
.brand span{font-family:var(--fm);font-size:12px;letter-spacing:.3em}
#where{font-family:var(--fm);font-size:11px;letter-spacing:.2em;color:var(--acc);text-transform:uppercase;text-align:right}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;background:rgba(11,11,12,.6);text-decoration:none;white-space:nowrap}
.chip:hover{border-color:var(--acc);color:var(--acc)}

/* 하단 조작 */
#hud{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;
 padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
 background:linear-gradient(rgba(11,11,12,0),rgba(11,11,12,.9))}
#hud .nav{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;background:rgba(11,11,12,.7);padding:4px}
#hud .nav button{width:42px;height:42px;border-radius:50%;font-size:20px}
#hud .nav button:hover{background:#1c1d1b;color:var(--acc)}
#count{font-family:var(--fm);font-size:12px;letter-spacing:.15em;min-width:70px;text-align:center;color:var(--soft)}
#hud.off{display:none}

/* 작품 패널 */
#panel{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 32px));
 background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:4px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;
 max-height:calc(100% - 180px);overflow:auto;transition:opacity .35s,transform .35s}
#panel.hide{opacity:0;transform:translateY(12px);pointer-events:none}
#panel .meta{font-family:var(--fm);font-size:11px;letter-spacing:.15em;color:var(--acc);text-transform:uppercase}
#panel h2{font-family:var(--fd);font-weight:800;font-size:26px;line-height:1.2;margin:0;text-wrap:balance}
#panel p{margin:0;color:var(--soft);font-size:14px;line-height:1.65}
#panel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.5;color:var(--soft)}
#panel li{padding-left:14px;position:relative}
#panel li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:1px;background:var(--acc)}
#panel .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
#panel .acts a,#panel .acts button{border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:8px 14px;font-size:13px;text-decoration:none}
#panel .acts a:hover,#panel .acts button:hover{background:var(--acc);color:#0B0B0C}
#panel .x{position:absolute;right:10px;top:8px;width:30px;height:30px;color:var(--mute);font-size:18px}

/* 엘리베이터 */
#elev{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(5,5,6,.72);backdrop-filter:blur(6px);
 padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#elev[hidden]{display:none}
#elev .box{width:min(360px,100%);background:#111211;border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:8px}
#elev .box>.mono{color:var(--mute);margin-bottom:6px}
#elev .fl{display:flex;align-items:center;gap:14px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;text-align:left}
#elev .fl b{font-family:var(--fm);font-size:15px;width:34px}
#elev .fl span{display:flex;flex-direction:column;font-size:14px}
#elev .fl small{color:var(--mute);font-size:12px}
#elev .fl:hover,#elev .fl[aria-current]{border-color:var(--c);background:#181917}
#elev .fl[aria-current] b{color:var(--c)}
#elev .close{margin-top:8px;color:var(--mute);font-size:13px}

/* 바깥 · 입구 화면 */
#gate{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;justify-content:flex-end;gap:18px;
 padding:24px max(20px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));

#gate>*{pointer-events:auto;max-width:640px}
#gate.gone{opacity:0}
#gate.gone>*{pointer-events:none}
#gate h1{word-break:keep-all;font-family:var(--fd);font-weight:800;font-size:clamp(38px,8vw,72px);line-height:1.1;margin:0;letter-spacing:-.02em}
#gate p{margin:0;color:var(--soft);font-size:16px;line-height:1.7;max-width:34em}
#gate .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#enter{background:var(--green);color:#0B0B0C;border-radius:999px;padding:14px 26px;font-weight:500;font-size:16px}
#enter:hover{filter:brightness(1.1)}
#gate .hint{font-size:12px;color:var(--mute)}

/* 장면 전환 */
#fade{position:fixed;inset:0;z-index:9;background:#050506;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:1;transition:opacity .6s;pointer-events:none}
#fade.clear{opacity:0}
#fade b{font-family:var(--fm);font-size:56px;color:var(--acc);letter-spacing:.1em}
#fade span{font-family:var(--fd);font-size:20px}
#nogl{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
@media (max-width:560px){#panel{right:16px;left:16px;width:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-height:46%}#panel h2{font-size:22px}#top .chip.hide-s{display:none}}
@media (prefers-reduced-motion:reduce){#panel,#gate,#fade{transition:none}}

 if(it.href)lnk(it.hrefL||"보기",it.href);
 if(it.ext)lnk(it.ext[0]+"에서 보기 ↗",it.ext[1],1);
 (it.links||[]).forEach(function(x){lnk(x[0],x[1],1);});
 var S=SP[spaceKey];
 if(S.page&&!it.go&&!it.href){lnk(it.sign?"이 층 전체 보기":"자세히 보기",S.page+(it.sign||spaceKey==="noin"?"":"#"+encodeURIComponent(it.t)));}
 if(it.sign&&spaceKey!=="lobby"){var k=ORDER.indexOf(spaceKey);if(k<ORDER.length-1)btn("위층으로 ↑",function(){show(ORDER[k+1]);});}
 $("panel").classList.remove("hide");
}
function closePanel(){$("panel").classList.add("hide");}
$("px").onclick=closePanel;

/* ---------------- 엘리베이터 ---------------- */
function openElev(){
 var L=$("elevList");L.innerHTML="";
 ["f6","f5","f4","f3","f2","noin","lobby"].forEach(function(k){var S=SP[k],b=document.createElement("button");b.className="fl";b.style.setProperty("--c",S.c);
  if(k===spaceKey)b.setAttribute("aria-current","true");
  b.innerHTML="<b></b><span><span></span><small></small></span>";b.querySelector("b").textContent=k==="noin"?"SP":S.n;
  b.querySelector("span span").textContent=k==="noin"?"기획전 『노인의 시대』":S.name;
  b.querySelector("small").textContent=k==="lobby"?"감독실 · 안내 데스크":k==="noin"?"올드만 · 카니발 · 신곡":S.items.map(function(x){return x.t}).slice(0,3).join(" · ");
  b.onclick=function(){if(k===spaceKey){$("elev").hidden=true;return;}show(k);};L.appendChild(b);});
 $("elev").hidden=false;
}
$("elevBtn").onclick=openElev;$("elevClose").onclick=function(){$("elev").hidden=true;};
$("elev").addEventListener("click",function(e){if(e.target===$("elev"))$("elev").hidden=true;});
$("lobbyBtn").onclick=function(){if(spaceKey!=="lobby")show("lobby");else goFrame(-1);};
$("prev").onclick=function(){goFrame(cur-1);};$("next").onclick=function(){goFrame(cur+1);};

/* ---------------- 입력 ---------------- */
var ray=new THREE.Raycaster(),ptr=new THREE.Vector2(),down=null;
canvas.addEventListener("pointerdown",function(e){down={x:e.clientX,y:e.clientY,t:Date.now()};});
canvas.addEventListener("pointermove",function(e){
 look.tx=(e.clientX/innerWidth-.5)*-.5;look.ty=(e.clientY/innerHeight-.5)*-.25;
 if(e.pointerType==="mouse"){ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);canvas.style.cursor=ray.intersectObjects(clickables).length?"pointer":"grab";}
});
canvas.addEventListener("pointerup",function(e){
 if(!down)return;var dx=e.clientX-down.x,dy=e.clientY-down.y,dt=Date.now()-down.t;down=null;
 if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)&&dt<700&&spaceKey){goFrame(cur+(dx<0?1:-1));return;}
 if(Math.abs(dx)>8||Math.abs(dy)>8)return;
 ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);
 var hit=ray.intersectObjects(clickables)[0];if(!hit)return;
 if(hit.object.userData.door){enter();return;}
 var i=hit.object.userData.idx;if(i==null)return;
 if(i===cur)openPanel(frames[i].it);else goFrame(i);
});
addEventListener("keydown",function(e){
 if(!spaceKey){if(e.key==="Enter")enter();return;}
 if(e.key==="ArrowRight")goFrame(cur+1);else if(e.key==="ArrowLeft")goFrame(cur-1);
 else if(e.key==="Escape"){if(!$("elev").hidden)$("elev").hidden=true;else closePanel();}
});

/* ---------------- 입장 ---------------- */
var entered=false;
function enter(){if(entered)return;entered=true;$("gate").classList.add("gone");
 glide(new THREE.Vector3(0,1.1,1.2),new THREE.Vector3(0,1.05,-4),1.6,function(){show("lobby");});}
$("enter").onclick=enter;

/* ---------------- 루프 ---------------- */
var clock=new THREE.Clock();
function loop(){
 var dt=Math.min(clock.getDelta(),.05);
 if(tw){var tt=(performance.now()-tw.s)/tw.d,k=ease(Math.min(tt,1));camPos.lerpVectors(tw.p0,tw.p1,k);camLook.lerpVectors(tw.l0,tw.l1,k);if(tt>=1){var cb=tw.cb;tw=null;if(cb)cb();}}
 look.x+=(look.tx-look.x)*.05;look.y+=(look.ty-look.y)*.05;
 camera.position.copy(camPos);
 var dir=camLook.clone().sub(camPos),len=dir.length();
 var yaw=Math.atan2(dir.x,dir.z)+look.x,pitch=Math.asin(dir.y/len)+look.y;
 camera.lookAt(camPos.x+Math.sin(yaw)*Math.cos(pitch)*len,camPos.y+Math.sin(pitch)*len,camPos.z+Math.cos(yaw)*Math.cos(pitch)*len);
 renderer.render(scene,camera);requestAnimationFrame(loop);
}

/* ---------------- 시작 ---------------- */
var fontsReady=document.fonts&&document.fonts.load?Promise.all([document.fonts.load('800 80px "Nanum Myeongjo"'),document.fonts.load('400 30px "IBM Plex Sans KR"'),document.fonts.load('500 30px "IBM Plex Mono"')]).catch(function(){}):Promise.resolve();
var timeout=new Promise(function(r){setTimeout(r,2500);});
Promise.race([fontsReady,timeout]).then(function(){
 var h=(location.hash||"").slice(1);
 if(SP[h]){entered=true;$("gate").classList.add("gone");loop();show(h,true);return;}
 group=buildExterior();scene.add(group);loop();
 setTimeout(function(){$("fade").classList.add("clear");},100);
});
})();
</script>
</body>
</html>
