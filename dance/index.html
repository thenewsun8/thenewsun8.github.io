<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="댄스 파티"><meta name="theme-color" content="#1a0f33">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%;color-scheme:dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>서준이 댄스 파티</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--ink:#1a0f33;--panel:#2e2152;--cream:#fff6e5;--muted:#cdbfee;--hot:#ff4fa3;--gold:#ffc93a;--blue:#3a8cff;
 --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--ink);color:var(--cream);font-family:var(--display);overflow:hidden;box-sizing:border-box;
 padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:6px;box-sizing:border-box;max-width:620px;margin:0 auto}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:34px}
h1{margin:0;font-weight:400;font-size:clamp(16px,4.8vw,21px);color:var(--hot);white-space:nowrap}
.hbtn{white-space:nowrap;font-family:var(--display);font-size:14px;border:0;border-radius:999px;padding:5px 11px;background:var(--panel);color:var(--cream);cursor:pointer}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
#cv{display:block;touch-action:none;border-radius:18px;box-shadow:0 14px 44px rgba(0,0,0,.55)}
.sheet{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:16px 16px 20px;box-sizing:border-box;text-align:center;border-radius:18px;background:linear-gradient(to bottom,rgba(26,15,51,.55),rgba(26,15,51,.95) 30%);overflow-y:auto}
.sheet.mid{justify-content:center}
.sheet h2{margin:4px 0 0;font-weight:400;font-size:30px;color:var(--gold);text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.sheet p{margin:0;font-size:15px;color:var(--muted);line-height:1.45;max-width:32ch}
.sheet .stars{font-size:46px;color:var(--gold);letter-spacing:.08em;line-height:1}
.big{font-size:44px;color:#fff;line-height:1}
.unlock{background:var(--panel);border-radius:14px;padding:9px 16px;font-size:17px;color:var(--cream)}
.unlock b{font-weight:400;color:var(--gold)}
.who{display:flex;gap:10px}
.dbtn{font-family:var(--display);border:4px solid transparent;border-radius:18px;background:var(--panel);color:var(--cream);padding:4px 6px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.dbtn.on{border-color:var(--gold);background:#43307a}
.dbtn canvas{width:96px;height:110px;border-radius:12px}
.dbtn b{font-weight:400;font-size:18px}
.modes{display:flex;gap:6px;background:var(--panel);border-radius:999px;padding:4px}
.mbtn{font-family:var(--display);font-size:15px;border:0;border-radius:999px;padding:7px 14px;background:none;color:var(--muted);cursor:pointer}
.mbtn.on{background:var(--hot);color:#fff}
.songs{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:400px}
.song{font-family:var(--display);border:0;border-radius:16px;padding:10px 8px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.35);text-align:center}
.song b{font-weight:400;font-size:17px;line-height:1.15}
.song small{font-size:12px;opacity:.9}
.song:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.go{font-family:var(--display);font-size:22px;border:0;border-radius:16px;padding:12px 28px;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.go.gold{background:var(--gold);color:var(--ink)}.go.gray{background:#4a4070}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tip{font-size:13px!important;opacity:.85}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>

<div class="app">
 <div class="bar"><h1>서준이 댄스 파티</h1><div><button type="button" class="hbtn" id="snd">소리</button></div></div>
 <div class="stage" id="stage">
  <canvas id="cv" aria-label="댄스 무대. 춤 선생님을 따라 춤추면 점수가 올라가요."></canvas>

  <div class="sheet" id="title">
   <h2>춤 따라 추기!</h2>
   <div class="who">
    <button type="button" class="dbtn on" data-who="0"><canvas width="192" height="220"></canvas><b>하티</b></button>
    <button type="button" class="dbtn" data-who="1"><canvas width="192" height="220"></canvas><b>포니</b></button>
   </div>
   <div class="modes"><button type="button" class="mbtn on" data-m="cam">카메라로 춤추기</button><button type="button" class="mbtn" data-m="touch">손가락으로 하기</button></div>
   <p id="modeTip">폰을 세워 두고 두세 걸음 뒤로 가요. 머리부터 배꼽까지 화면에 보이면 돼요. 춤을 따라 추면 점수가 올라가고, 가만히 있으면 점수가 내려가요!</p>
   <div class="songs" id="songs"></div>
   <p class="tip">카메라 영상은 이 폰 안에서만 쓰여요. 어디에도 보내지 않아요.</p>
  </div>

  <div class="sheet mid" id="result" hidden>
   <h2 id="rTitle">댄스왕!</h2>
   <div class="stars" id="rStars"></div>
   <div class="big" id="rScore">0</div>
   <p id="rText"></p>
   <div class="unlock" id="rBest"></div>
   <div class="row"><button type="button" class="go" id="againBtn">한 번 더!</button><button type="button" class="go gold" id="menuBtn">다른 노래</button></div>
  </div>
 </div>
</div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d");
const W=500,H=860,TAU=Math.PI*2,FLOOR=440,LANEY=505,JX=86,SPB=92,CAMY=548,CAMH=H-CAMY;
const FONT='"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t;
const pick=(arr,r)=>arr[Math.floor((r==null?Math.random():r)*arr.length)%arr.length];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let T=0;
const MP="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL="https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";

/* ===== 저장 ===== */
const SAVE="dance.save";
let save={who:0,mode:"cam",snd:true,best:{}};
try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE)||"{}"))}catch(e){}
if(!save.best||typeof save.best!=="object")save.best={};
const store=()=>{try{localStorage.setItem(SAVE,JSON.stringify(save))}catch(e){}};
let sound=save.snd!==false;

/* ===== 그리기 도우미 (C 는 지금 그리는 캔버스) ===== */
let C=ctx;
const F=c=>{C.fillStyle=c};
function circ(x,y,r,c){F(c);C.beginPath();C.arc(x,y,r,0,TAU);C.fill()}
function ell(x,y,rx,ry,c,rot){F(c);C.beginPath();C.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),rot||0,0,TAU);C.fill()}
function rect(x,y,w,h,c){F(c);C.fillRect(x,y,w,h)}
function rr(x,y,w,h,r,c){F(c);C.beginPath();C.roundRect(x,y,w,h,r);C.fill()}
function poly(p,c){F(c);C.beginPath();C.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)C.lineTo(p[i],p[i+1]);C.closePath();C.fill()}
function line(x1,y1,x2,y2,c,w){C.strokeStyle=c;C.lineWidth=w;C.lineCap="round";C.beginPath();C.moveTo(x1,y1);C.lineTo(x2,y2);C.stroke()}
function star(x,y,ro,ri,n,c){F(c);C.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,r=i%2?ri:ro;C.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}C.closePath();C.fill()}
function heart(x,y,s,c){F(c);C.beginPath();C.moveTo(x,y+s*.9);C.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.8,y-s*1.15,x,y-s*.45);C.bezierCurveTo(x+s*.8,y-s*1.15,x+s*1.5,y-s*.1,x,y+s*.9);C.fill()}
function text(t,x,y,sz,c,al,w){C.font=sz+"px "+FONT;C.textAlign=al||"center";C.textBaseline="middle";if(w){C.lineWidth=w;C.strokeStyle="rgba(0,0,0,.55)";C.lineJoin="round";C.strokeText(t,x,y)}F(c);C.fillText(t,x,y)}
const sh=(x,y,rx)=>ell(x,y,rx,rx*.38,"rgba(0,0,0,.2)");

/* ===== 사람 그리기 도구 ===== */
const SPR=1.28,OL="rgba(40,22,28,.62)",SKIN="#f5c6a0",SKIN_D="#dca07c",SKIN_L="#ffe2cc",EINK="#23235e";
const angDiff=(a,b)=>Math.abs(((a-b)%TAU+TAU*1.5)%TAU-Math.PI);
function tint(hex,a){const n=parseInt(hex.slice(1),16),t=a>0?255:0,k=Math.abs(a);return"rgb("+[n>>16,n>>8&255,n&255].map(v=>Math.round(v+(t-v)*k)).join(",")+")"}
function seg(x1,y1,x2,y2,w,c){C.lineCap="round";C.beginPath();C.moveTo(x1,y1);C.lineTo(x2,y2);C.strokeStyle=OL;C.lineWidth=w+3;C.stroke();C.strokeStyle=c;C.lineWidth=w;C.stroke()}
function seg2(p,w,c){C.lineCap="round";C.lineJoin="round";C.beginPath();C.moveTo(p[0][0],p[0][1]);C.lineTo(p[1][0],p[1][1]);C.lineTo(p[2][0],p[2][1]);C.strokeStyle=OL;C.lineWidth=w+3;C.stroke();C.strokeStyle=c;C.lineWidth=w;C.stroke()}
/* 두 마디 관절: 어깨(엉덩이)에서 손(발)까지, 팔꿈치(무릎)가 어디로 굽을지 계산 */
function ik(sx,sy,tx,ty,l1,l2,bend){const dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy)||1,m=Math.min(d,l1+l2-.5),a=Math.atan2(dy,dx),A=Math.acos(clamp((l1*l1+m*m-l2*l2)/(2*l1*m),-1,1)),k=a+bend*A;return[[sx,sy],[sx+Math.cos(k)*l1,sy+Math.sin(k)*l1],[sx+Math.cos(a)*m,sy+Math.sin(a)*m]]}
function oell(x,y,rx,ry,c,rot){F(c);C.beginPath();C.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);C.fill();C.strokeStyle=OL;C.lineWidth=1.6;C.stroke()}
function lg(x0,y0,x1,y1,a,b){const g=C.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g}
function radG(x,y,r,a,b,c){const g=C.createRadialGradient(x+r*.3,y-r*.4,r*.08,x,y,r*1.1);g.addColorStop(0,a);g.addColorStop(.5,b);g.addColorStop(1,c);return g}
function heartP(x,y,s){C.beginPath();C.moveTo(x,y+s*.9);C.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.8,y-s*1.15,x,y-s*.45);C.bezierCurveTo(x+s*.8,y-s*1.15,x+s*1.5,y-s*.1,x,y+s*.9);C.closePath()}

/* ===== 대머리 뚱땡이 (안경·모자 없음, 그냥 대머리) ===== */
function drawInkKnife(x,y,a,k){
 C.save();C.translate(x,y);C.rotate(a);C.scale(k,k);
 rr(-7,-3.5,15,7,2,"#5a3420");for(let i=0;i<3;i++)rect(-5+i*4,-3.5,1.6,7,"#3a2010");
 rr(7,-7,4,14,2,"#c9a045");
 C.beginPath();C.moveTo(11,-4.5);C.lineTo(44,-5.5);C.quadraticCurveTo(54,-2,57,1);C.lineTo(11,4.5);C.closePath();F(lg(0,-5,0,4,"#eef2f8","#98a4b6"));C.fill();C.strokeStyle=OL;C.lineWidth=1.2;C.stroke();
 C.beginPath();C.moveTo(22,0);C.lineTo(50,-1.5);C.quadraticCurveTo(54,-.5,57,1);C.lineTo(22,4.4);C.closePath();F(EINK);C.fill();
 for(let i=0;i<3;i++){const dx=27+i*9,len=3+((T*2.5+i*.37)%1)*6;rr(dx-1.2,3,2.4,len,1.2,EINK);circ(dx,3+len,1.9,EINK)}
 C.restore();
}
function fatPose(e,mv){
 const sw=Math.sin(e.walk),ns=[14,-88],pol=(th,r)=>[ns[0]+Math.cos(th)*r,ns[1]+Math.sin(th)*r];
 let near,far,ka;
 switch(e.dying>0?"die":e.state){
  case "wind":case "twind":{const th=-1.75+Math.sin(T*45)*.06;near=pol(th,38);ka=th-.7;far=[-26,-96];break}
  case "swing":{const t=clamp(1-e.st/e.swT,0,1),q=1-Math.pow(1-t,3),th=-1.75+2.85*q;near=pol(th,38);ka=th+.25;far=[-24,-70];break}
  case "rest":near=[30,-62];ka=.9;far=[-14,-60];break;
  case "flee":near=[18+Math.sin(T*22)*5,-124];ka=-1.7;far=[-18+Math.cos(T*22)*5,-122];break;
  case "taunt":{const b=Math.sin(T*16)>0;near=[30,b?-64:-74];ka=-.4;far=[24,b?-74:-64];break}
  case "cwind":near=[-6,-64];ka=2.6;far=[-30,-66];break;
  case "charge":near=[-10,-58];ka=2.8;far=[-30,-60];break;
  case "summon":near=[22,-126];ka=-1.5;far=[-10,-128];break;
  case "slip":case "die":near=[34,-70+Math.sin(T*18)*6];ka=-.3;far=[-28,-74+Math.cos(T*18)*6];break;
  default:near=[30-sw*6*mv,-60];ka=-.75;far=[-18+sw*8*mv,-60];
 }
 return{near,far,ka};
}
function drawFatty(x,y,e){
 const s=e.r/24,boss=e.type==="boss";
 C.save();C.translate(x,y);sh(0,0,30*s);
 C.scale(s*e.face,s);
 const mv=(e.state==="walk"||e.state==="flee"||e.state==="charge")&&!(e.dying>0)?1:0,w=e.walk;
 let rot=0;
 if(e.dying>0){const t=1-e.dying/e.dieMax;rot=-1.45*Math.min(1,t/.3);if(t>.3&&t<.5)C.translate(0,-Math.sin((t-.3)/.2*Math.PI)*9)}
 else if(e.state==="slip"){const t=1-e.st/e.slipMax;rot=t<.12?-1.45*t/.12:t>.85?-1.45*(1-(t-.85)/.15):-1.45}
 else{if(e.state==="wind"||e.state==="cwind"||e.state==="twind")rot=-.14+Math.sin(T*50)*.02;else if(e.state==="swing")rot=.22;else if(e.state==="charge")rot=.3;rot-=e.hurt*1.6}
 C.rotate(rot);
 const lying=rot<-1;
 const H=fatPose(e,mv);
 if(boss){const fl=Math.sin(T*5)*5;poly([-14,-96,12,-96,-34+fl,-2,-52+fl,-10],"#b0102a");poly([-14,-96,-4,-96,-46+fl,-6,-52+fl,-10],"#ffd24d")}
 // 다리
 for(const i of [0,1]){const ph=w+i*Math.PI,hx=i?9:-7;let fx,fy;
  if(lying){fx=hx+16+Math.sin(T*20+i*2)*4;fy=-12}else{fx=hx+(mv?Math.sin(ph)*10:(i?4:-3));fy=mv?-Math.max(0,Math.cos(ph))*6:0}
  const p=ik(hx,-36,fx,fy,19,19,-1);seg2(p,13,i?e.pants:e.pantsD);oell(p[2][0]+5,p[2][1]-3,10,5,"#2a2a30")}
 // 먼 팔
 const fa=ik(-12,-86,H.far[0],H.far[1],20,19,1);seg2(fa,10,SKIN_D);oell(fa[2][0],fa[2][1],6.2,5.6,SKIN_D);
 // 바지 허리
 rr(-24,-46,50,13,5,e.pants);
 // 배 (러닝셔츠 + 삐져나온 뱃살)
 const jig=mv?Math.sin(w*2)*1.8:0,bx=4,by=-66,brx=30+jig*.5,bry=31-jig;
 C.beginPath();C.ellipse(bx,by,brx,bry,0,0,TAU);F(radG(bx+8,by,34,e.shirtL,e.shirt,e.shirtD));C.fill();
 C.save();C.beginPath();C.ellipse(bx,by,brx,bry,0,0,TAU);C.clip();
 if(e.stripe)for(let yy=-98;yy<-44;yy+=9)rect(-34,yy,74,4.5,e.stripe);
 F(radG(bx+12,by+22,30,SKIN_L,SKIN,SKIN_D));C.beginPath();C.ellipse(bx+6,by+31,31,13,0,0,TAU);C.fill();
 for(const k of e.inks)if(!k.h)circ(k.x,k.y,k.r,e.inkC);
 C.restore();
 C.beginPath();C.ellipse(bx,by,brx,bry,0,0,TAU);C.strokeStyle=OL;C.lineWidth=1.8;C.stroke();
 circ(bx+17,by+24,2.3,"#b9785a");
 rr(-12,-98,7,12,3,e.shirt);rr(10,-98,7,12,3,e.shirt);
 if(boss||e.type==="cap"){rr(-25,-48,52,8,3,"#d9a520");oell(17,-44,6.5,5.5,"#ffd24d");star(17,-44,3.5,1.5,5,"#b0102a")}
 // 머리 (번쩍이는 대머리)
 oell(8,-95,12,6,SKIN_D);
 const hx=6,hy=-110;
 oell(hx,hy,15,16,radG(hx,hy,16,SKIN_L,SKIN,SKIN_D));
 if(boss&&e.phase===2){C.globalAlpha=.32;circ(hx,hy,15,"#ff2020");C.globalAlpha=1}
 ell(hx-4,hy-10,6.5,3.2,"rgba(255,255,255,.8)",-.4);
 if(Math.sin(T*2+e.t)>.93)star(hx-6,hy-13,7,1.6,4,"#fff");
 ell(hx+6,hy+11,10,5.5,"rgba(60,70,95,.24)");
 oell(hx-12,hy+1,3.4,5,SKIN_D);
 const wind=e.state==="wind"||e.state==="swing"||e.state==="cwind"||e.state==="twind"||e.state==="charge"||e.state==="summon";
 const ex=e.dying>0?"x":e.state==="slip"?"dizzy":e.hurt>.04?"ouch":wind?"yell":e.state==="flee"?"scared":e.state==="taunt"?"laugh":"mean";
 const e1=hx+3,e2=hx+10,ey=hy-1;
 if(ex==="x"){for(const q of [e1,e2]){line(q-2.5,ey-2.5,q+2.5,ey+2.5,"#2a1a10",2);line(q-2.5,ey+2.5,q+2.5,ey-2.5,"#2a1a10",2)}}
 else if(ex==="dizzy"){C.strokeStyle="#2a1a10";C.lineWidth=1.4;for(const q of [e1,e2]){C.beginPath();for(let a=0;a<10;a+=.4)C.lineTo(q+Math.cos(a+T*10)*a*.32,ey+Math.sin(a+T*10)*a*.32);C.stroke()}}
 else if(ex==="ouch"){for(const q of [e1,e2]){line(q-2.5,ey-2,q+2,ey,"#2a1a10",2);line(q-2.5,ey+2,q+2,ey,"#2a1a10",2)}}
 else{const big=ex==="scared"?3.4:2.5;for(const q of [e1,e2]){oell(q,ey,big,big*1.05,"#fff");circ(q+(ex==="scared"?0:.9),ey,ex==="scared"?1:1.5,"#1a1010")}}
